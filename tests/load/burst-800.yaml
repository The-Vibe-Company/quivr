# Opt-in: 800 documents arrive at one instant after a 16-document warmup.
# make load args='--scenario tests/load/burst-800.yaml'
version: 1
name: burst-800
seed: 42
corpus:
  records: 16
  words_per_record: 100
duration_seconds: 1
drain_seconds: 240
search:
  concurrency: 0
  users: 1
  mix:
    hybrid: 1
ingestion:
  per_second: 0
  concurrency: 16
  anchor_records: 800
  burst:
    at_seconds: 0
    duration_seconds: 0
    multiplier: 1
alerts: 6
replicas:
  api: 1
  worker: 1
fake_latency_ms:
  embedding: 5
  reranking: 0
  judge: 0
