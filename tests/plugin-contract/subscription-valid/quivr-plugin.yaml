# Baseline subscription test plugin for the Contract Runner (tests/plugin-contract).
# A well-behaved subscription plugin: one decision per evaluation, evidence within bounds.
id: certified.subscription-valid
version: 0.1.0
compatibility:
  engine: ">=0.1.0 <0.2.0"
  plugin_api: ">=0.2.0 <0.3.0"
contributions:
  subscription:
    expression_schema:
      type: object
      additionalProperties: false
      required: [kind, text]
      properties:
        kind: {const: substring}
        text: {type: string, minLength: 1}
    timeout_ms: 5000
run:
  command: [quivr-fake-plugin, ok]
