# Deliberately broken subscription test plugin for the Contract Runner (tests/plugin-contract).
# Evidence that embeds the invocation id, so replaying the idempotency key diverges.
id: broken.subscription-nondeterministic
version: 0.1.0
compatibility:
  engine: ">=0.1.0 <0.3.0"
  plugin_api: ">=0.2.0 <0.3.0"
contributions:
  subscription:
    expression_schema:
      type: object
      additionalProperties: false
      required: [kind, text]
      properties:
        kind: {const: substring}
        text: {type: string, minLength: 1}
    timeout_ms: 5000
run:
  command: [quivr-fake-plugin, nondeterministic]
