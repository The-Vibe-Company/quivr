# Deliberately broken subscription test plugin for the Contract Runner (tests/plugin-contract).
# Never matches, so the fixture's expected match is reported.
id: broken.subscription-unexpected-decision
version: 0.1.0
compatibility:
  engine: ">=0.1.0 <0.2.0"
  plugin_api: ">=0.2.0 <0.3.0"
contributions:
  subscription:
    expression_schema:
      type: object
      additionalProperties: false
      required: [kind, text]
      properties:
        kind: {const: substring}
        text: {type: string, minLength: 1}
    timeout_ms: 5000
run:
  command: [quivr-fake-plugin, never-match]
