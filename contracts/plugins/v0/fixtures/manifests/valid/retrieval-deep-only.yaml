id: example.fusion
version: 0.1.0
description: A retrieval plugin that serves only deep; the deployment routes default elsewhere.
compatibility:
  engine: ">=0.1.0 <0.2.0"
  plugin_api: ">=0.7.0 <0.8.0"
contributions:
  retrieval:
    profiles:
      deep:
        description: The default candidates, re-ranked.
        max_latency_ms: 3000
        max_cost_cents: 1
    limits:
      max_rounds: 2
      max_requests: 2
      max_candidates: 20
      max_response_bytes: 65536
