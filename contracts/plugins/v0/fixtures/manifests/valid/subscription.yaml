# An alert-rule plugin (Plugin API 0.2): a subscription Contribution whose
# expression schema discriminates alert kinds with a oneOf over "kind".
id: example-alerts
version: 0.3.0
description: Decides whether an article matches a saved search.
compatibility:
  engine: ">=0.1.0 <0.2.0"
  plugin_api: ">=0.2.0 <0.3.0"
contributions:
  subscription:
    expression_schema:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, text]
          properties:
            kind: {const: substring}
            text: {type: string, minLength: 1, maxLength: 256}
        - type: object
          additionalProperties: false
          required: [kind, terms]
          properties:
            kind: {const: any_of}
            terms:
              type: array
              minItems: 1
              maxItems: 32
              items: {type: string, minLength: 1}
    configuration_schema:
      type: object
      additionalProperties: false
      properties:
        case_sensitive: {type: boolean}
    max_batch_size: 16
    timeout_ms: 5000
    retry:
      max_attempts: 2
    limits:
      max_response_bytes: 1048576
run:
  command: [python3, -m, example_alerts]
