id: example.deep_retriever
version: 0.1.0
description: Plugin API 0.21 retrieval plugin requesting deep candidate pools.
compatibility:
  engine: ">=0.1.0 <0.3.0"
  plugin_api: ">=0.21.0 <0.22.0"
contributions:
  retrieval:
    profiles:
      default:
        description: Hybrid retrieval with deep candidate pools.
        max_latency_ms: 500
        max_cost_cents: 0
    limits:
      max_rounds: 2
      max_requests: 4
      max_candidates: 250
      max_response_bytes: 1048576
