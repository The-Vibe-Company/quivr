id: example.deep_retriever
version: 0.1.0
description: Deep candidate pool declared under an older Plugin API range.
compatibility:
  engine: ">=0.1.0 <0.3.0"
  plugin_api: ">=0.20.0 <0.21.0"
contributions:
  retrieval:
    profiles:
      default:
        description: Hybrid retrieval requesting more than 100 candidates.
        max_latency_ms: 500
        max_cost_cents: 0
    limits:
      max_rounds: 2
      max_requests: 2
      max_candidates: 250
      max_response_bytes: 1048576
