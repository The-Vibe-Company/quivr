# The push mode (relayed webhook deliveries) is reserved for a later Plugin API version.
id: example-feeds
version: 1.0.0
compatibility:
  engine: ">=0.1.0 <0.2.0"
  plugin_api: ">=0.3.0 <0.4.0"
contributions:
  connector:
    kinds:
      feed:
        config_schema: {type: object}
        default_interval_seconds: 900
        modes: [pull, push]
