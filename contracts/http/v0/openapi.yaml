  /v0/connectors:
    post:
      operationId: createConnector
      description: Create a Connector Instance bound to exactly one authorized Corpus and one Source Namespace.
        Kind-specific config and credential secret are validated against the kind's JSON Schema (see listConnectorKinds); a failure is 422 invalid_config or invalid_credential with field pointing at the offending member. Replaying
        the same idempotency key and request returns the same instance (without re-enabling a disabled one);
        a different request under the same key is 409 idempotency_conflict. Another enabled instance on the
        same Corpus and Source Namespace is 409 source_namespace_in_use. The interval defaults per kind and
        is refused below the deployment floor (30 s by default) with 422 invalid_interval. Deposited
        credentials are write-only and never returned. A deployment without a credential key refuses any
        request carrying a credential with 503 credentials_unavailable (retryable false) before storing or
        digesting it; instances without a credential are unaffected. Commits connector.created in the change
        feed.
      x-required-permissions:
      - connectors:write
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connector'
        default:
          description: Structured error; see contract HTTP mapping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorCreate'
    get:
      operationId: listConnectors
      description: Connector Instances of authorized Corpora, optionally filtered to one Corpus, in stable
        identifier order. Opaque page cursor bound to filter and scope; not a Change Cursor or another
        list page cursor (422 invalid_cursor).
      x-required-permissions:
      - connectors:read
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorPage'
        default:
          description: Structured error; see contract HTTP mapping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: corpus_id
        in: query
        required: false
        schema:
          type: string
          minLength: 1
      - name: page_cursor
        in: query
        required: false
        schema:
          type: string
          minLength: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
  /v0/connector-webhooks/{connector_id}:
    get:
      operationId: relayConnectorChallenge
      description: Public webhook route of one Connector Instance whose kind declares the push mode; the address
        is its webhook_url. There is no API key; the connector plugin verifies the request (a signature, a challenge)
        with the Deposited Credential. A GET is typically a source's verification challenge, relayed to the
        plugin like a delivery.
      security: []
      parameters:
      - name: connector_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        2XX:
          description: The connector plugin accepted the delivery; its items were ingested before this answer.
            The body and content type are the plugin's answer to the source (for example a challenge response).
        4XX:
          description: The connector plugin refused the delivery (for example a bad signature), with its
            own body; nothing changed. 404 names no enabled instance of a kind that declares push; 413 a
            body over 1 MiB.
        '500':
          description: The delivery cannot be processed (the plugin reported an access or source error),
            shown in health.push.
        '503':
          description: Temporarily unavailable (the plugin is unreachable or ingestion is down); retry after
            Retry-After seconds. Polling catches up meanwhile.
    post:
      operationId: relayConnectorDelivery
      description: Relay one delivery the source sends to the Connector Instance. The core passes the raw request
        (a body of at most 1 MiB, lowercase headers) to the connector plugin, which verifies it and returns
        the items it carries. Items converge with those of pull runs on the same Receipts. Deliveries update
        health.push.
      security: []
      parameters:
      - name: connector_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        2XX:
          description: The connector plugin accepted the delivery; its items were ingested before this answer.
            The body and content type are the plugin's answer to the source (for example a challenge response).
        4XX:
          description: The connector plugin refused the delivery (for example a bad signature), with its
            own body; nothing changed. 404 names no enabled instance of a kind that declares push; 413 a
            body over 1 MiB.
        '500':
          description: The delivery cannot be processed (the plugin reported an access or source error),
            shown in health.push.
        '503':
          description: Temporarily unavailable (the plugin is unreachable or ingestion is down); retry after
            Retry-After seconds. Polling catches up meanwhile.
  /v0/connectors/{connector_id}:
    get:
      operationId: getConnector
      description: Read configuration, credential metadata (never the secret) and the last evaluated Connector
        Health. Instances of other Organizations or unauthorized Corpora are 404.
      x-required-permissions:
      - connectors:read
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connector'
        default:
          description: Structured error; see contract HTTP mapping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: connector_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
  /v0/connectors/{connector_id}/disable:
    post:
      operationId: disableConnector
      description: Commit disable. No new acquisition run is scheduled; an in-flight run cannot advance
        the Acquisition Checkpoint afterwards. Repeat is idempotent and disable is absorbing (no re-enable).
        Commits connector.disabled and connector.health_changed.
      x-required-permissions:
      - connectors:write
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connector'
        default:
          description: Structured error; see contract HTTP mapping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: connector_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
  /v0/connectors/{connector_id}/credential:
    put:
      operationId: replaceConnectorCredential
      description: Deposit a new credential version to rotate the current one. The secret is encrypted at
        rest and never returned. Replaying the same key and request is idempotent; a different request under
        the same key is 409 idempotency_conflict. A disabled instance is 409 connector_disabled. Commits
        connector.credential_replaced, and connector.health_changed when the evaluated health changes. A
        deployment without a credential key refuses every rotation with 503 credentials_unavailable
        (retryable false) before storing or digesting it.
      x-required-permissions:
      - connectors:write
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connector'
        default:
          description: Structured error; see contract HTTP mapping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: connector_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialReplace'
  /v0/connectors/{connector_id}/schedule:
    put:
      operationId: changeConnectorSchedule
      description: Set the polling interval of an enabled instance. Setting the current value commits nothing,
        so repeating the request is harmless. A shorter interval pulls the next scheduled run in; a longer
        one applies after the run already scheduled. A disabled instance is 409 connector_disabled; an interval
        below the deployment floor (30 s by default) or above 24 h is 422 invalid_interval with field
        /interval_seconds. Commits connector.schedule_changed only when the interval changes.
      x-required-permissions:
      - connectors:write
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connector'
        default:
          description: Structured error; see contract HTTP mapping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: connector_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleChange'
  /v0/connectors/{connector_id}/runs:
    post:
      operationId: requestConnectorRun
      description: Ask for an acquisition run now instead of at the next scheduled time, for example to
        check again a source that failed. The next run is pulled in, never pushed out, so repeating the
        request changes nothing and a run already in flight answers it. Rate limits still hold -- the run
        starts no sooner than the deployment interval floor (30 s by default) after the previous run ended,
        nor before the Retry-After the source asked for. The run then goes through the usual scheduler lease
        and records its outcome in health, committing connector.health_changed when the state changes; the
        request itself commits no event. run_at is when the run is due; the scheduler starts it within
        seconds after. A disabled instance is 409 connector_disabled.
      x-required-permissions:
      - connectors:write
      responses:
        '202':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorRunRequest'
        default:
          description: Structured error; see contract HTTP mapping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: connector_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
  /v0/connector-kinds:
    get:
      operationId: listConnectorKinds
      description: Connector kinds enabled in this deployment, with the JSON Schemas that validate their
        config and credential secret, so clients can render configuration forms without knowing the kinds.
        credential_deposits tells whether this deployment accepts Deposited Credentials at all; when unavailable,
        any create carrying a credential and every rotation is 503 credentials_unavailable.
      x-required-permissions:
      - connectors:read
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorKindCatalog'
        default:
          description: Structured error; see contract HTTP mapping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v0/admin/plugins:
    get:
      operationId: listPluginRegistrations
      description: Every plugin version this deployment has registered, oldest first, with its endpoint,
        manifest digest, the roles its manifest declares and its state. Quivr never starts a plugin; the
        operator runs it at its endpoint. On first start the registry is seeded, as active registrations,
        from the plugins pinned in the startup configuration. Deployment-wide and not paginated. Requires
        plugins:admin, an operator action that organization keys do not get.
      x-required-permissions:
      - plugins:admin
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginRegistrationList'
        default:
          description: Structured error; 401 unauthenticated, 403 without plugins:admin, 503 storage
            unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v0/admin/plugins/plan:
    get:
      operationId: getActivePipelinePlan
      description: The active Pipeline Plan, an immutable mapping of every role of the deployment to the
        registration serving it. 404 not_found when no plan is active, because the startup configuration
        pins no plugin. Requires plugins:admin.
      x-required-permissions:
      - plugins:admin
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelinePlan'
        default:
          description: Structured error; 401 unauthenticated, 403 without plugins:admin, 404 no active plan,
            503 storage unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v0/search:
    post:
      operationId: searchRecords
      description: Resolve the requested profile, compile mandatory Corpus/Organization prefilters and
        any requested filter, obtain candidates, then canonically hydrate and reauthorize every returned segment. Lexical-first records
        remain eligible without embeddings; semantic-only queries require vector coverage. Profile selection
        does not change access/currentness rules.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        default:
          description: Structured error; 400 malformed, 401 unauthenticated, 403 unauthorized scope/action,
            404 absent/inaccessible, 409 idempotency conflict, 422 unsupported profile/input or
            source_filter_unavailable, 503 dependency unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-required-permissions:
      - content:read
      - search:query
  /v0/corpora/{corpus_id}/rebuilds:
    post:
      operationId: rebuildCorpusProjection
      description: Durably commit a projection_rebuild Operation and dispatch intent before returning.
        Rebuild the requested Corpus from canonical text and durable artifacts, then activate its validated
        logical generation. Same Organization + Corpus + rebuild route + idempotency key and canonical
        request returns the same Operation, including after terminal completion; changed request conflicts.
        HTTP does not wait for reconstruction. Retries/restarts keep identity and target generation. Preserve
        other Corpora when physical storage is shared. Normal ingestion/withdrawal guards still apply.
        Live evaluation schema migrations remain a separate mechanism. Activation follows acceptance
        order, so a rebuild accepted before one that already activated for the same Corpus and retrieval
        configuration fails with operation_superseded instead of replacing it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '202':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
          headers:
            Location:
              description: Authorized Operation read URL.
              schema:
                type: string
                format: uri-reference
        default:
          description: Structured error; 400 malformed, 401 unauthenticated, 403 unauthorized scope/action,
            404 absent/inaccessible, 409 idempotency conflict, 422 unsupported profile/input, 503 dependency
            unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-required-permissions:
      - projections:rebuild
      parameters:
      - name: corpus_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
components:
  securitySchemes:
    ApiKey:
      type: http
      scheme: bearer
      description: API key, not necessarily a JWT. Server derives Organization, permitted actions and
        Corpus scope; every resource access is authorized.
  schemas:
    SourceIdentity:
      $ref: ../../shared/v0/manifest.schema.json#/$defs/SourceIdentity
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        retryable:
          type: boolean
        field:
          type: string
          minLength: 1
          description: JSON Pointer (RFC 6901) to the request member that caused a 422, when known (for
            example /config/url or /credential/secret/token on connector commands).
        resync_url:
          type: string
          format: uri-reference
      required:
      - code
      - message
      - retryable
    Diagnostic:
      type: object
      additionalProperties: false
      description: |-
        A structured processing diagnostic. plugin, contribution and invocation_id name the external
        invocation a normalization diagnostic concerns. Codes of external normalization:

        - normalizer_failed: the normalizer answered a terminal error. The Version is quarantined.
        - normalizer_invalid_output: the output broke the Plugin Protocol or the Manifest rules (schema,
          malformed or duplicate Part, a Blob Part that is not the input Blob or has another checksum,
          an undeclared extension namespace, too many Parts, a response over the size bound). Nothing
          from it is published; the Version is quarantined.
        - normalizer_timeout: the invocations kept exceeding the timeout until the retry budget (the
          manifest's retry.max_attempts, capped by the engine at 5) was spent. The Version is quarantined.
        - normalizer_retries_exhausted: the normalizer kept answering retryable errors until the retry
          budget was spent. The Version is quarantined.
        - input_unverified: the input Blob was no longer the verified accepted input. The Version is
          quarantined.
        - normalizer_unrouted: the media type's route was removed after acceptance and the built-in text
          path cannot read it (a text/* Blob takes the built-in text path instead). The Version is
          quarantined.
        - normalization_superseded: a newer revision of the Record was accepted before this Version was
          normalized, so the normalizer was not invoked. The Version is quarantined and never current.
        - normalizer_conflict: a later invocation with the same idempotency key returned a different
          output. The first recorded output is kept and published; nothing is overwritten.

        On an optional route every quarantining code above that comes from the normalizer is instead
        listed on a searchable Version published through the built-in text path. A plugin that is
        unavailable (connection failure, 5xx without an error envelope, discovery that does not match the
        pinned manifest) is retried with backoff and never produces a diagnostic here; the Receipt shows
        plugin_unavailable while it retries. Quarantined Versions keep their input reference and reason;
        reprocessing them is not available yet.
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        retryable:
          type: boolean
          description: Whether the same input may succeed if processed again.
        plugin:
          type: string
          minLength: 1
          description: Plugin id of the invocation.
        contribution:
          type: string
          minLength: 1
        invocation_id:
          type: string
          minLength: 1
      required:
      - code
      - message
      - retryable
    Extensions:
      $ref: ../../shared/v0/manifest.schema.json#/$defs/Extensions
    TextContent:
      $ref: ../../shared/v0/manifest.schema.json#/$defs/TextContent
    BlobContent:
      $ref: ../../shared/v0/manifest.schema.json#/$defs/BlobContent
    Part:
      $ref: ../../shared/v0/manifest.schema.json#/$defs/Part
    RelationInput:
      $ref: ../../shared/v0/manifest.schema.json#/$defs/RelationInput
    ManifestContent:
      $ref: ../../shared/v0/manifest.schema.json#/$defs/ManifestContent
    Provenance:
      $ref: ../../shared/v0/manifest.schema.json#/$defs/Provenance
    NormalizationProvenance:
      $ref: ../../shared/v0/manifest.schema.json#/$defs/NormalizationProvenance
    IngestCommand:
      type: object
      additionalProperties: false
      properties:
        idempotency_key:
          type: string
          minLength: 1
        source:
          $ref: '#/components/schemas/SourceIdentity'
        source_revision:
          type: string
          minLength: 1
        source_position:
          type: string
          pattern: ^[0-9]+$
          description: Optional monotonic source position, encoded as decimal text to avoid JSON numeric
            precision loss.
        content:
          oneOf:
          - $ref: '#/components/schemas/TextContent'
          - $ref: '#/components/schemas/BlobContent'
          - $ref: '#/components/schemas/ManifestContent'
          discriminator:
            propertyName: kind
            mapping:
              text: '#/components/schemas/TextContent'
              blob: '#/components/schemas/BlobContent'
              manifest: '#/components/schemas/ManifestContent'
        extensions:
          $ref: '#/components/schemas/Extensions'
        provenance:
          $ref: '#/components/schemas/Provenance'
      required:
      - idempotency_key
      - source
      - content
      description: Initial request shape. Same source identity creates or corrects a Record. Same external
        revision with different canonical content conflicts. No revision means canonical Manifest digest
        identity; no source position means durable acceptance order. Single and batch entry replay share
        route_family=ingestion. A blob content accepts a verified text/* Blob, read at acceptance, or a
        Blob whose media type the installation routes to an external normalizer; that normalizer runs after
        acceptance and its output is the published Manifest, while the Version identity still derives from
        the submitted Blob. When the normalizer fails, the Version is quarantined with a Diagnostic on the
        Version read (or, on an optional text/* route, published through the built-in text path with
        provenance.normalization.fallback). Other media types are rejected with unverified_blob.
        provenance.normalization is engine-owned and rejected on input. Extension namespaces owned by the
        pinned plugin are written only by its normalizer output, published on the Version; a submission
        writing one, top-level or on a Part, is rejected with 422 extension_namespace_owned.
    WithdrawalCommand:
      type: object
      additionalProperties: false
      properties:
        idempotency_key:
          type: string
          minLength: 1
        source:
          $ref: '#/components/schemas/SourceIdentity'
        reason:
          type: string
          minLength: 1
      required:
      - idempotency_key
      - source
    Availability:
      type: object
      additionalProperties: false
      properties:
        state:
          type: string
          enum:
          - materialized
          - building_baseline
          - retrieval_ready
          - quarantined
        is_current:
          type: boolean
        searchable:
          type: boolean
      required:
      - state
      - is_current
      - searchable
    Receipt:
      type: object
      additionalProperties: false
      properties:
        receipt_id:
          type: string
          minLength: 1
        state:
          type: string
          enum:
          - pending
          - resolved
        outcome:
          type: string
          enum:
          - created
          - duplicate
          - withdrawal_applied
          - conflict
        record_id:
          type: string
          minLength: 1
        version_id:
          type: string
          minLength: 1
        availability:
          $ref: '#/components/schemas/Availability'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/Error'
          maxItems: 20
        source:
          $ref: '#/components/schemas/SourceIdentity'
        processing:
          $ref: '#/components/schemas/ProcessingSummary'
      required:
      - receipt_id
      - state
      - diagnostics
      - source
      - processing
      description: Durable acceptance outcome, not workflow state. Availability is a separate authorized
        live read view; omitted before a linked version exists. Infrastructure retry never resolves a
        Receipt as failed.
      if:
        properties:
          state:
            const: pending
      then:
        not:
          required:
          - outcome
      else:
        required:
        - outcome
    BatchRequest:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items: {}
          minItems: 1
          maxItems: 100
      required:
      - items
      description: Envelope validation checks items array and batch/body limits only. Each raw entry is
        independently validated as IngestCommand; even a missing required field or wrong JSON type returns
        an entry error. SDK convenience builders may type valid entries as IngestCommand, but server envelope
        validation must not reject the entire batch for an invalid entry.
    BatchItem:
      type: object
      additionalProperties: false
      properties:
        index:
          type: integer
          minimum: 0
        receipt:
          $ref: '#/components/schemas/Receipt'
        error:
          $ref: '#/components/schemas/Error'
      required:
      - index
      if:
        required:
        - receipt
      then:
        not:
          required:
          - error
      else:
        required:
        - error
    BatchResult:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BatchItem'
          maxItems: 100
      required:
      - items
    Record:
      type: object
      additionalProperties: false
      properties:
        record_id:
          type: string
          minLength: 1
        source:
          $ref: '#/components/schemas/SourceIdentity'
        withdrawn:
          type: boolean
        current_version_id:
          type: string
          minLength: 1
      required:
      - record_id
      - source
      - withdrawn
    Version:
      type: object
      additionalProperties: false
      properties:
        record_id:
          type: string
          minLength: 1
        version_id:
          type: string
          minLength: 1
        accepted_at:
          type: string
          format: date-time
          description: When Quivr accepted the revision this Version publishes, before any processing.
        manifest:
          $ref: '#/components/schemas/ManifestContent'
        extensions:
          $ref: '#/components/schemas/Extensions'
        provenance:
          $ref: '#/components/schemas/Provenance'
        availability:
          $ref: '#/components/schemas/Availability'
        relations:
          type: array
          items:
            $ref: '#/components/schemas/ResolvedRelation'
        processing:
          $ref: '#/components/schemas/ProcessingSummary'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/Diagnostic'
          maxItems: 20
          description: Why the Version needs attention. A quarantined Version lists its reason first. A
            Version published through an optional route's fallback lists the normalizer failure it fell
            back from, and a recorded normalizer_conflict is listed on the Version whose output was kept.
            Omitted when there is nothing to report.
      required:
      - record_id
      - version_id
      - manifest
      - availability
      - relations
      - processing
    UploadRequest:
      type: object
      additionalProperties: false
      properties:
        size_bytes:
          type: integer
          minimum: 1
          maximum: 1073741824
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        media_type:
          type: string
          minLength: 1
      required:
      - size_bytes
      - sha256
      - media_type
    Upload:
      type: object
      additionalProperties: false
      properties:
        upload_id:
          type: string
          minLength: 1
        state:
          type: string
          enum:
          - awaiting_upload
          - verifying
          - verified
          - rejected
          - expired
        upload_url:
          type: string
          format: uri
        upload_headers:
          type: object
          additionalProperties:
            type: string
        expires_at:
          type: string
          format: date-time
        blob_id:
          type: string
          minLength: 1
        error:
          $ref: '#/components/schemas/Error'
        upload_method:
          type: string
          enum:
          - PUT
      required:
      - upload_id
      - state
      description: Upload URL and headers are transfer capabilities. Only verified uploads expose a usable
        Blob ID. Repeated confirmation of the same session observes the same verification, never a second
        upload.
      allOf:
      - if:
          properties:
            state:
              const: verified
        then:
          required:
          - blob_id
        else:
          not:
            required:
            - blob_id
    Blob:
      type: object
      additionalProperties: false
      properties:
        blob_id:
          type: string
          minLength: 1
        size_bytes:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        media_type:
          type: string
          minLength: 1
      required:
      - blob_id
      - size_bytes
      - sha256
      - media_type
    Operation:
      type: object
      additionalProperties: false
      properties:
        operation_id:
          type: string
          minLength: 1
        kind:
          type: string
          minLength: 1
        state:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - cancel_requested
          - canceled
        progress:
          type: number
          minimum: 0
          maximum: 1
          description: Approximate fraction, omitted when unknown.
        counters:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
          maxItems: 20
        previous_operation_id:
          type: string
          minLength: 1
        corpus_id:
          type: string
          minLength: 1
        result:
          $ref: '#/components/schemas/ProjectionRebuildResult'
      required:
      - operation_id
      - kind
      - state
      - counters
      - errors
      description: Administrative execution only. Retries keep identity. Intentional terminal rerun has
        a new ID and previous_operation_id. Cancellation does not promise universal rollback; already-terminal
        state and racing completion may win. projection_rebuild and retrieval_configuration Operations
        require corpus_id; when succeeded they require result naming the activated logical generation.
        This result shape covers those two command kinds only.
      if:
        properties:
          kind:
            enum:
            - projection_rebuild
            - retrieval_configuration
        required:
        - kind
      then:
        required:
        - corpus_id
        if:
          properties:
            state:
              const: succeeded
          required:
          - state
        then:
          required:
          - result
    FieldMapping:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        source_pointer:
          type: string
          minLength: 1
        type:
          type: string
          enum:
          - string
          - number
          - boolean
          - datetime
          - string_array
        roles:
          type: array
          items:
            type: string
            enum:
            - search
            - filter
          minItems: 1
      required:
      - name
      - source_pointer
      - type
      - roles
      description: v0 logical field mapping. name is a logical name matching ^[a-z][a-z0-9_]{0,63}$,
        never a search-engine field name. source_pointer is an RFC 6901 JSON Pointer into the canonical
        source view of a Version, rooted at /manifest, /provenance or /extensions/{namespace} with a
        declared namespace (built in, or owned by the startup-pinned plugin); other roots are rejected
        as invalid_mapping. Core validates
        role/type compatibility (search requires string or string_array). A search field named title
        replaces the projected title; other search fields add text once per Record Version. Filter roles
        are validated and preserved; no public filter API consumes them in v0.
    RetrievalConfig:
      type: object
      additionalProperties: false
      properties:
        plugin_profile:
          type: string
          minLength: 1
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldMapping'
      required: []
      description: Pin a plugin-provided profile when resolving config. Explicit fields override default
        fields by logical name; unmapped source data remains preserved. getCorpus returns the effective
        resolved fields. The only built-in profile, example.editorial, is illustrative (paired with the example
        extension namespace), not a product default; an uninstalled profile is 422 unsupported_profile.
    ConnectorKind:
      type: string
      pattern: ^[a-z][a-z0-9_]{0,31}$
      description: Connector kind, provided by the engine or by a pinned connector plugin; listConnectorKinds
        lists the kinds this deployment accepts. Built-in kinds are fixture (a deterministic test connector
        available only when the deployment enables it). First-party connector plugins provide rss (RSS 2.0,
        RSS 1.0, Atom and JSON Feed documents; config url, optional honor_ttl; optional credential
        username+password or token), x_list (an X list) and m365_mail (Microsoft 365 mailboxes). Another kind is
        refused with 422 unsupported_connector_kind.
    CredentialDeposit:
      type: object
      additionalProperties: false
      properties:
        secret:
          type: object
          writeOnly: true
          description: Kind-specific secret, validated by the kind's credential JSON Schema, encrypted at
            rest with the deployment credential key and never returned or logged. Without a configured
            credential key the request is refused with 503 credentials_unavailable.
        expires_at:
          type: string
          format: date-time
      required:
      - secret
    CredentialReplace:
      type: object
      additionalProperties: false
      properties:
        idempotency_key:
          type: string
          minLength: 1
        secret:
          type: object
          writeOnly: true
        expires_at:
          type: string
          format: date-time
      required:
      - idempotency_key
      - secret
    ConnectorSchedule:
      type: object
      additionalProperties: false
      properties:
        interval_seconds:
          type: integer
          minimum: 1
          maximum: 86400
          description: Polling interval. Defaults per kind (fixture/rss 300, m365_mail 60, x_list 120);
            values below the deployment floor (30 s by default) are 422 invalid_interval.
    ConnectorRunRequest:
      type: object
      additionalProperties: false
      properties:
        connector_id:
          type: string
        run_at:
          type: string
          format: date-time
          description: When the requested run is due; now unless the interval floor or the source's
            Retry-After defers it.
      required:
      - connector_id
      - run_at
    ScheduleChange:
      type: object
      additionalProperties: false
      properties:
        interval_seconds:
          type: integer
          description: Seconds between runs. Bounds are the deployment floor and 86400; values outside
            them are 422 invalid_interval with field /interval_seconds.
      required:
      - interval_seconds
    ConnectorKindDescription:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          minLength: 1
          description: Kind identifier accepted by createConnector for this deployment. A plain string so kinds
            added by future providers need no contract change here.
        title:
          type: string
          minLength: 1
          description: Display name, from the config schema's title annotation (the kind when absent).
        description:
          type: string
          description: Short explanation, from the config schema's description annotation.
        config_schema:
          type: object
          description: JSON Schema (2020-12) validating config. Annotations (title, description, examples)
            are informational.
        credential_schema:
          type: object
          description: JSON Schema validating credential.secret. Members annotated writeOnly are secrets.
            Absent when the kind takes no credential.
        credential:
          type: string
          enum:
          - none
          - optional
          - required
          description: Whether an instance of this kind takes, may take or needs a Deposited Credential.
        default_interval_seconds:
          type: integer
          minimum: 1
      required:
      - kind
      - title
      - config_schema
      - credential
      - default_interval_seconds
    PluginRegistration:
      type: object
      additionalProperties: false
      properties:
        registration_id:
          type: string
          minLength: 1
        plugin_id:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
        endpoint:
          type: string
          minLength: 1
          description: Base URL where the operator runs this plugin version.
        manifest_digest:
          type: string
          minLength: 1
        artifact_digest:
          type: string
          minLength: 1
          description: Artifact digest the plugin reports, recorded as information. Absent when it reports
            none.
        contributions:
          type: array
          items:
            type: string
        roles:
          type: array
          items:
            type: string
          description: Roles the manifest declares it can serve, such as normalizer:application/pdf,
            subscription:<plugin id> or connector:<kind>. The active plan says which it serves.
        state:
          type: string
          enum:
          - registered
          - validated
          - active
          - draining
          - inactive
          - rejected
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - registration_id
      - plugin_id
      - version
      - endpoint
      - manifest_digest
      - contributions
      - roles
      - state
      - created_at
      - updated_at
    PluginRegistrationList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PluginRegistration'
      required:
      - items
    PipelinePlanRole:
      type: object
      additionalProperties: false
      properties:
        role:
          type: string
          minLength: 1
        registration_id:
          type: string
          minLength: 1
        plugin_id:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
      required:
      - role
      - registration_id
      - plugin_id
      - version
    PipelinePlan:
      type: object
      additionalProperties: false
      properties:
        plan_id:
          type: string
          minLength: 1
        created_at:
          type: string
          format: date-time
        activated_at:
          type: string
          format: date-time
        roles:
          type: array
          description: One entry per role, sorted by role.
          items:
            $ref: '#/components/schemas/PipelinePlanRole'
      required:
      - plan_id
      - created_at
      - activated_at
      - roles
    ConnectorKindCatalog:
      type: object
      additionalProperties: false
      properties:
        credential_deposits:
          type: string
          enum:
          - available
          - unavailable
          description: unavailable on a deployment without a credential key, where credential deposits and
            rotations are refused with 503 credentials_unavailable.
        min_interval_seconds:
          type: integer
          minimum: 1
          description: Shortest polling interval this deployment accepts.
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorKindDescription'
      required:
      - credential_deposits
      - min_interval_seconds
      - items
    ConnectorHealthPolicy:
      type: object
      additionalProperties: false
      properties:
        silent_after_seconds:
          type: integer
          minimum: 1
          maximum: 2592000
          description: No new item for this long makes the source silent. Default 86400.
        credential_warning_seconds:
          type: integer
          minimum: 0
          maximum: 31536000
          description: A credential expiring within this window is credential_expiring. Default 1209600.
    ConnectorCreate:
      type: object
      additionalProperties: false
      properties:
        idempotency_key:
          type: string
          minLength: 1
        corpus_id:
          type: string
          minLength: 1
        source_namespace:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          $ref: '#/components/schemas/ConnectorKind'
        config:
          type: object
          description: Kind-specific configuration validated by the kind's JSON Schema. Holds no secret.
        schedule:
          $ref: '#/components/schemas/ConnectorSchedule'
        health_policy:
          $ref: '#/components/schemas/ConnectorHealthPolicy'
        credential:
          $ref: '#/components/schemas/CredentialDeposit'
      required:
      - idempotency_key
      - corpus_id
      - source_namespace
      - kind
      - config
    CredentialMetadata:
      type: object
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 1
        deposited_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
      required:
      - version
      - deposited_at
      description: Metadata of the current Deposited Credential; the secret itself is never returned.
    ConnectorError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
        at:
          type: string
          format: date-time
      required:
      - code
      - at
    ConnectorUsage:
      type: object
      additionalProperties: false
      properties:
        day:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          description: Current UTC calendar day (YYYY-MM-DD).
        items_read:
          type: integer
          minimum: 0
          description: Source resources read during the current UTC day, counted as the source bills them
            (for x_list, an estimate of billed post reads after X's per-UTC-day deduplication).
        previous_day_items_read:
          type: integer
          minimum: 0
      required:
      - day
      - items_read
      - previous_day_items_read
      description: Per-UTC-day source read counters, present only for kinds that report reads.
    ConnectorHealth:
      type: object
      additionalProperties: false
      properties:
        state:
          type: string
          enum:
          - active
          - silent
          - access_error
          - credential_expiring
          - disabled
        evaluated_at:
          type: string
          format: date-time
        last_success_at:
          type: string
          format: date-time
        last_item_at:
          type: string
          format: date-time
        last_error:
          $ref: '#/components/schemas/ConnectorError'
        usage:
          $ref: '#/components/schemas/ConnectorUsage'
        diagnostics:
          type: object
          description: Kind-defined diagnostics from the latest acquisition page, documented on the kind's
            operator guide page (for x_list, the deletion recheck coverage). Informational; never holds a
            secret or source content.
        push:
          $ref: '#/components/schemas/ConnectorPush'
      required:
      - state
      - evaluated_at
      description: Last committed Connector Health, evaluated at each acquisition run, credential replacement
        and disable; evaluated_at shows its age. Precedence disabled, access_error, credential_expiring,
        silent, active. access_error means the source refused access (distinct from silent, which means
        no new item within the threshold), including a push channel refused access while polling carries
        the collection. Other failures appear only as last_error.
    ConnectorPush:
      type: object
      additionalProperties: false
      properties:
        state:
          type: string
          enum:
          - active
          - pending
          - degraded
          description: active, deliveries are expected; pending, the kind has not set its push channel up
            yet; degraded, the setup failed or deliveries fail or miss items, and polling at the instance's
            interval carries the collection.
        error:
          $ref: '#/components/schemas/ConnectorPushError'
        last_delivery_at:
          type: string
          format: date-time
          description: Last delivery the connector plugin accepted.
        poll_interval_seconds:
          type: integer
          minimum: 1
          description: While push is active, polling runs at most this often, as a safety net.
      required:
      - state
      description: Push delivery health, present once a kind that declares the push mode reports its push
        channel.
    ConnectorPushError:
      type: object
      additionalProperties: false
      properties:
        class:
          type: string
          enum:
          - access
          - transient
          - source
        code:
          type: string
          minLength: 1
          description: For example webhook_invalid (the source invalidated the webhook), plugin_unavailable
            (a delivery found the plugin down) or missed_deliveries (polling found items no delivery brought).
        at:
          type: string
          format: date-time
      required:
      - class
      - code
      - at
    Connector:
      type: object
      additionalProperties: false
      properties:
        connector_id:
          type: string
          minLength: 1
        corpus_id:
          type: string
          minLength: 1
        source_namespace:
          type: string
          minLength: 1
        kind:
          $ref: '#/components/schemas/ConnectorKind'
        config:
          type: object
        schedule:
          type: object
          additionalProperties: false
          properties:
            interval_seconds:
              type: integer
              minimum: 1
          required:
          - interval_seconds
        health_policy:
          type: object
          additionalProperties: false
          properties:
            silent_after_seconds:
              type: integer
              minimum: 1
            credential_warning_seconds:
              type: integer
              minimum: 0
          required:
          - silent_after_seconds
          - credential_warning_seconds
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        disabled_at:
          type: string
          format: date-time
        credential:
          $ref: '#/components/schemas/CredentialMetadata'
        health:
          $ref: '#/components/schemas/ConnectorHealth'
        webhook_url:
          type: string
          format: uri
          description: Public address of the instance's webhook route, present when its kind declares the
            push mode and the deployment sets public_url. The kind's plugin registers it with the source.
      required:
      - connector_id
      - corpus_id
      - source_namespace
      - kind
      - config
      - schedule
      - health_policy
      - enabled
      - created_at
      - health
    ConnectorPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Connector'
        next_page_cursor:
          type: string
          minLength: 1
      required:
      - items
    CorpusRequest:
      type: object
      additionalProperties: false
      properties:
        idempotency_key:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        retrieval:
          $ref: '#/components/schemas/RetrievalConfig'
      required:
      - idempotency_key
      - name
    Corpus:
      type: object
      additionalProperties: false
      properties:
        corpus_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        effective_retrieval:
          $ref: '#/components/schemas/RetrievalConfig'
      required:
      - corpus_id
      - name
      - effective_retrieval
    CorpusPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Corpus'
        next_page_cursor:
          type: string
          minLength: 1
      required:
      - items
    RecordPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Record'
        next_page_cursor:
          type: string
          minLength: 1
      required:
      - items
    ConfigUpdate:
      type: object
      additionalProperties: false
      properties:
        idempotency_key:
          type: string
          minLength: 1
        retrieval:
          $ref: '#/components/schemas/RetrievalConfig'
      required:
      - idempotency_key
      - retrieval
    ActionRequest:
      type: object
      additionalProperties: false
      properties:
        idempotency_key:
          type: string
          minLength: 1
      required:
      - idempotency_key
    RenameRequest:
      type: object
      additionalProperties: false
      properties:
        idempotency_key:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
      required:
      - idempotency_key
      - name
      description: New display name of a Saved Query or Subscription.
    ResourceReference:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          minLength: 1
        id:
          type: string
          minLength: 1
        corpus_id:
          type: string
          minLength: 1
      required:
      - kind
      - id
    ChangeEvent:
      type: object
      additionalProperties: false
      properties:
        event_id:
          type: string
          minLength: 1
        type:
          type: string
          minLength: 1
        schema_version:
          type: string
          minLength: 1
        occurred_at:
          type: string
          format: date-time
        resource:
          $ref: '#/components/schemas/ResourceReference'
        cursor:
          type: string
          minLength: 1
        monitoring:
          $ref: '#/components/schemas/MonitoringReferences'
      required:
      - event_id
      - type
      - schema_version
      - occurred_at
      - resource
      - cursor
      description: Every change to a Record catalog entry emits an event with resource.kind=record and
        resource.id=the affected Record ID. Additional resource-specific events do not replace this invalidation.
        Consumers reread current state; payload detail belongs to THE-547. Monitoring notice types mirror
        WebhookEvent and include monitoring references; event_id identifies that same committed notice.
        Delivery status changes emit delivery.updated events only to the feed, never recursive webhooks.
    ChangePage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChangeEvent'
        next_cursor:
          type: string
          minLength: 1
        has_more:
          type: boolean
      required:
      - items
      - next_cursor
      - has_more
    ResolvedRelation:
      type: object
      additionalProperties: false
      required:
      - source_reference
      - status
      properties:
        source_reference:
          $ref: '#/components/schemas/RelationInput'
        status:
          type: string
          enum:
          - available
          - unavailable
        target_record_id:
          type: string
        target_version_id:
          type: string
      description: Separate live view, not a mutation of the source Manifest. Unavailable covers missing,
        unready, withdrawn and inaccessible without distinguishing existence or revealing resolved target
        IDs.
      if:
        properties:
          status:
            const: available
      then:
        required:
        - target_record_id
        - target_version_id
      else:
        not:
          anyOf:
          - required:
            - target_record_id
          - required:
            - target_version_id
    ProcessingSummary:
      type: object
      additionalProperties: false
      required:
      - state
      properties:
        state:
          type: string
          enum:
          - queued
          - running
          - retrying
          - blocked
          - idle
        phase:
          type: string
          enum:
          - materialization
          - baseline
          - enrichment
        message:
          type: string
      description: Live read view, not a Receipt lifecycle or public workflow identifier. blocked means
        an outstanding contribution needs intervention; diagnostics describe why. idle means no work currently
        pending, not a promise of final enrichment. Phase is omitted when idle; required and optional
        progress do not override Version Availability.
    SavedQueryDefinition:
      type: object
      additionalProperties: false
      properties:
        corpus_ids:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
          uniqueItems: true
        expression:
          type: object
          additionalProperties: true
        retrieval_profile:
          type: string
          minLength: 1
        temporal_policy:
          type: string
          enum:
          - from_activation
      required:
      - corpus_ids
      - expression
      - retrieval_profile
      - temporal_policy
      description: Immutable query definition. Expression semantics belong to the evaluator plugin; no
        core keyword or semantic threshold is implied. All Corpora belong to the authorized Organization.
    SavedQueryCreate:
      type: object
      additionalProperties: false
      properties:
        idempotency_key:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        definition:
          $ref: '#/components/schemas/SavedQueryDefinition'
      required:
      - idempotency_key
      - name
      - definition
    SavedQueryVersionCreate:
      type: object
      additionalProperties: false
      properties:
        idempotency_key:
          type: string
          minLength: 1
        definition:
          $ref: '#/components/schemas/SavedQueryDefinition'
      required:
      - idempotency_key
      - definition
      description: New immutable definition of an existing Saved Query. The name is unchanged (rename
        changes it).
    SavedQueryVersion:
      type: object
      additionalProperties: false
      properties:
        saved_query_id:
          type: string
          minLength: 1
        version_id:
          type: string
          minLength: 1
        definition:
          $ref: '#/components/schemas/SavedQueryDefinition'
      required:
      - saved_query_id
      - version_id
      - definition
    SavedQuery:
      type: object
      additionalProperties: false
      properties:
        saved_query_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        deleted:
          type: boolean
          description: Logically deleted; the Saved Query and its Versions stay readable.
        current_version:
          $ref: '#/components/schemas/SavedQueryVersion'
      required:
      - saved_query_id
      - name
      - deleted
      - current_version
    EvaluatorConfig:
      type: object
      additionalProperties: false
      properties:
        plugin_id:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
        configuration:
          type: object
          additionalProperties: true
      required:
      - plugin_id
      - version
      - configuration
      description: Pins an installed evaluator by plugin id and version, and its configuration. Evaluators
        are the subscription Contributions of the plugins pinned at startup (Plugin Protocol v0); test
        deployments may also install the deterministic fixture quivr.fixture@1. The configuration must
        satisfy the evaluator's declared configuration schema.
    SubscriptionCreate:
      type: object
      additionalProperties: false
      properties:
        idempotency_key:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        saved_query_id:
          type: string
          minLength: 1
        saved_query_version_id:
          type: string
          minLength: 1
        evaluator:
          $ref: '#/components/schemas/EvaluatorConfig'
        destination_id:
          type: string
          minLength: 1
        owner:
          $ref: '#/components/schemas/SubscriptionOwner'
      required:
      - idempotency_key
      - name
      - saved_query_id
      - saved_query_version_id
      - evaluator
      - destination_id
      description: Create enabled from-now Subscription. An optional owner makes it the Subscription of
        one end user of the client application; without one it is global to the Organization. The owner
        is fixed for the Subscription's life and part of the idempotent request. One deployment-configured destination per version;
        destination belongs to this Organization. URL and signing key are provisioned outside this API
        and not returned. No inline secret or dynamic destination registry in the tracer.
    SubscriptionVersionCreate:
      type: object
      additionalProperties: false
      properties:
        idempotency_key:
          type: string
          minLength: 1
        saved_query_version_id:
          type: string
          minLength: 1
        evaluator:
          $ref: '#/components/schemas/EvaluatorConfig'
        destination_id:
          type: string
          minLength: 1
      required:
      - idempotency_key
      - saved_query_version_id
      - evaluator
      - destination_id
      description: New immutable configuration of an existing Subscription. The Saved Query and name
        are unchanged (rename changes the name); saved_query_version_id is the current Version of that
        Saved Query.
    SubscriptionVersion:
      type: object
      additionalProperties: false
      properties:
        subscription_id:
          type: string
          minLength: 1
        version_id:
          type: string
          minLength: 1
        saved_query_id:
          type: string
          minLength: 1
        saved_query_version_id:
          type: string
          minLength: 1
        evaluator:
          $ref: '#/components/schemas/EvaluatorConfig'
        destination_id:
          type: string
          minLength: 1
        owner:
          $ref: '#/components/schemas/SubscriptionOwner'
      required:
      - subscription_id
      - version_id
      - saved_query_id
      - saved_query_version_id
      - evaluator
      - destination_id
      description: Immutable Subscription configuration. Every Version keeps the Subscription's owner,
        absent for a global Subscription.
    Subscription:
      type: object
      additionalProperties: false
      properties:
        subscription_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        enabled:
          type: boolean
        deleted:
          type: boolean
          description: Logically deleted for good; a deleted Subscription is also disabled and stays
            readable with its Versions, Matches and Deliveries.
        current_version:
          $ref: '#/components/schemas/SubscriptionVersion'
        owner:
          $ref: '#/components/schemas/SubscriptionOwner'
      required:
      - subscription_id
      - name
      - enabled
      - deleted
      - current_version
      description: Absent owner means a global, organization-wide Subscription.
    SubscriptionOwner:
      type: string
      minLength: 1
      maxLength: 128
      description: Subscription Owner, an opaque end-user reference defined by the client application
        (for example user-123). Quivr stores, filters and echoes it without interpreting it. At most 128
        characters without control characters; none is reserved for the listing filter (422 invalid_owner).
    SubscriptionPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Subscription'
        next_page_cursor:
          type: string
          minLength: 1
      required:
      - items
    SubscriptionPreviewRequest:
      type: object
      additionalProperties: false
      properties:
        definition:
          $ref: '#/components/schemas/SavedQueryDefinition'
        saved_query_id:
          type: string
          minLength: 1
        saved_query_version_id:
          type: string
          minLength: 1
        evaluator:
          $ref: '#/components/schemas/EvaluatorConfig'
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
          description: The most Record Versions to judge, newest first. Each one costs an evaluator call.
        accepted_after:
          type: string
          format: date-time
          description: Judge only revisions accepted after this instant.
      required:
      - evaluator
      description: A proposed Subscription to preview. Give either definition, an inline Saved Query
        definition, or saved_query_id with saved_query_version_id, an existing Saved Query Version; not
        both.
    SubscriptionPreviewMatch:
      type: object
      additionalProperties: false
      properties:
        corpus_id:
          type: string
          minLength: 1
        record_id:
          type: string
          minLength: 1
        record_version_id:
          type: string
          minLength: 1
        accepted_at:
          type: string
          format: date-time
        evidence:
          $ref: '#/components/schemas/MatchEvidence'
      required:
      - corpus_id
      - record_id
      - record_version_id
      - accepted_at
      - evidence
      description: A Record Version the proposed Subscription would have matched, with the evidence a
        Match would carry. It is not a Match and is not stored.
    SubscriptionPreview:
      type: object
      additionalProperties: false
      properties:
        evaluated:
          type: integer
          minimum: 0
          description: Record Versions the evaluator decided.
        matched:
          type: integer
          minimum: 0
        not_ready:
          type: integer
          minimum: 0
          description: Record Versions the evaluator could not decide yet (for example before enrichment).
        complete:
          type: boolean
          description: False when the time budget ran out before every listed Record Version was decided.
        oldest_accepted_at:
          type: string
          format: date-time
          description: When the oldest decided Record Version was accepted; absent when none was decided.
        matches:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/SubscriptionPreviewMatch'
          description: Most recently accepted first.
      required:
      - evaluated
      - matched
      - not_ready
      - complete
      - matches
      description: What a proposed Subscription would have matched among recent Record Versions.
    MatchEvidence:
      type: object
      additionalProperties: false
      properties:
        evaluator:
          $ref: '#/components/schemas/EvaluatorConfig'
        explanation:
          type: string
          maxLength: 4096
        part_keys:
          type: array
          items:
            type: string
            minLength: 1
          maxItems: 100
        details:
          type: object
          additionalProperties: true
      required:
      - evaluator
      - explanation
      description: Immutable evidence for a positive result, including evaluator version/configuration.
        Details are plugin-defined, bounded to 16 KiB and schema-validated by its adapter; core checks
        referenced Parts. Access is rechecked on reads.
    Match:
      type: object
      additionalProperties: false
      properties:
        match_id:
          type: string
          minLength: 1
        subscription_id:
          type: string
          minLength: 1
        subscription_version_id:
          type: string
          minLength: 1
        saved_query_id:
          type: string
          minLength: 1
        saved_query_version_id:
          type: string
          minLength: 1
        record_id:
          type: string
          minLength: 1
        record_version_id:
          type: string
          minLength: 1
        previous_match_id:
          type: string
          minLength: 1
        owner:
          $ref: '#/components/schemas/SubscriptionOwner'
        evidence:
          $ref: '#/components/schemas/MatchEvidence'
      required:
      - match_id
      - subscription_id
      - subscription_version_id
      - saved_query_id
      - saved_query_version_id
      - record_id
      - record_version_id
      - evidence
      description: Immutable positive historical determination, not a claim of current eligibility. Unique
        subscription-version/record-version. Correction/withdrawal notifications reference history; no
        Match is fabricated for negative decisions. owner is the Subscription's owner, absent when global.
    MatchPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Match'
        next_page_cursor:
          type: string
          minLength: 1
      required:
      - items
    MonitoringReferences:
      type: object
      additionalProperties: false
      properties:
        match_id:
          type: string
          minLength: 1
        record_id:
          type: string
          minLength: 1
        record_version_id:
          type: string
          minLength: 1
        subscription_id:
          type: string
          minLength: 1
        subscription_version_id:
          type: string
          minLength: 1
        delivery_id:
          type: string
          minLength: 1
        previous_match_id:
          type: string
          minLength: 1
        owner:
          $ref: '#/components/schemas/SubscriptionOwner'
      required:
      - match_id
      - record_id
      - record_version_id
      - subscription_id
      - subscription_version_id
      - delivery_id
      description: owner is the Subscription Owner, so a client routes the notice to its user; absent
        for a global Subscription and in notices committed before owners existed. match_id is the new Match for created/corrected, prior positive Match for no_longer_matches/withdrawn.
        record_version_id is the causal correction version for corrected/no_longer_matches, otherwise
        the matched version. References alone confer no access.
    WebhookEvent:
      type: object
      additionalProperties: false
      properties:
        event_id:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        type:
          type: string
          enum:
          - match.created
          - match.corrected
          - match.no_longer_matches
          - match.withdrawn
        schema_version:
          type: string
          enum:
          - '1'
        occurred_at:
          type: string
          format: date-time
        references:
          $ref: '#/components/schemas/MonitoringReferences'
      required:
      - event_id
      - type
      - schema_version
      - occurred_at
      - references
      description: Immutable reference-only notification. Retries preserve event_id and the exact stored
        body bytes; signing timestamp changes per attempt. No document content, excerpt, explanation,
        cursor or secret is embedded.
    DeliveryAdmission:
      type: object
      additionalProperties: false
      properties:
        allowed:
          type: boolean
        reason:
          type: string
          enum:
          - subscription_disabled
          - subscription_deleted
          - record_withdrawn
          - superseded
          - access_denied
          - destination_unavailable
          - terminal
      required:
      - allowed
      description: Current derived admission view, separate from durable Delivery state. A disallowed
        pending Delivery makes no new network attempt; it does not become a new lifecycle state.
        destination_unavailable means its destination is no longer configured for the Organization.
        subscription_disabled lasts until a re-enable; subscription_deleted is permanent. record_withdrawn refuses match.created, match.corrected and match.no_longer_matches; match.withdrawn
        is admitted for a withdrawn Record. superseded refuses an undelivered match.created or
        match.corrected once a later match.corrected or match.no_longer_matches exists for the same
        Subscription and Record, and an undelivered match.no_longer_matches once a later match.corrected
        exists; match.withdrawn is never superseded.
    Delivery:
      type: object
      additionalProperties: false
      properties:
        delivery_id:
          type: string
          minLength: 1
        match_id:
          type: string
          minLength: 1
        destination_id:
          type: string
          minLength: 1
        state:
          type: string
          enum:
          - pending
          - delivering
          - delivered
          - exhausted
        event:
          $ref: '#/components/schemas/WebhookEvent'
        attempt_count:
          type: integer
          minimum: 0
        admission:
          $ref: '#/components/schemas/DeliveryAdmission'
        last_error:
          $ref: '#/components/schemas/Error'
        next_attempt_at:
          type: string
          format: date-time
          description: When the next automatic attempt becomes eligible. Present only while the Delivery
            is pending and admission is allowed; a retry waits with jittered exponential backoff (or a
            valid Retry-After on 429/503), never beyond the delivery window.
      required:
      - delivery_id
      - match_id
      - destination_id
      - state
      - event
      - attempt_count
      - admission
    DeliveryAttempt:
      type: object
      additionalProperties: false
      properties:
        attempt_id:
          type: string
          minLength: 1
        delivery_id:
          type: string
          minLength: 1
        number:
          type: integer
          minimum: 1
        outcome:
          type: string
          enum:
          - in_flight
          - acknowledged
          - retryable_error
          - permanent_error
          - unknown
        http_status:
          type: integer
          minimum: 100
          maximum: 599
        error:
          $ref: '#/components/schemas/Error'
      required:
      - attempt_id
      - delivery_id
      - number
      - outcome
      description: Read view of append-only admission/outcome facts. Unknown network result can be retried
        with the same event ID; no response body, signature or signing key is exposed.
    DeliveryAttemptPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryAttempt'
        next_page_cursor:
          type: string
          minLength: 1
      required:
      - items
    SearchRequest:
      type: object
      additionalProperties: false
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 8192
        corpus_ids:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
          maxItems: 16
          uniqueItems: true
        mode:
          type: string
          enum:
          - lexical
          - semantic
          - hybrid
          default: hybrid
        profile:
          type: string
          enum:
          - fast
          - balanced
          - deep
          default: balanced
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
        filter:
          $ref: '#/components/schemas/SearchFilter'
      required:
      - query
      - corpus_ids
      description: Text-only top-k query. Resolve all Corpora in the authenticated Organization and require
        read/search permission for every requested Corpus before querying. Never silently drop an unauthorized
        Corpus. Unknown/unsupported profile or mode returns 422; a dependency outage is an error, not
        an empty successful result. Query token limits are checked against the resolved profile; no silent
        truncation. An optional filter narrows candidates inside the engine query, before ranking and
        the limit, in every mode. Other metadata filters and pagination are outside this surface.
    SearchFilter:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        source_namespaces:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          minItems: 1
          maxItems: 50
          uniqueItems: true
          description: Keep only Records whose Source Namespace is one of these values. Ranking
            and the limit apply within the filtered set, so a source's best matches are returned
            even when other sources outrank them.
      description: Candidate filter applied before ranking. Every present condition must hold.
        A requested Corpus served by a Projection Generation built before source filtering existed
        returns 422 source_filter_unavailable; rebuild that Corpus once (rebuildCorpusProjection)
        to enable it. Unfiltered search is unaffected.
    SearchProfile:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
      required:
      - name
      - version
      description: Resolved immutable retrieval profile identity. Version describes query normalization,
        ranking seed and model/segmentation configuration; no user-facing engine parameters.
    SearchExcerpt:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
          maxLength: 4096
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 0
        coordinate_system:
          type: string
          enum:
          - unicode_codepoint
      required:
      - text
      - start
      - end
      - coordinate_system
      description: Exact canonical normalized Part text slice [start,end), using Unicode code points,
        not UTF-8 bytes or UTF-16 units. End must be >= start and end-start must equal the excerpt code-point
        length. Bounds are checked against the referenced immutable Part. No synthetic highlights or rewritten
        snippets.
    SearchHit:
      type: object
      additionalProperties: false
      properties:
        record_id:
          type: string
          minLength: 1
        version_id:
          type: string
          minLength: 1
        part_key:
          type: string
          minLength: 1
        segment_id:
          type: string
          minLength: 1
        segmentation_id:
          type: string
          minLength: 1
        projection_generation_id:
          type: string
          minLength: 1
        embedding_artifact_id:
          type: string
          minLength: 1
        vector_space_id:
          type: string
          minLength: 1
        rank:
          type: integer
          minimum: 1
        excerpt:
          $ref: '#/components/schemas/SearchExcerpt'
        availability:
          $ref: '#/components/schemas/Availability'
      required:
      - record_id
      - version_id
      - part_key
      - segment_id
      - segmentation_id
      - projection_generation_id
      - rank
      - excerpt
      - availability
      description: One authorized segment hit. Rehydrate from canonical storage and recheck Organization/Corpus
        access, currentness, quarantine and Tombstone before returning. Rank is contiguous and one-based
        after hydration/filtering. Projection Generation, segmentation, segment and optional Embedding
        Artifact/Vector Space are logical durable IDs, not physical collection names or workflow IDs.
        Embedding references are omitted when that segment has lexical coverage only. They do not assert
        that the dense branch contributed to its rank. All hits inherit the response retrieval profile.
        Raw scores/explainScore stay internal.
      if:
        required:
        - embedding_artifact_id
      then:
        required:
        - vector_space_id
      else:
        not:
          required:
          - vector_space_id
    SearchResponse:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchHit'
          maxItems: 50
        retrieval_profile:
          $ref: '#/components/schemas/SearchProfile'
      required:
      - items
      - retrieval_profile
      description: Bounded top-k results after canonical rechecks. May contain fewer hits than requested;
        no total count, completeness promise or stable pagination snapshot. Empty results still name the
        resolved profile.
    ProjectionRebuildResult:
      type: object
      additionalProperties: false
      properties:
        projection_generation_id:
          type: string
          minLength: 1
      required:
      - projection_generation_id
      description: Logical generation activated for the requested Corpus. Opaque ID, never a physical
        search collection name.
webhooks:
  monitoringNotification:
    post:
      operationId: receiveMonitoringNotification
      description: Receiver endpoint, not a Quivr API route. Verify Standard Webhooks v1 HMAC-SHA256 over
        webhook-id + dot + webhook-timestamp + dot + raw body before parsing. Timestamp refreshed per
        attempt; body event_id equals webhook-id. See monitoring contract for retry defaults.
      security: []
      parameters:
      - name: webhook-id
        in: header
        required: true
        schema:
          type: string
          minLength: 1
      - name: webhook-timestamp
        in: header
        required: true
        schema:
          type: string
          minLength: 1
      - name: webhook-signature
        in: header
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
      responses:
        2XX:
          description: Receiver durably accepted/deduplicated this event.
        default:
          description: Transport retry policy applies; do not create another Match.
