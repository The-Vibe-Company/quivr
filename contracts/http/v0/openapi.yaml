openapi: 3.1.0
info:
  title: Quivr V2 public text foundation contract
  version: 0.0.0-draft
  description: THE-543 and THE-547 evaluation contracts; endpoint implementations are separate work. Matching
    criterion is plugin-owned and deferred. One configured webhook destination, immutable Matches, independent
    at-least-once Delivery and reference-only notifications. OpenAPI is authoritative for transport shapes.
    THE-640 adds text search and asynchronous Corpus projection rebuild initiation.
security:
- ApiKey: []
paths:
  /v0/records:
    post:
      operationId: ingestRecord
      description: Commit durable input, Receipt and dispatch intent before responding. Same key and canonical
        request returns same Receipt; changed request conflicts. A new source revision corrects the Record.
        All accepted/replayed submissions use 202, even when a replayed Receipt has resolved.
      responses:
        '202':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        default:
          description: Structured error. 400 malformed; 401 unauthenticated; 403 forbidden action; 404
            absent or inaccessible; 409 conflict; 413 oversized; 422 invalid input; 429 throttled; 503
            temporary failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestCommand'
      x-required-permissions:
      - content:write
    get:
      operationId: listRecords
      description: Stable keyset traversal of one Corpus's authorized canonical Records in Record ID
        order, including withdrawn Records. Each page is an independent read, not an atomic historical
        snapshot. Capture a start-now Change Cursor before scanning, then consume changes after it as
        invalidations by rereading current resources; see resynchronization procedure. The opaque page
        cursor is not a Change Cursor and binds the Corpus filter and authorization scope; a page cursor
        for another filter or scope is 409 cursor_scope_changed with resync_url. This route, relative to
        the API base, is the resync_url of change-feed and catalog cursor errors.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordPage'
        default:
          description: Structured error; see contract HTTP mapping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: corpus_id
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      - name: page_cursor
        in: query
        required: false
        schema:
          type: string
          minLength: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      x-required-permissions:
      - content:read
  /v0/records/batch:
    post:
      operationId: ingestBatch
      description: 'Initial bound: 100 entries (413 batch_too_large), envelope 10 MiB (413 request_too_large).
        Validate envelope structure/size first, then each entry independently against IngestCommand,
        including wrong types or missing fields. Each raw entry is also held to the 1 MiB single-request
        bound (entry error entry_too_large), so the same entry bytes are never refused for size alone. HTTP
        200 carries Receipt or Error per entry, with the same error codes as single submission. Same ingestion
        family/key as single submission. Reuse entry keys after unknown transport outcomes.'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResult'
        default:
          description: Structured error. 400 malformed; 401 unauthenticated; 403 forbidden action; 404
            absent or inaccessible; 409 conflict; 413 oversized; 422 invalid input; 429 throttled; 503
            temporary failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequest'
      x-required-permissions:
      - content:write
  /v0/records/withdrawals:
    post:
      operationId: withdrawRecord
      description: Durably commit withdrawal and Receipt before responding. Terminal identity fence, including
        before first materialization; no physical purge and no cascade. Uses a distinct withdrawal route
        family.
      responses:
        '202':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        default:
          description: Structured error. 400 malformed; 401 unauthenticated; 403 forbidden action; 404
            absent or inaccessible; 409 conflict; 413 oversized; 422 invalid input; 429 throttled; 503
            temporary failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawalCommand'
      x-required-permissions:
      - content:write
  /v0/records/{record_id}:
    get:
      operationId: getRecord
      description: Authorized canonical currentness and withdrawal view.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Record'
        default:
          description: Structured error. 400 malformed; 401 unauthenticated; 403 forbidden action; 404
            absent or inaccessible; 409 conflict; 413 oversized; 422 invalid input; 429 throttled; 503
            temporary failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: record_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      x-required-permissions:
      - content:read
  /v0/records/{record_id}/versions/{version_id}:
    get:
      operationId: getVersion
      description: Authorized immutable source Manifest plus separate live availability and relation expansion.
        Available links supply current eligible target Record and Version IDs; unavailable links reveal
        no resolved target IDs or absence/access reason. Historical lookup grants no new rights.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
        default:
          description: Structured error. 400 malformed; 401 unauthenticated; 403 forbidden action; 404
            absent or inaccessible; 409 conflict; 413 oversized; 422 invalid input; 429 throttled; 503
            temporary failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: record_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: version_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      x-required-permissions:
      - content:read
  /v0/ingestion-receipts/{receipt_id}:
    get:
      operationId: getReceipt
      description: Return outcome and separately authorized linked availability/diagnostics. Omit unavailable
        linked content rather than bypassing rights through the Receipt. Linked Version/Record details
        require current content:read permission and target Corpus authorization.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        default:
          description: Structured error. 400 malformed; 401 unauthenticated; 403 forbidden action; 404
            absent or inaccessible; 409 conflict; 413 oversized; 422 invalid input; 429 throttled; 503
            temporary failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: receipt_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      x-required-permissions:
      - content:read
  /v0/uploads:
    post:
      operationId: createUpload
      description: 'Create a transfer session with a single presigned PUT URL, required headers and expiry.
        Initial limits: 1 GiB Blob, configurable; oversized uploads are rejected before a session is issued.'
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        default:
          description: Structured error. 400 malformed; 401 unauthenticated; 403 forbidden action; 404
            absent or inaccessible; 409 conflict; 413 oversized; 422 invalid input; 429 throttled; 503
            temporary failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRequest'
      x-required-permissions:
      - blobs:write
  /v0/uploads/{upload_id}/confirm:
    post:
      operationId: confirmUpload
      description: Start or observe checksum/size verification; SDK polls until verified before referencing
        the Blob in ingestion. Confirmation is repeatable for this session.
      responses:
        '202':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        default:
          description: Structured error. 400 malformed; 401 unauthenticated; 403 forbidden action; 404
            absent or inaccessible; 409 conflict; 413 oversized; 422 invalid input; 429 throttled; 503
            temporary failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: upload_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      x-required-permissions:
      - blobs:write
  /v0/uploads/{upload_id}:
    get:
      operationId: getUpload
      description: Observe upload verification independently of Ingestion Receipt.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        default:
          description: Structured error. 400 malformed; 401 unauthenticated; 403 forbidden action; 404
            absent or inaccessible; 409 conflict; 413 oversized; 422 invalid input; 429 throttled; 503
            temporary failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: upload_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      x-required-permissions:
      - blobs:read
  /v0/blobs/{blob_id}:
    get:
      operationId: getBlob
      description: Inspect verified Blob metadata within authorized Organization scope; ID possession
        does not grant access.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blob'
        default:
          description: Structured error. 400 malformed; 401 unauthenticated; 403 forbidden action; 404
            absent or inaccessible; 409 conflict; 413 oversized; 422 invalid input; 429 throttled; 503
            temporary failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: blob_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      x-required-permissions:
      - blobs:read
  /v0/operations/{operation_id}:
    get:
      operationId: getOperation
      description: Administrative progress only. This read schema does not specify every administrative
        command.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        default:
          description: Structured error. 400 malformed; 401 unauthenticated; 403 forbidden action; 404
            absent or inaccessible; 409 conflict; 413 oversized; 422 invalid input; 429 throttled; 503
            temporary failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: operation_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      x-required-permissions:
      - operations:read
  /v0/corpora:
    post:
      operationId: createCorpus
      description: Explicit Corpus creation. Same creation route-family key and canonical request replays
        the same Corpus. Requires corpora:write.
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Corpus'
        default:
          description: Structured error; see contract HTTP mapping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorpusRequest'
      x-required-permissions:
      - corpora:write
    get:
      operationId: listCorpora
      description: Authorized Corpora only. Opaque page cursor bound to action/filter/scope; not a Change
        Cursor or a Record page cursor (either is 422 invalid_cursor).
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorpusPage'
        default:
          description: Structured error; see contract HTTP mapping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: page_cursor
        in: query
        required: false
        schema:
          type: string
          minLength: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      x-required-permissions:
      - corpora:read
  /v0/corpora/{corpus_id}:
    get:
      operationId: getCorpus
      description: Read effective resolved configuration.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Corpus'
        default:
          description: Structured error; see contract HTTP mapping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: corpus_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      x-required-permissions:
      - corpora:read
  /v0/corpora/{corpus_id}/retrieval:
    put:
      operationId: configureRetrieval
      description: Resolve mapping and schedule a new immutable Projection Generation through a
        retrieval_configuration Operation (202 with Location). Existing active config remains in effect,
        and is what getCorpus returns, until validated cutover; the Operation reports the pending
        config's progress and outcome but not its content. A newer accepted config supersedes older pending ones, and a generation
        pinned to an older config than the effective one fails with retrieval_configuration_superseded
        instead of reverting it. Same key and canonical request replay the Operation; a changed request
        is 409 idempotency_conflict. Does not require a separate per-Corpus physical collection.
      responses:
        '202':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        default:
          description: Structured error; see contract HTTP mapping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: corpus_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigUpdate'
      x-required-permissions:
      - corpora:write
      - operations:write
  /v0/changes:
    get:
      operationId: pollChanges
      description: Same durable journal as SSE. Without cursor, return empty items and current committed
        position as next_cursor (start now). With cursor, return authorized events after it, in commit
        order; duplicates possible. Cursor binds Organization, Corpus filter and authorization scope.
        Expiry is 410 cursor_expired with resync_url, never silent reset; changed scope/filter is 409
        cursor_scope_changed with resync_url. resync_url is the API-relative Record catalog route for
        the Corpus (/v0/records?corpus_id=...). next_cursor advances over scanned events even when none are visible. Public
        events are invalidations; reread current state, do not replay historical content into a current
        mirror.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePage'
        default:
          description: Structured error; see contract HTTP mapping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          minLength: 1
      - name: corpus_id
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      x-required-permissions:
      - changes:read
  /v0/changes/stream:
    get:
      operationId: streamChanges
      description: 'SSE over the same journal. Last-Event-ID takes precedence over query cursor on reconnect.
        id is an opaque Change Cursor; data.event_id is deduplication identity. Named change events carry
        ChangeEvent JSON. checkpoint events carry a cursor when no visible event is emitted, including
        initial start-now checkpoint. Resume cursor expires or scope changes: before headers use HTTP
        410/409; after headers send stream_error with Error JSON then close, without advancing id. Use
        authenticated streaming fetch/http client. See contract for checkpoint framing and resync.'
      responses:
        '200':
          description: Successful response
          content:
            text/event-stream:
              schema:
                type: string
              example: 'id: opaque-cursor

                event: change

                data: {"event_id":"event_1","type":"record.searchable","schema_version":"1","occurred_at":"2026-09-14T12:00:00Z","resource":{"kind":"record","id":"record_1","corpus_id":"corpus_1"},"cursor":"opaque-cursor"}


                '
        default:
          description: Structured error; see contract HTTP mapping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          minLength: 1
      - name: corpus_id
        in: query
        required: true
        schema:
          type: string
          minLength: 1
      - name: Last-Event-ID
        in: header
        required: false
        schema:
          type: string
          minLength: 1
      x-required-permissions:
      - changes:read
  /v0/operations/{operation_id}/cancel:
    post:
      operationId: cancelOperation
      description: Idempotent cancellation request; does not undo committed effects. Terminal operation
        returns its existing state. A racing completion may win. Cancellation becomes terminal only after
        work stops safely; no partial active projection cutover.
      responses:
        '202':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        default:
          description: Structured error; see contract HTTP mapping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: operation_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      x-required-permissions:
      - operations:write
  /v0/operations/{operation_id}/rerun:
    post:
      operationId: rerunOperation
      description: Only terminal Operations can be intentionally rerun; otherwise 409 operation_not_terminal.
        A request key replays the same new linked Operation. Revalidate current scope and command eligibility;
        completed effects remain subject to domain idempotency.
      responses:
        '202':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        default:
          description: Structured error; see contract HTTP mapping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: operation_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      x-required-permissions:
      - operations:write
  /v0/saved-queries:
    post:
      operationId: createSavedQuery
      description: Persist definition and first immutable version. Replay same key/request returns same
        IDs; conflict on changed request. Query creation alone evaluates nothing.
      x-required-permissions:
      - monitoring:write
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedQuery'
        default:
          description: Structured error. Existing /v0 authentication, scope, pagination and idempotency
            semantics apply.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedQueryCreate'
  /v0/saved-queries/{saved_query_id}:
    get:
      operationId: getSavedQuery
      description: Authorized current query view.
      x-required-permissions:
      - monitoring:read
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedQuery'
        default:
          description: Structured error. Existing /v0 authentication, scope, pagination and idempotency
            semantics apply.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: saved_query_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
  /v0/saved-queries/{saved_query_id}/versions/{version_id}:
    get:
      operationId: getSavedQueryVersion
      description: Read any immutable Version of the Saved Query, current or earlier, such as the one
        a Subscription Version or Match pins. The key must grant the Corpora of the Saved Query's current
        Version and of this Version. A deleted Saved Query's Versions stay readable.
      x-required-permissions:
      - monitoring:read
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedQueryVersion'
        default:
          description: Structured error. Existing /v0 authentication, scope, pagination and idempotency
            semantics apply.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: saved_query_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: version_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
  /v0/saved-queries/{saved_query_id}/versions:
    post:
      operationId: createSavedQueryVersion
      description: Edit a Saved Query by committing a new immutable Version that becomes its current
        Version, with saved_query.updated in every Corpus of the previous and new scope. Subscriptions
        keep the Version they pin; a new Subscription Version moves one. The key must grant every Corpus
        of the current and new definitions. Replay of the same key and request returns the same Version;
        a changed request is 409 idempotency_conflict. A deleted Saved Query is 409 saved_query_deleted.
      x-required-permissions:
      - monitoring:write
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedQueryVersion'
        default:
          description: Structured error. Existing /v0 authentication, scope, pagination and idempotency
            semantics apply.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: saved_query_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedQueryVersionCreate'
  /v0/saved-queries/{saved_query_id}/delete:
    post:
      operationId: deleteSavedQuery
      description: Logically delete a Saved Query that no Subscription which is not deleted belongs
        to (409 saved_query_in_use otherwise), with saved_query.deleted per Corpus. It and its Versions
        stay readable with deleted true; it gets no new Version or Subscription. Repeat is idempotent
        and commits no event.
      x-required-permissions:
      - monitoring:write
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedQuery'
        default:
          description: Structured error. Existing /v0 authentication, scope, pagination and idempotency
            semantics apply.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: saved_query_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
  /v0/saved-queries/{saved_query_id}/rename:
    post:
      operationId: renameSavedQuery
      description: Change the display name of a Saved Query. The name belongs to the Saved Query, not
        to its immutable Versions, so no Version is created and no Subscription moves. A new name commits
        saved_query.renamed in every Corpus of the current Version; the same name commits nothing.
        Replay of the same key and request returns the Saved Query; a changed request is 409
        idempotency_conflict. A deleted Saved Query is 409 saved_query_deleted.
      x-required-permissions:
      - monitoring:write
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedQuery'
        default:
          description: Structured error. Existing /v0 authentication, scope, pagination and idempotency
            semantics apply.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: saved_query_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameRequest'
  /v0/subscriptions:
    get:
      operationId: listSubscriptions
      description: Active (enabled, not deleted) Subscriptions of one Subscription Owner, or the global
        ones with owner=none, in stable Subscription ID order. Lists only Subscriptions the key sees,
        like every Subscription read. Stable keyset page cursor bound to the owner filter and key scope,
        not a Change Cursor. Quivr applies no per-owner rule; a layer above can use this listing to enforce
        its own.
      x-required-permissions:
      - monitoring:read
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPage'
        default:
          description: Structured error. Existing /v0 authentication, scope, pagination and idempotency
            semantics apply.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: owner
        in: query
        required: true
        description: A Subscription Owner, or none for global Subscriptions.
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: page_cursor
        in: query
        schema:
          type: string
          minLength: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
    post:
      operationId: createSubscription
      description: Atomically create enabled Subscription/Version and activation boundary in commit-ordered
        journal. Evaluate future eligible transitions, not existing history. Replay same key/request returns
        same identity and does not reactivate a disabled Subscription. The evaluator must be installed (422
        unsupported_evaluator); the pinned Saved Query Version expression and the evaluator configuration
        must satisfy the evaluator's declared schemas (422 invalid_expression with field /saved_query_version_id,
        or invalid_subscription_configuration with field /evaluator/configuration/...; message names the
        first schema issue).
      x-required-permissions:
      - monitoring:write
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        default:
          description: Structured error. Existing /v0 authentication, scope, pagination and idempotency
            semantics apply.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionCreate'
  /v0/subscriptions/{subscription_id}:
    get:
      operationId: getSubscription
      description: Read enabled state and pinned current configuration.
      x-required-permissions:
      - monitoring:read
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        default:
          description: Structured error. Existing /v0 authentication, scope, pagination and idempotency
            semantics apply.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: subscription_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
  /v0/subscriptions/{subscription_id}/versions/{version_id}:
    get:
      operationId: getSubscriptionVersion
      description: Read any immutable Version of the Subscription, current or earlier, such as the one
        a historical Match names. As for every read of a Subscription, its Matches and Deliveries, the
        key must grant every Corpus any of its Versions pinned. A deleted Subscription's Versions stay
        readable.
      x-required-permissions:
      - monitoring:read
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionVersion'
        default:
          description: Structured error. Existing /v0 authentication, scope, pagination and idempotency
            semantics apply.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: subscription_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      - name: version_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
  /v0/subscriptions/{subscription_id}/versions:
    post:
      operationId: createSubscriptionVersion
      description: Edit a Subscription by committing a new immutable Version that becomes current. It
        pins the current Version of the Subscription's own Saved Query (422 unknown_saved_query
        otherwise), an evaluator and a destination. It takes effect from its commit, recorded as its
        activation position with subscription.updated in every Corpus of the previous and new scope.
        Each later change is judged by the new Version, each earlier one by the Version effective
        before it. Nothing is backfilled and Matches keep the Version that produced them. Enabled
        state is unchanged. The evaluator, expression and configuration are checked as on creation
        (422 unsupported_evaluator, invalid_expression or invalid_subscription_configuration). Replay of the same key and request returns the same Version; a changed
        request is 409 idempotency_conflict. A deleted Subscription is 409 subscription_deleted.
      x-required-permissions:
      - monitoring:write
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionVersion'
        default:
          description: Structured error. Existing /v0 authentication, scope, pagination and idempotency
            semantics apply.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: subscription_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionVersionCreate'
  /v0/subscriptions/{subscription_id}/delete:
    post:
      operationId: deleteSubscription
      description: Logically delete a Subscription for good, with subscription.deleted per Corpus.
        It is also disabled, with every disable guarantee - no new evaluation commit and no new
        Delivery Attempt admission (reason subscription_deleted); an in-flight attempt may complete.
        As for a disabled Subscription, a match.withdrawn notice for one of its Matches is still
        committed with its pending Delivery, which is never attempted. The Subscription, its Versions,
        Matches and Deliveries stay readable with deleted true. Enable or edit is then 409
        subscription_deleted. Repeat is idempotent and commits no event.
      x-required-permissions:
      - monitoring:write
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        default:
          description: Structured error. Existing /v0 authentication, scope, pagination and idempotency
            semantics apply.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: subscription_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
  /v0/subscriptions/{subscription_id}/disable:
    post:
      operationId: disableSubscription
      description: Commit disable. Block new evaluation commits and new Delivery Attempt admissions, including
        queued retries and update notices. In-flight attempts may complete. A match.withdrawn notice for
        a Match of this Subscription is still committed with its pending Delivery, which makes no attempt
        until re-enable. Repeat is idempotent; history remains.
      x-required-permissions:
      - monitoring:write
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        default:
          description: Structured error. Existing /v0 authentication, scope, pagination and idempotency
            semantics apply.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: subscription_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
  /v0/subscriptions/{subscription_id}/enable:
    post:
      operationId: enableSubscription
      description: Commit re-enable of a disabled Subscription on the same Subscription Version. Evaluation
        resumes from this commit; changes made while disabled are never evaluated. Pending Deliveries
        parked by the disable become eligible again under the usual admission checks and keep their
        delivery window, except a match.withdrawn notice committed while disabled, whose window starts
        at this re-enable. Enabling an enabled Subscription, or repeating the request, is idempotent and
        commits no event. A deleted Subscription is 409 subscription_deleted.
      x-required-permissions:
      - monitoring:write
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        default:
          description: Structured error. Existing /v0 authentication, scope, pagination and idempotency
            semantics apply.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: subscription_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
  /v0/subscription-previews:
    post:
      operationId: previewSubscription
      description: Dry run of a proposed Subscription. Runs the evaluator on the most recently accepted
        current eligible Record Versions of the Saved Query's Corpora, newest first, and returns what it
        would have matched. Nothing is written - no Saved Query, Subscription, Match, Delivery or event -
        and it is not idempotent. The Saved Query is an inline definition or an existing Saved Query
        Version; the pair is validated as at Subscription creation (422 unsupported_evaluator,
        invalid_expression, invalid_subscription_configuration). Each Record Version costs one evaluator
        call, sent with the synthetic Subscription reference preview. At most limit Record Versions
        (1 to 50, default 20) are judged, within a time budget of a few seconds; those still undecided
        when it runs out are left out and complete is false. An evaluator that cannot be reached or
        reports a transient failure fails the preview with 503 evaluator_unavailable, and one that
        refuses or breaks an evaluation with 502 evaluator_error. Quivr applies no rate or cost rule; a
        layer above can limit who previews and how often.
      x-required-permissions:
      - monitoring:write
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPreview'
        default:
          description: Structured error. Existing /v0 authentication and scope semantics apply.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionPreviewRequest'
  /v0/subscriptions/{subscription_id}/rename:
    post:
      operationId: renameSubscription
      description: Change the display name of a Subscription. The name belongs to the Subscription, not
        to its immutable Versions, so no Version is created, evaluation and enabled state are unchanged,
        and its Matches and Deliveries stay attached. A new name commits subscription.renamed in every
        Corpus of the current Version; the same name commits nothing. Replay of the same key and
        request returns the Subscription; a changed request is 409 idempotency_conflict. A deleted
        Subscription is 409 subscription_deleted.
      x-required-permissions:
      - monitoring:write
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        default:
          description: Structured error. Existing /v0 authentication, scope, pagination and idempotency
            semantics apply.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: subscription_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameRequest'
  /v0/matches:
