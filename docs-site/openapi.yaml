              $ref: '#/components/schemas/ActionRequest'
      tags:
      - Subscriptions
      summary: Disable subscription
  /v0/subscriptions/{subscription_id}/enable:
    post:
      operationId: enableSubscription
      description: Commit re-enable of a disabled Subscription on the same Subscription Version. Evaluation resumes from this
        commit; changes made while disabled are never evaluated. Pending Deliveries parked by the disable become eligible
        again under the usual admission checks and keep their delivery window, except a match.withdrawn notice committed while
        disabled, whose window starts at this re-enable. Enabling an enabled Subscription, or repeating the request, is idempotent
        and commits no event. A deleted Subscription is 409 subscription_deleted.
      x-required-permissions:
      - monitoring:write
      responses:
