          minLength: 1
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDocumentPage'
        default:
          description: Structured error; 401 unauthenticated, 403 without observability:read or all Corpora, 409 cursor_scope_changed,
            422 invalid query, limit or cursor, 503 storage unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Admin
      summary: List admin documents
  /v0/admin/documents/{version_id}/timeline:
    get:
      operationId: getDocumentTimeline
      description: One Record Version's finished steps in time order, each with how long it took since the step that caused
        it and, when known, the plugin that ran it. 404 for an unknown Version or one outside the key's Corpora. Requires
        observability:read.
      x-required-permissions:
      - observability:read
      parameters:
      - name: version_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentTimeline'
        default:
          description: Structured error; 401 unauthenticated, 403 without observability:read, 404 not found, 503 storage unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Admin
      summary: Get document timeline
  /v0/admin/stats/plugins:
    get:
      operationId: getPluginCallStats
      description: Calls, errors and latency of every plugin Contribution invoked for the key's Organization over the window,
        per plugin version and operation, with the last error code the plugin declared (or plugin_unavailable, invalid_output).
        Counts are written by each process every few seconds and kept 7 days; a window reads buckets of one resolution (1
        minute for 1h, 15 minutes for 24h, 2 hours for 7d) and lists only non-empty ones. Latency percentiles are interpolated
        from fixed buckets. Requires observability:read on a key that grants every Corpus.
      parameters:
      - name: window
        in: query
        required: false
        schema:
          type: string
          enum:
          - 1h
          - 24h
          - 7d
          default: 1h
      x-required-permissions:
      - observability:read
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginCallStatsList'
        default:
          description: Structured error; 401 unauthenticated, 403 without observability:read on every Corpus, 422 invalid_window,
            503 storage unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Admin
      summary: Get plugin call stats
  /v0/admin/stats/searches:
    get:
      operationId: getSearchStats
      description: Searches of the key's Organization over the window per mode and search profile, with errors, latency and
        the number of results returned, in the buckets of getPluginCallStats. The profile is unknown for a search that named
        a profile the deployment does not serve. Requires observability:read on a key that grants every Corpus.
      parameters:
      - name: window
        in: query
        required: false
        schema:
          type: string
          enum:
          - 1h
          - 24h
          - 7d
          default: 1h
      x-required-permissions:
      - observability:read
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchStatsList'
        default:
          description: Structured error; 401 unauthenticated, 403 without observability:read on every Corpus, 422 invalid_window,
            503 storage unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Admin
      summary: Get search stats
  /v0/admin/stats/steps:
    get:
      operationId: getStepStats
      description: 'Processing steps of the key''s Organization over the window, in the buckets of getPluginCallStats: baseline
        (cut into segments and made searchable by keyword), enrichment (vectors added) and accepted_to_searchable (from acceptance
        to searchable by keyword) time the worker''s runs. materialized, segmented, retrieval_ready and enriched are the document
        timeline''s steps, each timed from the step that causes it, so they include the time a Record Version waited for the
        step. An error is a step that is retried or blocked, with its code. Requires observability:read on a key that grants
        every Corpus.'
      parameters:
      - name: window
        in: query
        required: false
        schema:
          type: string
          enum:
          - 1h
          - 24h
          - 7d
          default: 1h
      x-required-permissions:
      - observability:read
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepStatsList'
        default:
          description: Structured error; 401 unauthenticated, 403 without observability:read on every Corpus, 422 invalid_window,
            503 storage unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Admin
      summary: Get step stats
  /v0/admin/stats/received:
    get:
      operationId: getReceivedStats
      description: Documents received by the key's Organization over the window per source namespace, in the buckets of getPluginCallStats.
        A document is counted when a command reserves a new revision of a Record; a replayed command or a revision the Record
        already had is not. Lists the limit namespaces with most documents, largest first; total and sources cover every namespace.
        Requires observability:read on a key that grants every Corpus.
      parameters:
      - name: window
        in: query
        required: false
        schema:
          type: string
          enum:
          - 1h
          - 24h
          - 7d
          default: 1h
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      x-required-permissions:
      - observability:read
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivedStatsList'
        default:
          description: Structured error; 401 unauthenticated, 403 without observability:read on every Corpus, 422 invalid_window
            or invalid_limit, 503 storage unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Admin
      summary: Get received stats
  /v0/admin/stats/matches:
    get:
      operationId: getMatchStats
      description: Matches the Subscriptions of the key's Organization committed over the window, per evaluator plugin, in
        the buckets of getPluginCallStats. A Match that corrects an earlier one on a new Version of the same Record counts
        too. Requires observability:read on a key that grants every Corpus.
      parameters:
      - name: window
        in: query
        required: false
        schema:
          type: string
          enum:
          - 1h
          - 24h
          - 7d
          default: 1h
      x-required-permissions:
      - observability:read
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchStatsList'
        default:
          description: Structured error; 401 unauthenticated, 403 without observability:read on every Corpus, 422 invalid_window,
            503 storage unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Admin
      summary: Get match stats
  /v0/admin/stats/top-queries:
    get:
      operationId: getTopQueries
      description: The most frequent search queries of the key's Organization over the window, normalized (lowercased, white
        space collapsed, at most 200 characters) and counted per hour, each with its hourly counts. Query text is recorded
        only when the deployment sets observability.record_query_text; otherwise recording is false and the list is empty.
        Requires observability:read on a key that grants every Corpus.
      parameters:
      - name: window
        in: query
        required: false
        schema:
          type: string
          enum:
          - 1h
          - 24h
          - 7d
          default: 1h
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      x-required-permissions:
      - observability:read
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopQueryList'
        default:
          description: Structured error; 401 unauthenticated, 403 without observability:read on every Corpus, 422 invalid_window
            or invalid_limit, 503 storage unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Admin
      summary: Get top queries
  /v0/search:
    post:
      operationId: searchRecords
      description: Resolve the requested profile, compile mandatory Corpus/Organization prefilters and any requested filter,
        obtain candidates, then canonically hydrate and reauthorize every returned segment. Lexical-first records remain eligible
        without embeddings; semantic-only queries require vector coverage. Profile selection does not change access/currentness
        rules. When a retrieval plugin is pinned, it ranks. It asks the engine for candidates in up to three rounds and returns
        its ranking, which may hold only candidates the engine served in this search, each already authorized and hydrated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        default:
          description: Structured error; 400 malformed, 401 unauthenticated, 403 unauthorized scope/action, 404 absent/inaccessible,
            409 idempotency conflict, 422 unsupported_profile, query_too_long (the query is over the profile's or the vector
            space owner's length limit; the message names it), unsupported_search or source_filter_unavailable, 502 retrieval_plugin_invalid
            (the retrieval plugin broke its contract, for example ranked a segment the engine never served it), 503 dependency
            unavailable, 504 search_deadline_exceeded (the retrieval plugin's rounds outran the profile's hard bound, four
            times max_latency_ms; a dependency that does not answer in time is 503).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-required-permissions:
      - content:read
      - search:query
      tags:
      - Search
      summary: Search records
  /v0/search/profiles:
    get:
      operationId: listSearchProfiles
      description: The search profiles this deployment answers, default first, with their budgets; the pinned retrieval plugin
        (core.retrieve unless another is pinned) declares them.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchProfileList'
        default:
          description: Structured error; 401 unauthenticated, 403 unauthorized scope/action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-required-permissions:
      - search:query
      tags:
      - Search
      summary: List search profiles
  /v0/corpora/{corpus_id}/vector-spaces:
    get:
      operationId: listVectorSpaces
      description: The vector spaces the Corpus's routed Projection Generation carries, the served one first, each with its
        owner (the engine, or the ingestion plugin that declares it), model, dimensions, metric, indexed and query modalities,
        its role in the generation (served answers search, evaluation is indexed and compared but never served) and its coverage,
        the current segments that hold a vector in it. A Corpus built before a space was enabled lists only the spaces it
        was built with; rebuild it (rebuildCorpusProjection) to add the others.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VectorSpaceList'
        default:
          description: Structured error; 401 unauthenticated, 403 unauthorized scope/action, 404 absent/inaccessible, 503
            dependency unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: corpus_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      x-required-permissions:
      - corpora:read
      tags:
      - Corpora
      summary: List vector spaces
  /v0/corpora/{corpus_id}/rebuilds:
    post:
      operationId: rebuildCorpusProjection
      description: Durably commit a projection_rebuild Operation and dispatch intent before returning. Rebuild the requested
        Corpus from canonical text and durable artifacts, then activate its validated logical generation. Same Organization
        + Corpus + rebuild route + idempotency key and canonical request returns the same Operation, including after terminal
        completion; changed request conflicts. HTTP does not wait for reconstruction. Retries/restarts keep identity and target
        generation. Preserve other Corpora when physical storage is shared. Normal ingestion/withdrawal guards still apply.
        Live evaluation schema migrations remain a separate mechanism. Activation follows acceptance order, so a rebuild accepted
        before one that already activated for the same Corpus and retrieval configuration fails with operation_superseded
        instead of replacing it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      responses:
        '202':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
          headers:
            Location:
              description: Authorized Operation read URL.
              schema:
                type: string
                format: uri-reference
        default:
          description: Structured error; 400 malformed, 401 unauthenticated, 403 unauthorized scope/action, 404 absent/inaccessible,
            409 idempotency conflict, 422 unsupported profile/input, 503 dependency unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-required-permissions:
      - projections:rebuild
      parameters:
      - name: corpus_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      tags:
      - Corpora
      summary: Rebuild corpus projection
components:
  securitySchemes:
    ApiKey:
      type: http
      scheme: bearer
      description: API key, not necessarily a JWT. Server derives Organization, permitted actions and Corpus scope; every
        resource access is authorized.
  schemas:
    SourceIdentity:
      type: object
      additionalProperties: false
      properties:
        corpus_id:
          type: string
          minLength: 1
        namespace:
          type: string
          minLength: 1
        record_key:
          type: string
          minLength: 1
      required:
      - corpus_id
      - namespace
      - record_key
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        retryable:
          type: boolean
        field:
          type: string
          minLength: 1
          description: JSON Pointer (RFC 6901) to the request member that caused a 422, when known (for example /config/url
            or /credential/secret/token on connector commands).
        resync_url:
          type: string
          format: uri-reference
      required:
      - code
      - message
      - retryable
    Diagnostic:
      type: object
      additionalProperties: false
      description: "A structured processing diagnostic. plugin, contribution and invocation_id name the external\ninvocation\
        \ a normalization diagnostic concerns. Codes of external normalization:\n\n- normalizer_failed: the normalizer answered\
        \ a terminal error. The Version is quarantined.\n- normalizer_invalid_output: the output broke the Plugin Protocol\
        \ or the Manifest rules (schema,\n  malformed or duplicate Part, a Blob Part that is not the input Blob or has another\
        \ checksum,\n  an undeclared extension namespace, too many Parts, a response over the size bound). Nothing\n  from\
        \ it is published; the Version is quarantined.\n- normalizer_timeout: the invocations kept exceeding the timeout until\
        \ the retry budget (the\n  manifest's retry.max_attempts, capped by the engine at 5) was spent. The Version is quarantined.\n\
        - normalizer_retries_exhausted: the normalizer kept answering retryable errors until the retry\n  budget was spent.\
        \ The Version is quarantined.\n- input_unverified: the input Blob was no longer the verified accepted input. The Version\
        \ is\n  quarantined.\n- normalizer_unrouted: the media type's route was removed after acceptance and the built-in\
        \ text\n  path cannot read it (a text/* Blob takes the built-in text path instead). The Version is\n  quarantined.\n\
        - normalization_superseded: a newer revision of the Record was accepted before this Version was\n  normalized, so\
        \ the normalizer was not invoked. The Version is quarantined and never current.\n- normalizer_conflict: a later invocation\
        \ with the same idempotency key returned a different\n  output. The first recorded output is kept and published; nothing\
        \ is overwritten.\n\nOn an optional route every quarantining code above that comes from the normalizer is instead\n\
        listed on a searchable Version published through the built-in text path. A plugin that is\nunavailable (connection\
        \ failure, 5xx without an error envelope, discovery that does not match the\npinned manifest) is retried with backoff\
        \ and produces no diagnostic while the active Pipeline\nPlan names it; the Receipt shows plugin_unavailable while\
        \ it retries.\n\n- pinned_plugin_unavailable: the processing of this Version started on a Pipeline Plan whose\n  normalizer\
        \ or ingestion plugin an operator has since replaced, and that plugin could not be\n  reached, or could no longer\
        \ serve it, for the deployment's attempt budget. The work is never\n  moved to the plugin that\n  replaced it: the\
        \ Version is quarantined, or, when its text was already searchable, its\n  enrichment stops. plan, plugin and plugin_version\
        \ name the plan and the plugin version.\n- pinned_plan_stopped: the processing of this Version started on a Pipeline\
        \ Plan that an operator\n  rolled back with pinned_work=stop. At its next call to a plugin that left the active plan,\
        \ the\n  work stopped instead of calling it, with the same outcome and fields as\n  pinned_plugin_unavailable.\n\n\
        Quarantined Versions keep their input reference and reason; reprocessing them is not available\nyet."
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        retryable:
          type: boolean
          description: Whether the same input may succeed if processed again.
        plugin:
          type: string
          minLength: 1
          description: Plugin id of the invocation.
        plugin_version:
          type: string
          minLength: 1
          description: Plugin version of a pinned_plugin_unavailable or pinned_plan_stopped diagnostic.
        plan:
          type: string
          minLength: 1
          description: Pipeline Plan the stopped work was pinned to, in a pinned_plugin_unavailable or pinned_plan_stopped
            diagnostic.
        contribution:
          type: string
          minLength: 1
        invocation_id:
          type: string
          minLength: 1
      required:
      - code
      - message
      - retryable
    Extensions:
      type: object
      additionalProperties:
        type: object
        additionalProperties: false
        properties:
          schema_version:
            type: string
            minLength: 1
          data:
            type: object
            additionalProperties: true
        required:
        - schema_version
        - data
      description: Keys are plugin namespaces. Data is validated against the installed schema version; source data is not
        a computed Annotation.
    TextContent:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
          - text
        text:
          type: string
          minLength: 1
      required:
      - kind
      - text
    BlobContent:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
          - blob
        blob_id:
          type: string
          minLength: 1
        media_type:
          type: string
          minLength: 1
      required:
      - kind
      - blob_id
      - media_type
    Part:
      type: object
      additionalProperties: false
      properties:
        key:
          type: string
          minLength: 1
        parent_key:
          type: string
          minLength: 1
        role:
          type: string
          minLength: 1
        content:
          oneOf:
          - $ref: '#/components/schemas/TextContent'
          - $ref: '#/components/schemas/BlobContent'
        extensions:
          $ref: '#/components/schemas/Extensions'
      required:
      - key
      - role
      - content
    RelationInput:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          minLength: 1
        target:
          $ref: '#/components/schemas/SourceIdentity'
        source_target_revision:
          type: string
          minLength: 1
      required:
      - type
      - target
      description: Source-provided link to an independently identified Record in the same Organization. Optional source revision
        preserves provenance; ordinary expansion resolves the current eligible target. Missing targets do not block readiness.
        Every expansion reauthorizes the target. Precise Part-target syntax remains outside this initial draft.
    ManifestContent:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
          - manifest
        parts:
          type: array
          items:
            $ref: '#/components/schemas/Part'
          minItems: 1
        relations:
          type: array
          items:
            $ref: '#/components/schemas/RelationInput'
      required:
      - kind
      - parts
      description: Unique Part keys, acyclic parent references within this Manifest, and verified same-Organization Blobs
        are checked before atomic publication. These semantic constraints need server validation in addition to JSON Schema.
    Provenance:
      type: object
      additionalProperties: false
      properties:
        source_blob_ids:
          type: array
          items:
            type: string
            minLength: 1
        producer:
          type: string
          minLength: 1
        producer_version:
          type: string
          minLength: 1
        normalization:
          $ref: '#/components/schemas/NormalizationProvenance'
      required: []
    NormalizationProvenance:
      type: object
      additionalProperties: false
      description: Engine-owned record of the external normalizer invocation whose output a Record Version publishes. Present
        only on read; a submission that sets it is rejected. producer and producer_version keep naming the acquirer, and source_blob_ids
        keeps the input Blob.
      properties:
        plugin_id:
          type: string
          minLength: 1
          maxLength: 64
        plugin_version:
          type: string
          minLength: 1
          maxLength: 64
        plugin_api:
          type: string
          minLength: 1
          maxLength: 32
          description: Plugin API version the engine invoked.
        contribution:
          type: string
          enum:
          - normalizer
        invocation_id:
          type: string
          minLength: 1
          maxLength: 128
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 256
        input_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        fallback:
          type: object
          additionalProperties: false
          description: 'Present when the route is optional and the normalizer failed: the published Manifest comes from the
            built-in text path, and invocation_id names the failed invocation.'
          properties:
            code:
              type: string
              minLength: 1
              maxLength: 64
            message:
              type: string
              minLength: 1
              maxLength: 1000
          required:
          - code
          - message
      required:
      - plugin_id
      - plugin_version
      - plugin_api
      - contribution
      - invocation_id
      - idempotency_key
      - input_sha256
    IngestCommand:
      type: object
      additionalProperties: false
      properties:
        idempotency_key:
          type: string
          minLength: 1
        source:
          $ref: '#/components/schemas/SourceIdentity'
        source_revision:
          type: string
          minLength: 1
        source_position:
          type: string
          pattern: ^[0-9]+$
          description: Optional monotonic source position, encoded as decimal text to avoid JSON numeric precision loss.
        content:
          oneOf:
          - $ref: '#/components/schemas/TextContent'
          - $ref: '#/components/schemas/BlobContent'
          - $ref: '#/components/schemas/ManifestContent'
          discriminator:
            propertyName: kind
            mapping:
              text: '#/components/schemas/TextContent'
              blob: '#/components/schemas/BlobContent'
              manifest: '#/components/schemas/ManifestContent'
        extensions:
          $ref: '#/components/schemas/Extensions'
        provenance:
          $ref: '#/components/schemas/Provenance'
      required:
      - idempotency_key
      - source
      - content
      description: Initial request shape. Same source identity creates or corrects a Record. Same external revision with different
        canonical content conflicts. No revision means canonical Manifest digest identity; no source position means durable
        acceptance order. Single and batch entry replay share route_family=ingestion. A blob content accepts a verified text/*
        Blob, read at acceptance, or a Blob whose media type the installation routes to an external normalizer; that normalizer
        runs after acceptance and its output is the published Manifest, while the Version identity still derives from the
        submitted Blob. When the normalizer fails, the Version is quarantined with a Diagnostic on the Version read (or, on
        an optional text/* route, published through the built-in text path with provenance.normalization.fallback). Other
        media types are rejected with unverified_blob. provenance.normalization is engine-owned and rejected on input. Extension
        namespaces owned by the pinned plugin are written only by its normalizer output, published on the Version; a submission
        writing one, top-level or on a Part, is rejected with 422 extension_namespace_owned.
    WithdrawalCommand:
      type: object
      additionalProperties: false
      properties:
        idempotency_key:
          type: string
          minLength: 1
        source:
          $ref: '#/components/schemas/SourceIdentity'
        reason:
          type: string
          minLength: 1
      required:
      - idempotency_key
      - source
    Availability:
      type: object
      additionalProperties: false
      properties:
        state:
          type: string
          enum:
          - materialized
          - building_baseline
          - retrieval_ready
          - quarantined
        is_current:
          type: boolean
        searchable:
          type: boolean
      required:
      - state
      - is_current
      - searchable
    Receipt:
      type: object
      additionalProperties: false
      properties:
        receipt_id:
          type: string
          minLength: 1
        state:
          type: string
          enum:
          - pending
          - resolved
        outcome:
          type: string
          enum:
          - created
          - duplicate
          - withdrawal_applied
          - conflict
        record_id:
          type: string
          minLength: 1
        version_id:
          type: string
          minLength: 1
        availability:
          $ref: '#/components/schemas/Availability'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/Error'
          maxItems: 20
        source:
          $ref: '#/components/schemas/SourceIdentity'
        processing:
          $ref: '#/components/schemas/ProcessingSummary'
      required:
      - receipt_id
      - state
      - diagnostics
      - source
      - processing
      description: Durable acceptance outcome, not workflow state. Availability is a separate authorized live read view; omitted
        before a linked version exists. Infrastructure retry never resolves a Receipt as failed.
      if:
        properties:
          state:
            const: pending
      then:
        not:
          required:
          - outcome
      else:
        required:
        - outcome
    BatchRequest:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items: {}
          minItems: 1
          maxItems: 100
      required:
      - items
      description: Envelope validation checks items array and batch/body limits only. Each raw entry is independently validated
        as IngestCommand; even a missing required field or wrong JSON type returns an entry error. SDK convenience builders
        may type valid entries as IngestCommand, but server envelope validation must not reject the entire batch for an invalid
        entry.
    BatchItem:
      type: object
      additionalProperties: false
      properties:
        index:
          type: integer
          minimum: 0
        receipt:
          $ref: '#/components/schemas/Receipt'
        error:
          $ref: '#/components/schemas/Error'
      required:
      - index
      if:
        required:
        - receipt
      then:
        not:
          required:
          - error
      else:
        required:
        - error
    BatchResult:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BatchItem'
          maxItems: 100
      required:
      - items
    Record:
      type: object
      additionalProperties: false
      properties:
        record_id:
          type: string
          minLength: 1
        source:
          $ref: '#/components/schemas/SourceIdentity'
        withdrawn:
          type: boolean
        current_version_id:
          type: string
          minLength: 1
      required:
      - record_id
      - source
      - withdrawn
    Version:
      type: object
      additionalProperties: false
      properties:
        record_id:
          type: string
          minLength: 1
        version_id:
          type: string
          minLength: 1
        accepted_at:
          type: string
          format: date-time
          description: When Quivr accepted the revision this Version publishes, before any processing.
        manifest:
          $ref: '#/components/schemas/ManifestContent'
        extensions:
          $ref: '#/components/schemas/Extensions'
        provenance:
          $ref: '#/components/schemas/Provenance'
        availability:
          $ref: '#/components/schemas/Availability'
        relations:
          type: array
          items:
            $ref: '#/components/schemas/ResolvedRelation'
        processing:
          $ref: '#/components/schemas/ProcessingSummary'
        steps:
          $ref: '#/components/schemas/VersionSteps'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/Diagnostic'
          maxItems: 20
          description: Why the Version needs attention. A quarantined Version lists its reason first. A Version published
            through an optional route's fallback lists the normalizer failure it fell back from, and a recorded normalizer_conflict
            is listed on the Version whose output was kept. Omitted when there is nothing to report.
      required:
      - record_id
      - version_id
      - manifest
      - availability
      - relations
      - processing
    VersionSteps:
      type: object
      additionalProperties: false
      description: When each processing step of the Version finished, written once by the transaction that commits the step.
        A step not finished yet is omitted. Versions materialized before step times were recorded carry only accepted_at,
        and withdrawn_at for a withdrawal after; history is not reconstructed.
      properties:
        accepted_at:
          type: string
          format: date-time
          description: Quivr accepted the revision.
        materialized_at:
          type: string
          format: date-time
          description: The Version was published from normalized content.
        segmented_at:
          type: string
          format: date-time
          description: The Version was first cut into segments.
        retrieval_ready_at:
          type: string
          format: date-time
          description: The Version first became searchable.
        enriched_at:
          type: string
          format: date-time
          description: Vectors were first attached to the Version.
        evaluated_at:
          type: string
          format: date-time
          description: Every Subscription asked to evaluate the Version had decided; one that waits for vectors decides on
            their round. Omitted when no Subscription evaluated it, or when one waiting for vectors was disabled before they
            arrived. With more than 100 Subscriptions on one Corpus it can be set once the first 100 have decided.
        quarantined_at:
          type: string
          format: date-time
          description: The Version was quarantined.
        withdrawn_at:
          type: string
          format: date-time
          description: The Version's Record was withdrawn.
    AdminDocument:
      type: object
      additionalProperties: false
      properties:
        version_id:
          type: string
          minLength: 1
        record_id:
          type: string
          minLength: 1
        corpus_id:
          type: string
          minLength: 1
        source_namespace:
          type: string
        record_key:
          type: string
        title:
          type: string
          description: The inline title Part of the accepted command, truncated to 200 characters; omitted when there is none.
        state:
          type: string
          enum:
          - received
          - materialized
          - building_baseline
          - retrieval_ready
          - quarantined
          - withdrawn
          description: received until the Version is materialized, then its Version Availability state, and withdrawn once
            its Record is.
        is_current:
          type: boolean
        steps:
          $ref: '#/components/schemas/VersionSteps'
      required:
      - version_id
      - record_id
      - corpus_id
      - source_namespace
      - record_key
      - state
      - is_current
      - steps
    AdminDocumentPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminDocument'
        next_page_cursor:
          type: string
          minLength: 1
      required:
      - items
    TimelineStep:
      type: object
      additionalProperties: false
      properties:
        step:
          type: string
          enum:
          - accepted
          - materialized
          - segmented
          - retrieval_ready
          - enriched
          - evaluated
          - quarantined
          - withdrawn
        at:
          type: string
          format: date-time
        since:
          type: string
          description: The step the duration is measured from. Each step is timed from the step that causes it; enriched and
            evaluated both follow retrieval_ready, and quarantined follows the latest step finished before it. Omitted for
            accepted and withdrawn, and when that step has no time or a later one.
        duration_ms:
          type: integer
          minimum: 0
        plugin_id:
          type: string
          description: The plugin that ran the step, when known. materialized names the normalizer whose output was published;
            segmented, retrieval_ready and enriched name the ingestion plugin whose segments the Corpus serves.
        plugin_version:
          type: string
      required:
      - step
      - at
    DocumentTimeline:
      type: object
      additionalProperties: false
      properties:
        document:
          $ref: '#/components/schemas/AdminDocument'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/TimelineStep'
      required:
      - document
      - steps
    UploadRequest:
      type: object
      additionalProperties: false
      properties:
        size_bytes:
          type: integer
          minimum: 1
          maximum: 1073741824
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        media_type:
          type: string
          minLength: 1
      required:
      - size_bytes
      - sha256
      - media_type
    Upload:
      type: object
      additionalProperties: false
      properties:
        upload_id:
          type: string
          minLength: 1
        state:
          type: string
          enum:
          - awaiting_upload
          - verifying
          - verified
          - rejected
          - expired
        upload_url:
          type: string
          format: uri
        upload_headers:
          type: object
          additionalProperties:
            type: string
        expires_at:
          type: string
          format: date-time
        blob_id:
          type: string
          minLength: 1
        error:
          $ref: '#/components/schemas/Error'
        upload_method:
          type: string
          enum:
          - PUT
      required:
      - upload_id
      - state
      description: Upload URL and headers are transfer capabilities. Only verified uploads expose a usable Blob ID. Repeated
        confirmation of the same session observes the same verification, never a second upload.
      allOf:
      - if:
          properties:
            state:
              const: verified
        then:
          required:
          - blob_id
        else:
          not:
            required:
            - blob_id
    Blob:
      type: object
      additionalProperties: false
      properties:
        blob_id:
          type: string
          minLength: 1
        size_bytes:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        media_type:
          type: string
          minLength: 1
      required:
      - blob_id
      - size_bytes
      - sha256
      - media_type
    Operation:
      type: object
      additionalProperties: false
      properties:
        operation_id:
          type: string
          minLength: 1
        kind:
          type: string
          minLength: 1
        state:
          type: string
          enum:
          - queued
          - running
          - paused
          - succeeded
          - failed
          - cancel_requested
          - canceled
        progress:
          type: number
          minimum: 0
          maximum: 1
          description: Approximate fraction, omitted when unknown.
        counters:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
          maxItems: 20
        previous_operation_id:
          type: string
          minLength: 1
        corpus_id:
          type: string
          minLength: 1
        result:
          $ref: '#/components/schemas/ProjectionRebuildResult'
        backfill:
          $ref: '#/components/schemas/OperationBackfill'
      required:
      - operation_id
      - kind
      - state
      - counters
      - errors
      description: Administrative execution only. Retries keep identity. Intentional terminal rerun has a new ID and previous_operation_id.
        Cancellation does not promise universal rollback; already-terminal state and racing completion may win. projection_rebuild,
        retrieval_configuration and backfill Operations require corpus_id; when succeeded they require result naming the activated
        logical generation, or for a backfill the generation it filled. A backfill also carries backfill, and its counters
        versions_in_scope, versions_done, versions_skipped (with skipped_<reason>) and segments. Only a backfill can be paused.
      if:
        properties:
          kind:
            enum:
            - projection_rebuild
            - retrieval_configuration
            - backfill
        required:
        - kind
      then:
        required:
        - corpus_id
        if:
          properties:
            state:
              const: succeeded
          required:
          - state
        then:
          required:
          - result
    FieldMapping:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        source_pointer:
          type: string
          minLength: 1
        type:
          type: string
          enum:
          - string
          - number
          - boolean
          - datetime
          - string_array
        roles:
          type: array
          items:
            type: string
            enum:
            - search
            - filter
          minItems: 1
      required:
      - name
      - source_pointer
      - type
      - roles
      description: v0 logical field mapping. name is a logical name matching ^[a-z][a-z0-9_]{0,63}$, never a search-engine
        field name. source_pointer is an RFC 6901 JSON Pointer into the canonical source view of a Version, rooted at /manifest,
        /provenance or /extensions/{namespace} with a declared namespace (built in, or owned by the startup-pinned plugin);
        other roots are rejected as invalid_mapping. Core validates role/type compatibility (search requires string or string_array).
        A search field named title replaces the projected title; other search fields add text once per Record Version. Filter
        roles are validated and preserved; no public filter API consumes them in v0.
    RetrievalConfig:
      type: object
      additionalProperties: false
      properties:
        plugin_profile:
          type: string
          minLength: 1
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldMapping'
      required: []
      description: Pin a plugin-provided profile when resolving config. Explicit fields override default fields by logical
        name; unmapped source data remains preserved. getCorpus returns the effective resolved fields. The only built-in profile,
        example.editorial, is illustrative (paired with the example extension namespace), not a product default; an uninstalled
        profile is 422 unsupported_profile.
    ConnectorKind:
      type: string
      pattern: ^[a-z][a-z0-9_]{0,31}$
      description: Connector kind, provided by the engine or by a pinned connector plugin; listConnectorKinds lists the kinds
        this deployment accepts. Built-in kinds are fixture (a deterministic test connector available only when the deployment
        enables it). First-party connector plugins provide rss (RSS 2.0, RSS 1.0, Atom and JSON Feed documents; config url,
        optional honor_ttl; optional credential username+password or token), x_list (an X list) and m365_mail (Microsoft 365
        mailboxes). Another kind is refused with 422 unsupported_connector_kind.
    CredentialDeposit:
      type: object
      additionalProperties: false
      properties:
        secret:
          type: object
          writeOnly: true
          description: Kind-specific secret, validated by the kind's credential JSON Schema, encrypted at rest with the deployment
            credential key and never returned or logged. Without a configured credential key the request is refused with 503
            credentials_unavailable.
        expires_at:
          type: string
          format: date-time
      required:
      - secret
    CredentialReplace:
      type: object
      additionalProperties: false
      properties:
        idempotency_key:
          type: string
          minLength: 1
        secret:
          type: object
          writeOnly: true
        expires_at:
          type: string
          format: date-time
      required:
      - idempotency_key
      - secret
    ConnectorSchedule:
      type: object
      additionalProperties: false
      properties:
        interval_seconds:
          type: integer
          minimum: 1
          maximum: 86400
          description: Polling interval. Defaults per kind (fixture/rss 300, m365_mail 60, x_list 120); values below the deployment
            floor (30 s by default) are 422 invalid_interval.
    ConnectorRunRequest:
      type: object
      additionalProperties: false
      properties:
        connector_id:
          type: string
        run_at:
          type: string
          format: date-time
          description: When the requested run is due; now unless the interval floor or the source's Retry-After defers it.
      required:
      - connector_id
      - run_at
    ScheduleChange:
      type: object
      additionalProperties: false
      properties:
        interval_seconds:
          type: integer
          description: Seconds between runs. Bounds are the deployment floor and 86400; values outside them are 422 invalid_interval
            with field /interval_seconds.
      required:
      - interval_seconds
    ConnectorKindDescription:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          minLength: 1
          description: Kind identifier accepted by createConnector for this deployment. A plain string so kinds added by future
            providers need no contract change here.
        title:
          type: string
          minLength: 1
          description: Display name, from the config schema's title annotation (the kind when absent).
        description:
          type: string
          description: Short explanation, from the config schema's description annotation.
        config_schema:
          type: object
          description: JSON Schema (2020-12) validating config. Annotations (title, description, examples) are informational.
        credential_schema:
          type: object
          description: JSON Schema validating credential.secret. Members annotated writeOnly are secrets. Absent when the
            kind takes no credential.
        credential:
          type: string
          enum:
          - none
          - optional
          - required
          description: Whether an instance of this kind takes, may take or needs a Deposited Credential.
        default_interval_seconds:
          type: integer
          minimum: 1
      required:
      - kind
      - title
      - config_schema
      - credential
      - default_interval_seconds
    PluginRegistration:
      type: object
      additionalProperties: false
      properties:
        registration_id:
          type: string
          minLength: 1
        plugin_id:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
        endpoint:
          type: string
          minLength: 1
          description: Base URL where the operator runs this plugin version.
        manifest_digest:
          type: string
          minLength: 1
        artifact_digest:
          type: string
          minLength: 1
          description: Artifact digest the plugin reports, recorded as information. Absent when it reports none.
        contributions:
          type: array
          items:
            type: string
        roles:
          type: array
          items:
            type: string
          description: Roles the manifest declares it can serve, such as normalizer:application/pdf, subscription:<plugin
            id> or connector:<kind>. The active plan says which it serves.
        state:
          type: string
          enum:
          - registered
          - validated
          - active
          - draining
          - inactive
          - rejected
          description: registered while the Contract Runner checks it, then validated or rejected; active while the active
            plan names it. Once a later plan leaves it out it is draining while pinned_work is above zero, then inactive.
        pinned_work:
          type: integer
          minimum: 0
          description: Unfinished work pinned to a Pipeline Plan that names this registration, such as the processing of a
            receipt, a connector run or a rebuild. Work finishes on the plan it started on, so a registration a plan change
            left out keeps being called until this reaches zero.
        check:
          $ref: '#/components/schemas/PluginCheckReport'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - registration_id
      - plugin_id
      - version
      - endpoint
      - manifest_digest
      - contributions
      - roles
      - state
      - pinned_work
      - created_at
      - updated_at
    PluginRegistrationRequest:
      type: object
      additionalProperties: false
      properties:
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 200
        endpoint:
          type: string
          minLength: 1
          maxLength: 2048
          description: Base URL where the operator runs the plugin, such as http://127.0.0.1:9900. A connector plugin needs
            https unless it is on loopback.
        manifest:
          type: string
          minLength: 1
          maxLength: 262144
          description: The exact text of the quivr-plugin.yaml the plugin was built from; its sha256 must be the manifest
            digest the plugin's discovery reports.
        configuration:
          type: object
          description: Plugin configuration, validated against the manifest's configuration schema.
        routes:
          type: array
          maxItems: 100
          description: Media types routed to the plugin's normalizer.
          items:
            type: object
            additionalProperties: false
            properties:
              media_type:
                type: string
                minLength: 1
              mode:
                type: string
                enum:
                - required
                - optional
            required:
            - media_type
        kinds:
          type: array
          maxItems: 100
          description: Alert kinds offered, a subset of those the manifest declares; absent offers them all.
          items:
            type: string
            minLength: 1
        spaces:
          type: object
          description: Vector spaces of an ingestion plugin by space id, served or evaluation; absent serves the only declared
            space.
          additionalProperties:
            type: string
            enum:
            - served
            - evaluation
      required:
      - idempotency_key
      - endpoint
      - manifest
    PluginCheckReport:
      type: object
      additionalProperties: false
      description: What the Contract Runner reported on a registration; certified plugins are validated.
      properties:
        certified:
          type: boolean
        checked_at:
          type: string
          format: date-time
        passed:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        skipped:
          type: integer
          minimum: 0
        checks:
          type: array
          items:
            $ref: '#/components/schemas/PluginCheck'
      required:
      - certified
      - checked_at
      - passed
      - failed
      - skipped
      - checks
    PluginCheck:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        contribution:
          type: string
          minLength: 1
        status:
          type: string
          enum:
          - pass
          - fail
          - skip
        issues:
          type: array
          items:
            $ref: '#/components/schemas/PluginIssue'
      required:
      - id
      - title
      - status
      - issues
    PluginIssue:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
        path:
          type: string
        message:
          type: string
          minLength: 1
      required:
      - code
      - message
    PluginRegistrationList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PluginRegistration'
      required:
      - items
    PipelinePlanRole:
      type: object
      additionalProperties: false
      properties:
        role:
          type: string
          minLength: 1
        registration_id:
          type: string
          minLength: 1
        plugin_id:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
      required:
      - role
      - registration_id
      - plugin_id
      - version
    PipelinePlanList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PipelinePlan'
      required:
      - items
    BackfillRequest:
      type: object
      additionalProperties: false
      properties:
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 200
        corpus_id:
          type: string
          minLength: 1
        accepted_after:
          type: string
          format: date-time
          description: Only Versions Quivr accepted at or after this time; absent, from the first.
        accepted_before:
          type: string
          format: date-time
          description: Only Versions Quivr accepted before this time; absent, up to now.
        registration_id:
          type: string
          minLength: 1
          description: The ingestion plugin registration to run; absent, the active plan's. Another one is 409 registration_not_active.
        spaces:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            minLength: 1
          description: The vector spaces to fill, which the plugin declares and the deployment serves or evaluates; absent,
            the deployment's evaluation spaces the plugin owns.
        dry_run:
          type: boolean
          description: true reports the estimate and records it; false starts the backfill a dry run with the same key and
            scope preceded.
        confirm_cost:
          type: boolean
          default: false
          description: Accept an estimated cost above the deployment's backfill.max_cost_without_confirmation.
      required:
      - idempotency_key
      - corpus_id
      - dry_run
    BackfillEstimate:
      type: object
      additionalProperties: false
      properties:
        registration_id:
          type: string
          minLength: 1
        spaces:
          type: array
          items:
            type: string
            minLength: 1
        versions:
          type: integer
          minimum: 0
          description: Versions in scope that miss a vector in a target space.
        segments:
          type: integer
          minimum: 0
          description: Their segments, which the plugin embeds.
        input_tokens:
          type: integer
          minimum: 0
          description: Estimated tokens the plugin embeds, one per four code points of segment text.
        estimated_seconds:
          type: number
          format: double
          minimum: 0
          description: How long the backfill should take, at the deployment's backfill.rate or the recent throughput, whichever
            is slower.
        duration_basis:
          type: string
          enum:
          - rate
          - recent_backfills
          - recent_plugin_calls
          description: What the duration comes from.
        estimated_cost_usd:
          type: number
          format: double
          minimum: 0
          description: Estimated cost in US dollars, rounded up to the cent, of the target spaces that declare an input_price
            in the plugin manifest; a space without one adds nothing. Absent when none declares one, so the cost is unknown.
        confirmation_required:
          type: boolean
          description: The cost exceeds backfill.max_cost_without_confirmation, so starting the backfill needs confirm_cost.
      required:
      - registration_id
      - spaces
      - versions
      - segments
      - input_tokens
      - estimated_seconds
      - duration_basis
      - confirmation_required
    OperationBackfill:
      type: object
      additionalProperties: false
      description: What a backfill fills and how far it got.
      properties:
        registration_id:
          type: string
          minLength: 1
        spaces:
          type: array
          items:
            type: string
            minLength: 1
        accepted_after:
          type: string
          format: date-time
        accepted_before:
          type: string
          format: date-time
        plan_id:
          type: string
          minLength: 1
          description: The Pipeline Plan the backfill is pinned to, once it started.
        checkpoint:
          type: string
          minLength: 1
          description: The last Version id it finished; it resumes after it, in Version id order.
        estimate:
          $ref: '#/components/schemas/BackfillEstimate'
      required:
      - registration_id
      - spaces
      - estimate
    VectorSpacePromotionRequest:
      type: object
      additionalProperties: false
      properties:
        force:
          type: boolean
          default: false
          description: Promote even though some current segments have no vector in the space; those lose their semantic hits
            until a backfill fills them.
    VectorSpacePromotion:
      type: object
      additionalProperties: false
      properties:
        served_space_id:
          type: string
          minLength: 1
        previous_space_id:
          type: string
          description: The space it replaced, now for evaluation; empty when none was served.
        generations_switched:
          type: integer
          minimum: 0
          description: Generations that now serve the space.
        corpora_incomplete:
          type: integer
          minimum: 0
          description: Corpora whose routed generation lacks the space or a vector in it.
        segments_missing:
          type: integer
          minimum: 0
          description: Current segments without a vector in the space.
      required:
      - served_space_id
      - previous_space_id
      - generations_switched
      - corpora_incomplete
      - segments_missing
    PipelinePlanRollbackRequest:
      type: object
      additionalProperties: false
      properties:
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 200
        plan_id:
          type: string
          minLength: 1
          description: The plan whose roles become active again; absent returns to the plan the active one replaced (its previous_plan_id).
        pinned_work:
          type: string
          enum:
          - drain
          - stop
          default: drain
          description: What happens to work pinned to a plan naming a plugin version the rollback takes out. drain lets it
            finish on that version, which stays draining meanwhile. stop keeps it from calling that version again once each
            process follows the new plan (within plugin_plan_poll). Its next call fails instead. The processing of a Version
            then stops with the diagnostic pinned_plan_stopped, with the outcome of pinned_plugin_unavailable, and a rebuild
            fails with that code. A connector run fails as when its plugin is unavailable, and its next run uses the active
            plan.
      required:
      - idempotency_key
    PipelinePlan:
      type: object
      additionalProperties: false
      properties:
        plan_id:
          type: string
          minLength: 1
        created_at:
          type: string
          format: date-time
        activated_at:
          type: string
          format: date-time
        source:
          type: string
          enum:
          - configuration
          - activation
          - rollback
          description: What recorded the plan, and so why the plan changed. configuration is the startup configuration, which
            applies the roles its pins changed since it last applied, even over an earlier activation of the same role. activation
            is an operator activation. rollback is an operator rollback to an earlier plan's roles.
        previous_plan_id:
          type: string
          minLength: 1
          description: The plan this one replaced; absent for the first plan of the deployment.
        roles:
          type: array
          description: One entry per role, sorted by role.
          items:
            $ref: '#/components/schemas/PipelinePlanRole'
      required:
      - plan_id
      - created_at
      - activated_at
      - source
      - roles
    ActivePluginList:
      type: object
      additionalProperties: false
      properties:
        plan_activated_at:
          type: string
          format: date-time
          description: When the active plan was activated; absent when no plan is active.
        items:
          type: array
          description: One entry per plugin version in the plan, sorted by plugin id then version.
          items:
            $ref: '#/components/schemas/ActivePlugin'
      required:
      - items
    ActivePlugin:
      type: object
      additionalProperties: false
      properties:
        plugin_id:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
        roles:
          type: array
          description: The plan's roles this version serves, sorted, for example ingestion, retrieval, normalizer:<media type>,
            subscription:<plugin id> or connector:<kind>.
          items:
            type: string
            minLength: 1
      required:
      - plugin_id
      - version
      - roles
    StatsSummary:
      type: object
      additionalProperties: false
      description: A series over the whole window. Latencies are in milliseconds and present only when count is positive.
      properties:
        count:
          type: integer
          minimum: 0
        errors:
          type: integer
          minimum: 0
        p50_ms:
          type: number
          minimum: 0
        p95_ms:
          type: number
          minimum: 0
        mean_ms:
          type: number
          minimum: 0
        last_error_code:
          type: string
          minLength: 1
        last_error_at:
          type: string
          format: date-time
      required:
      - count
      - errors
    StatsPoint:
      type: object
      additionalProperties: false
      description: One non-empty bucket, starting at start and lasting the list's resolution_seconds.
      properties:
        start:
          type: string
          format: date-time
        count:
          type: integer
          minimum: 1
        errors:
          type: integer
          minimum: 0
        p50_ms:
          type: number
          minimum: 0
        p95_ms:
          type: number
          minimum: 0
      required:
      - start
      - count
      - errors
      - p50_ms
      - p95_ms
    PluginCallStats:
      type: object
      additionalProperties: false
      properties:
        plugin_id:
          type: string
          minLength: 1
        plugin_version:
          type: string
          minLength: 1
        operation:
          type: string
          enum:
          - normalize
          - segment_and_embed
          - embed_query
          - search_round
          - connector_fetch
          - connector_receive
          - check_credential
          - describe_attachment
          - upload_attachment
          - evaluate_subscription
        summary:
          $ref: '#/components/schemas/StatsSummary'
        points:
          type: array
          description: Non-empty buckets, oldest first.
          items:
            $ref: '#/components/schemas/StatsPoint'
      required:
      - plugin_id
      - plugin_version
      - operation
      - summary
      - points
    SearchStats:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum:
          - lexical
          - semantic
          - hybrid
        profile:
          type: string
          minLength: 1
        results:
          type: integer
          minimum: 0
          description: Results returned by these searches in total.
        summary:
          $ref: '#/components/schemas/StatsSummary'
        points:
          type: array
          description: Non-empty buckets, oldest first.
          items:
            $ref: '#/components/schemas/StatsPoint'
      required:
      - mode
      - profile
      - results
      - summary
      - points
    StepStats:
      type: object
      additionalProperties: false
      properties:
