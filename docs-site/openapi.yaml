    ConnectorKindCatalog:
      type: object
      additionalProperties: false
      properties:
        credential_deposits:
          type: string
          enum:
          - available
          - unavailable
          description: unavailable on a deployment without a credential key, where credential deposits and rotations are refused
            with 503 credentials_unavailable.
        min_interval_seconds:
          type: integer
          minimum: 1
          description: Shortest polling interval this deployment accepts.
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConnectorKindDescription'
      required:
      - credential_deposits
      - min_interval_seconds
      - items
    ConnectorHealthPolicy:
      type: object
      additionalProperties: false
      properties:
        silent_after_seconds:
          type: integer
          minimum: 1
          maximum: 2592000
          description: No new item for this long makes the source silent. Default 86400.
        credential_warning_seconds:
          type: integer
          minimum: 0
          maximum: 31536000
          description: A credential expiring within this window is credential_expiring. Default 1209600.
    ConnectorCreate:
      type: object
      additionalProperties: false
      properties:
        idempotency_key:
          type: string
          minLength: 1
        corpus_id:
          type: string
          minLength: 1
        source_namespace:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          $ref: '#/components/schemas/ConnectorKind'
        config:
          type: object
          description: Kind-specific configuration validated by the kind's JSON Schema. Holds no secret.
        schedule:
          $ref: '#/components/schemas/ConnectorSchedule'
        health_policy:
          $ref: '#/components/schemas/ConnectorHealthPolicy'
        credential:
          $ref: '#/components/schemas/CredentialDeposit'
      required:
      - idempotency_key
      - corpus_id
      - source_namespace
      - kind
      - config
    CredentialMetadata:
      type: object
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 1
        deposited_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
      required:
      - version
      - deposited_at
      description: Metadata of the current Deposited Credential; the secret itself is never returned.
    ConnectorError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
        at:
          type: string
          format: date-time
      required:
      - code
      - at
    ConnectorUsage:
      type: object
      additionalProperties: false
      properties:
        day:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          description: Current UTC calendar day (YYYY-MM-DD).
        items_read:
          type: integer
          minimum: 0
          description: Source resources read during the current UTC day, counted as the source bills them (for x_list, an
            estimate of billed post reads after X's per-UTC-day deduplication).
        previous_day_items_read:
          type: integer
          minimum: 0
      required:
      - day
      - items_read
      - previous_day_items_read
      description: Per-UTC-day source read counters, present only for kinds that report reads.
    ConnectorHealth:
      type: object
      additionalProperties: false
      properties:
        state:
          type: string
          enum:
          - active
          - silent
          - access_error
          - credential_expiring
          - disabled
        evaluated_at:
          type: string
          format: date-time
        last_success_at:
          type: string
          format: date-time
        last_item_at:
          type: string
          format: date-time
        last_error:
          $ref: '#/components/schemas/ConnectorError'
        usage:
          $ref: '#/components/schemas/ConnectorUsage'
        diagnostics:
          type: object
          description: Kind-defined diagnostics from the latest acquisition page, documented on the kind's operator guide
            page (for x_list, the deletion recheck coverage). Informational; never holds a secret or source content.
        push:
          $ref: '#/components/schemas/ConnectorPush'
      required:
      - state
      - evaluated_at
      description: Last committed Connector Health, evaluated at each acquisition run, credential replacement and disable;
        evaluated_at shows its age. Precedence disabled, access_error, credential_expiring, silent, active. access_error means
        the source refused access (distinct from silent, which means no new item within the threshold), including a push channel
        refused access while polling carries the collection. Other failures appear only as last_error.
    ConnectorPush:
      type: object
      additionalProperties: false
      properties:
        state:
          type: string
          enum:
          - active
          - pending
          - degraded
          description: active, deliveries are expected; pending, the kind has not set its push channel up yet; degraded, the
            setup failed or deliveries fail or miss items, and polling at the instance's interval carries the collection.
        error:
          $ref: '#/components/schemas/ConnectorPushError'
        last_delivery_at:
          type: string
          format: date-time
          description: Last delivery the connector plugin accepted.
        poll_interval_seconds:
          type: integer
          minimum: 1
          description: While push is active, polling runs at most this often, as a safety net.
      required:
      - state
      description: Push delivery health, present once a kind that declares the push mode reports its push channel.
    ConnectorPushError:
      type: object
      additionalProperties: false
      properties:
        class:
          type: string
          enum:
          - access
          - transient
          - source
        code:
          type: string
          minLength: 1
          description: For example webhook_invalid (the source invalidated the webhook), plugin_unavailable (a delivery found
            the plugin down) or missed_deliveries (polling found items no delivery brought).
        at:
          type: string
          format: date-time
      required:
      - class
      - code
      - at
    Connector:
      type: object
      additionalProperties: false
      properties:
        connector_id:
          type: string
          minLength: 1
        corpus_id:
          type: string
          minLength: 1
        source_namespace:
          type: string
          minLength: 1
        kind:
          $ref: '#/components/schemas/ConnectorKind'
        config:
          type: object
        schedule:
          type: object
          additionalProperties: false
          properties:
            interval_seconds:
              type: integer
              minimum: 1
          required:
          - interval_seconds
        health_policy:
          type: object
          additionalProperties: false
          properties:
            silent_after_seconds:
              type: integer
              minimum: 1
            credential_warning_seconds:
              type: integer
              minimum: 0
          required:
          - silent_after_seconds
          - credential_warning_seconds
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        disabled_at:
          type: string
          format: date-time
        credential:
          $ref: '#/components/schemas/CredentialMetadata'
        health:
          $ref: '#/components/schemas/ConnectorHealth'
        webhook_url:
          type: string
          format: uri
          description: Public address of the instance's webhook route, present when its kind declares the push mode and the
            deployment sets public_url. The kind's plugin registers it with the source.
      required:
      - connector_id
      - corpus_id
      - source_namespace
      - kind
      - config
      - schedule
      - health_policy
      - enabled
      - created_at
      - health
    ConnectorPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
