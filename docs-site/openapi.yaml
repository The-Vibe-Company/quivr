          description: Structured error; see contract HTTP mapping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: connector_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      tags:
      - Connectors
      summary: Disable connector
  /v0/connectors/{connector_id}/credential:
    put:
      operationId: replaceConnectorCredential
      description: Deposit a new credential version to rotate the current one. The secret is encrypted at rest and never returned.
        Replaying the same key and request is idempotent; a different request under the same key is 409 idempotency_conflict.
        A disabled instance is 409 connector_disabled. Commits connector.credential_replaced, and connector.health_changed
        when the evaluated health changes. A deployment without a credential key refuses every rotation with 503 credentials_unavailable
        (retryable false) before storing or digesting it.
      x-required-permissions:
      - connectors:write
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connector'
        default:
          description: Structured error; see contract HTTP mapping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: connector_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialReplace'
      tags:
      - Connectors
      summary: Replace connector credential
  /v0/connectors/{connector_id}/schedule:
    put:
      operationId: changeConnectorSchedule
      description: Set the polling interval of an enabled instance. Setting the current value commits nothing, so repeating
        the request is harmless. A shorter interval pulls the next scheduled run in; a longer one applies after the run already
        scheduled. A disabled instance is 409 connector_disabled; an interval below the deployment floor (30 s by default)
        or above 24 h is 422 invalid_interval with field /interval_seconds. Commits connector.schedule_changed only when the
        interval changes.
      x-required-permissions:
      - connectors:write
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connector'
        default:
          description: Structured error; see contract HTTP mapping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: connector_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleChange'
      tags:
      - Connectors
      summary: Change connector schedule
  /v0/connectors/{connector_id}/runs:
    post:
      operationId: requestConnectorRun
      description: Ask for an acquisition run now instead of at the next scheduled time, for example to check again a source
        that failed. The next run is pulled in, never pushed out, so repeating the request changes nothing and a run already
        in flight answers it. Rate limits still hold -- the run starts no sooner than the deployment interval floor (30 s
        by default) after the previous run ended, nor before the Retry-After the source asked for. The run then goes through
        the usual scheduler lease and records its outcome in health, committing connector.health_changed when the state changes;
        the request itself commits no event. run_at is when the run is due; the scheduler starts it within seconds after.
        A disabled instance is 409 connector_disabled.
      x-required-permissions:
      - connectors:write
      responses:
        '202':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorRunRequest'
        default:
          description: Structured error; see contract HTTP mapping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: connector_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      tags:
      - Connectors
      summary: Request connector run
  /v0/connector-kinds:
    get:
      operationId: listConnectorKinds
      description: Connector kinds enabled in this deployment, with the JSON Schemas that validate their config and credential
        secret, so clients can render configuration forms without knowing the kinds. credential_deposits tells whether this
        deployment accepts Deposited Credentials at all; when unavailable, any create carrying a credential and every rotation
        is 503 credentials_unavailable.
      x-required-permissions:
      - connectors:read
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorKindCatalog'
        default:
          description: Structured error; see contract HTTP mapping.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Connector kinds
      summary: List connector kinds
  /v0/admin/plugins:
    get:
      operationId: listPluginRegistrations
      description: Every plugin version this deployment has registered, oldest first, with its endpoint, manifest digest,
        the roles its manifest declares and its state. Quivr never starts a plugin; the operator runs it at its endpoint.
        Every start records the plugins pinned in the startup configuration. Deployment-wide and not paginated. Requires plugins:admin,
        an operator action that organization keys do not get.
      x-required-permissions:
      - plugins:admin
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginRegistrationList'
        default:
          description: Structured error; 401 unauthenticated, 403 without plugins:admin, 503 storage unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Admin
      summary: List plugin registrations
    post:
      operationId: registerPlugin
      description: Register a plugin version the operator runs at an address. The request carries the exact quivr-plugin.yaml
        the plugin was built from, its endpoint and the settings it is installed with, with the shape and rules of a pin in
        the startup configuration (configuration, routes, kinds, spaces); plugin id and version come from the manifest. Quivr
        then checks it in the background with the Contract Runner against the endpoint, whose discovery must report the manifest's
        digest. The registration is registered while its check runs, then validated or rejected with the report. The same
        idempotency key returns the same registration; a key already used for another registration is 409 idempotency_conflict;
        a new key for a rejected registration checks it again. 422 invalid_plugin lists what the engine refuses in the manifest
        or settings. Requires plugins:admin.
      x-required-permissions:
      - plugins:admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PluginRegistrationRequest'
      responses:
        '202':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginRegistration'
          headers:
            Location:
              description: The registration's read URL, which reports the check once it ran.
              schema:
                type: string
                format: uri-reference
        default:
          description: Structured error; 400 malformed, 401 unauthenticated, 403 without plugins:admin, 409 idempotency_conflict,
            422 invalid_schema or invalid_plugin, 503 storage unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Admin
      summary: Register plugin
  /v0/admin/plugins/{registration_id}:
    get:
      operationId: getPluginRegistration
      description: One registration with the Contract Runner's report once its check ran. Requires plugins:admin.
      x-required-permissions:
      - plugins:admin
      parameters:
      - name: registration_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginRegistration'
        default:
          description: Structured error; 401 unauthenticated, 403 without plugins:admin, 404 unknown registration, 503 storage
            unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Admin
      summary: Get plugin registration
  /v0/admin/plugins/{registration_id}/activate:
    post:
      operationId: activatePlugin
      description: Make a validated registration serve every role it declares, as a new immutable Pipeline Plan that api and
        worker follow without restarting; the previous plan stays readable. Every other version of the same plugin leaves
        the plan, and so does every registration whose roles it takes over entirely. The new plan must keep the rules the
        engine applies at startup (one normalizer per media type, one provider per connector kind, one ingestion and one retrieval
        plugin, extension namespace and vector space ownership); otherwise 409 plugin_conflict lists what breaks. 409 registration_not_validated
        for a registration that is not validated or inactive; 422 unsupported_role for an alert-rule plugin, which the configuration
        pins. Activating the registration that is already active returns the active plan. Work already started may finish
        on the new plan (THE-782 pins it to its own). Requires plugins:admin.
      x-required-permissions:
      - plugins:admin
      parameters:
      - name: registration_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelinePlan'
        default:
          description: Structured error; 401 unauthenticated, 403 without plugins:admin, 404 unknown registration, 409 registration_not_validated
            or plugin_conflict, 422 unsupported_role, 503 storage unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Admin
      summary: Activate plugin
  /v0/admin/plugins/plans/{plan_id}:
    get:
      operationId: getPipelinePlan
      description: Any Pipeline Plan this deployment recorded, active or not. Plans are immutable, so an earlier plan stays
        readable after an activation. Requires plugins:admin.
      x-required-permissions:
      - plugins:admin
      parameters:
      - name: plan_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelinePlan'
        default:
          description: Structured error; 401 unauthenticated, 403 without plugins:admin, 404 unknown plan, 503 storage unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Admin
      summary: Get pipeline plan
  /v0/admin/plugins/plans:
    get:
      operationId: listPipelinePlans
      description: The latest Pipeline Plans this deployment recorded, newest first. Each names the plan it replaced (previous_plan_id)
        and what recorded it (source), so this list is the history of plan changes; earlier plans stay reachable through previous_plan_id.
        Requires plugins:admin.
      x-required-permissions:
      - plugins:admin
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelinePlanList'
        default:
          description: Structured error; 401 unauthenticated, 403 without plugins:admin, 422 invalid_limit, 503 storage unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Admin
      summary: List pipeline plans
  /v0/admin/backfills:
    post:
      operationId: requestBackfill
      description: Reprocess a Corpus's past Versions with the active ingestion plugin, to fill vector spaces of the generation
        the Corpus is routed to, typically a new evaluation space. The scope is the Corpus and, optionally, a window on when
        Quivr accepted its Versions. Only Versions whose segments all hold a vector in the served space and miss one in a
        target space are processed; live enrichment fills the target spaces for newer Versions once the backfill has started.
        A dry run is required. dry_run true answers 200 with the estimate and records it under the idempotency key. The same
        body with dry_run false then accepts the backfill as a queued Operation (202, Location). Without a dry run recorded
        under that key and scope, the answer is 409 dry_run_required. An estimated cost above the deployment's backfill.max_cost_without_confirmation
        needs confirm_cost true, otherwise 409 cost_confirmation_required. The same key with another scope is 409 idempotency_conflict,
        and an accepted key replays its Operation. A Corpus whose previous backfill has not finished is 409 backfill_in_progress.
        The backfill runs on its own task queue at the deployment's backfill.rate, pinned to the Pipeline Plan active when
        it starts. It can be paused, resumed and canceled, and resumes from its checkpoint after a restart. It never creates
        Record Versions or content events. Versions whose projected segments the plugin would cut differently are skipped
        and counted (segmentation_differs), and a rebuild re-segments them. Requires plugins:admin, on a key of the Corpus's
        Organization that grants the Corpus.
      x-required-permissions:
      - plugins:admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackfillRequest'
      responses:
        '200':
          description: The dry run's estimate, recorded under the key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackfillEstimate'
        '202':
          description: The accepted backfill Operation; read it at the Location.
          headers:
            Location:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        default:
          description: Structured error; 400 malformed, 401 unauthenticated, 403 without plugins:admin, 404 unknown Corpus,
            409 dry_run_required, cost_confirmation_required, idempotency_conflict, backfill_in_progress, registration_not_active
            or rebuild_required (the Corpus's generation predates named vector spaces), 422 invalid_schema or invalid_backfill
            (a space the plugin does not declare or the deployment does not enable, or an empty window), 503 storage unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Admin
      summary: Request backfill
  /v0/admin/spaces/{vector_space_id}/promote:
    post:
      operationId: promoteVectorSpace
      description: Make a registered evaluation space the one search uses, in one call, for the whole deployment. Coverage
        must be complete, that is every Corpus's routed generation carries the space with a vector for every current segment.
        Otherwise the answer is 409 coverage_incomplete, with the Corpora and segments it misses in the message, unless force
        is true. Every generation that carries the space and served the previous one serves it from then on, the default one
        included, so new Corpora start on it. The previous served space becomes an evaluation space and keeps its vectors,
        so promoting it again restores it. The choice survives restarts, activations and rollbacks while the ingestion plugin
        still enables both spaces. Promoting the served space changes nothing. Requires plugins:admin.
      x-required-permissions:
      - plugins:admin
      parameters:
      - name: vector_space_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VectorSpacePromotionRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VectorSpacePromotion'
        default:
          description: Structured error; 400 malformed, 401 unauthenticated, 403 without plugins:admin, 404 unknown space,
            409 coverage_incomplete, 422 invalid_schema or not_evaluation_space (a retired space), 503 storage unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Admin
      summary: Promote vector space
  /v0/admin/plugins/plan/rollback:
    post:
      operationId: rollbackPipelinePlan
      description: Make an earlier plan's roles active again, as a new immutable Pipeline Plan with source rollback that api
        and worker follow without restarting. The default target is the plan the active one replaced; plan_id names another
        one. Registrations the rollback brings back serve again, even when they were draining or inactive. Registrations it
        takes out drain, or stop with pinned_work=stop. The target must keep the rules of an activation. Otherwise the answer
        is 409 plugin_conflict, or 422 unsupported_role when the rollback would change an alert-rule plugin. Every plugin
        it brings back must answer discovery at its endpoint with its manifest's digest. Otherwise the answer is 409 plugin_unreachable,
        naming the plugin and the cause, and no plan changes. 409 no_previous_plan when there is no earlier plan to return
        to. A rollback to the active plan's roles returns the active plan. The same idempotency key with the same request
        returns the plan it recorded. The same key with another request is 409 idempotency_conflict. Nothing already produced
        is rewritten. Requires plugins:admin.
      x-required-permissions:
      - plugins:admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelinePlanRollbackRequest'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelinePlan'
        default:
          description: Structured error; 400 malformed, 401 unauthenticated, 403 without plugins:admin, 404 unknown plan,
            409 idempotency_conflict, no_previous_plan, plugin_conflict, plugin_unreachable or registration_not_validated,
            422 invalid_schema or unsupported_role, 503 storage unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Admin
      summary: Rollback pipeline plan
  /v0/admin/plugins/plan:
    get:
      operationId: getActivePipelinePlan
      description: The active Pipeline Plan, an immutable mapping of every role of the deployment to the registration serving
        it, which api and worker follow. 404 not_found when no plan is active, because the startup configuration pins no plugin.
        Requires plugins:admin.
      x-required-permissions:
      - plugins:admin
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelinePlan'
        default:
          description: Structured error; 401 unauthenticated, 403 without plugins:admin, 404 no active plan, 503 storage unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Admin
      summary: Get active pipeline plan
  /v0/admin/active-plugins:
    get:
      operationId: listActivePlugins
      description: The plugin versions the active Pipeline Plan runs and the roles each serves, for operator views that read
        the plugin call rollups beside them. It names no address, configuration, manifest or digest, so it needs observability:read
        on a key that grants every Corpus, not plugins:admin. Empty when no plan is active.
      x-required-permissions:
      - observability:read
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivePluginList'
        default:
