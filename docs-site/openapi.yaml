          application/json:
            schema:
              $ref: '#/components/schemas/ActionRequest'
      tags:
      - Subscriptions
      summary: Delete subscription
  /v0/subscriptions/{subscription_id}/disable:
    post:
      operationId: disableSubscription
      description: Commit disable. Block new evaluation commits and new Delivery Attempt admissions, including queued retries
        and update notices. In-flight attempts may complete. A match.withdrawn notice for a Match of this Subscription is
        still committed with its pending Delivery, which makes no attempt until re-enable. Repeat is idempotent; history remains.
      x-required-permissions:
      - monitoring:write
      responses:
        '200':
          description: Successful response
