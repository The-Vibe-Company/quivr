            without a plugin registry, 503 storage unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Admin
      summary: List active plugins
  /v0/admin/documents:
    get:
      operationId: listAdminDocuments
      description: The Organization's most recently accepted Record Versions across all its Corpora, newest first, with their
        Source, title, current state and step times, read in one query. Requires observability:read on a key for all Corpora;
