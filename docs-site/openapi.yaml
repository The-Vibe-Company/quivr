        next_page_cursor:
          type: string
          minLength: 1
      required:
      - items
    ConfigUpdate:
      type: object
      additionalProperties: false
      properties:
        idempotency_key:
          type: string
          minLength: 1
        retrieval:
          $ref: '#/components/schemas/RetrievalConfig'
      required:
      - idempotency_key
      - retrieval
    ActionRequest:
      type: object
      additionalProperties: false
      properties:
        idempotency_key:
          type: string
          minLength: 1
      required:
      - idempotency_key
    RenameRequest:
      type: object
      additionalProperties: false
      properties:
        idempotency_key:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
      required:
      - idempotency_key
      - name
      description: New display name of a Saved Query or Subscription.
    ResourceReference:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          minLength: 1
        id:
          type: string
          minLength: 1
        corpus_id:
          type: string
          minLength: 1
      required:
      - kind
      - id
    ChangeEvent:
      type: object
      additionalProperties: false
      properties:
        event_id:
          type: string
          minLength: 1
        type:
          type: string
          minLength: 1
        schema_version:
          type: string
          minLength: 1
        occurred_at:
          type: string
          format: date-time
        resource:
          $ref: '#/components/schemas/ResourceReference'
        cursor:
          type: string
          minLength: 1
        monitoring:
          $ref: '#/components/schemas/MonitoringReferences'
      required:
      - event_id
      - type
      - schema_version
      - occurred_at
      - resource
      - cursor
      description: Every change to a Record catalog entry emits an event with resource.kind=record and resource.id=the affected
        Record ID. Additional resource-specific events do not replace this invalidation. Consumers reread current state; payload
        detail belongs to THE-547. Monitoring notice types mirror WebhookEvent and include monitoring references; event_id
        identifies that same committed notice. Delivery status changes emit delivery.updated events only to the feed, never
        recursive webhooks.
    ChangePage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChangeEvent'
        next_cursor:
          type: string
          minLength: 1
        has_more:
          type: boolean
      required:
      - items
      - next_cursor
      - has_more
    ResolvedRelation:
      type: object
      additionalProperties: false
      required:
      - source_reference
      - status
      properties:
        source_reference:
          $ref: '#/components/schemas/RelationInput'
        status:
          type: string
          enum:
          - available
          - unavailable
        target_record_id:
          type: string
        target_version_id:
          type: string
      description: Separate live view, not a mutation of the source Manifest. Unavailable covers missing, unready, withdrawn
        and inaccessible without distinguishing existence or revealing resolved target IDs.
      if:
        properties:
          status:
            const: available
      then:
        required:
        - target_record_id
        - target_version_id
      else:
        not:
          anyOf:
          - required:
            - target_record_id
          - required:
            - target_version_id
    ProcessingSummary:
      type: object
      additionalProperties: false
      required:
      - state
      properties:
        state:
          type: string
          enum:
          - queued
          - running
          - retrying
          - blocked
          - idle
        phase:
          type: string
          enum:
          - materialization
          - baseline
          - enrichment
        message:
          type: string
      description: Live read view, not a Receipt lifecycle or public workflow identifier. blocked means an outstanding contribution
        needs intervention; diagnostics describe why. idle means no work currently pending, not a promise of final enrichment.
        Phase is omitted when idle; required and optional progress do not override Version Availability.
    SavedQueryDefinition:
      type: object
      additionalProperties: false
      properties:
        corpus_ids:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
          uniqueItems: true
        expression:
          type: object
          additionalProperties: true
        retrieval_profile:
          type: string
          minLength: 1
          description: A search profile the deployment answers (listSearchProfiles), recorded as sent; balanced, the deprecated
            name of default, is accepted through engine 0.1.x. Another profile is 422 unsupported_profile. The profile is
            checked only when a definition is written, so a Version keeps its profile and keeps evaluating after the profile
            stops being served.
        temporal_policy:
          type: string
          enum:
          - from_activation
      required:
      - corpus_ids
      - expression
      - retrieval_profile
      - temporal_policy
      description: Immutable query definition. Expression semantics belong to the evaluator plugin; no core keyword or semantic
        threshold is implied. All Corpora belong to the authorized Organization.
    SavedQueryCreate:
      type: object
      additionalProperties: false
      properties:
        idempotency_key:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        definition:
          $ref: '#/components/schemas/SavedQueryDefinition'
      required:
      - idempotency_key
      - name
      - definition
    SavedQueryVersionCreate:
      type: object
      additionalProperties: false
      properties:
        idempotency_key:
          type: string
          minLength: 1
        definition:
          $ref: '#/components/schemas/SavedQueryDefinition'
      required:
      - idempotency_key
      - definition
      description: New immutable definition of an existing Saved Query. The name is unchanged (rename changes it).
    SavedQueryVersion:
      type: object
      additionalProperties: false
      properties:
        saved_query_id:
          type: string
          minLength: 1
        version_id:
          type: string
          minLength: 1
        definition:
          $ref: '#/components/schemas/SavedQueryDefinition'
      required:
      - saved_query_id
      - version_id
      - definition
    SavedQuery:
      type: object
      additionalProperties: false
      properties:
        saved_query_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        deleted:
          type: boolean
          description: Logically deleted; the Saved Query and its Versions stay readable.
        current_version:
          $ref: '#/components/schemas/SavedQueryVersion'
      required:
      - saved_query_id
      - name
      - deleted
      - current_version
    EvaluatorConfig:
      type: object
      additionalProperties: false
      properties:
        plugin_id:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
        configuration:
          type: object
          additionalProperties: true
      required:
      - plugin_id
      - version
      - configuration
      description: Pins an installed evaluator by plugin id and version, and its configuration. Evaluators are the subscription
        Contributions of the plugins pinned at startup (Plugin Protocol v0); test deployments may also install the deterministic
        fixture quivr.fixture@1. The configuration must satisfy the evaluator's declared configuration schema.
    SubscriptionCreate:
      type: object
      additionalProperties: false
      properties:
        idempotency_key:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        saved_query_id:
          type: string
          minLength: 1
        saved_query_version_id:
          type: string
          minLength: 1
        evaluator:
          $ref: '#/components/schemas/EvaluatorConfig'
        destination_id:
          type: string
          minLength: 1
        owner:
          $ref: '#/components/schemas/SubscriptionOwner'
      required:
      - idempotency_key
      - name
      - saved_query_id
      - saved_query_version_id
      - evaluator
      - destination_id
      description: Create enabled from-now Subscription. An optional owner makes it the Subscription of one end user of the
        client application; without one it is global to the Organization. The owner is fixed for the Subscription's life and
        part of the idempotent request. One deployment-configured destination per version; destination belongs to this Organization.
        URL and signing key are provisioned outside this API and not returned. No inline secret or dynamic destination registry
        in the tracer.
    SubscriptionVersionCreate:
      type: object
      additionalProperties: false
      properties:
        idempotency_key:
          type: string
          minLength: 1
        saved_query_version_id:
          type: string
          minLength: 1
        evaluator:
          $ref: '#/components/schemas/EvaluatorConfig'
        destination_id:
          type: string
          minLength: 1
      required:
      - idempotency_key
      - saved_query_version_id
      - evaluator
      - destination_id
      description: New immutable configuration of an existing Subscription. The Saved Query and name are unchanged (rename
        changes the name); saved_query_version_id is the current Version of that Saved Query.
    SubscriptionVersion:
      type: object
      additionalProperties: false
      properties:
        subscription_id:
          type: string
          minLength: 1
        version_id:
          type: string
          minLength: 1
        saved_query_id:
          type: string
          minLength: 1
        saved_query_version_id:
          type: string
          minLength: 1
        evaluator:
          $ref: '#/components/schemas/EvaluatorConfig'
        destination_id:
          type: string
          minLength: 1
        owner:
          $ref: '#/components/schemas/SubscriptionOwner'
      required:
      - subscription_id
      - version_id
      - saved_query_id
      - saved_query_version_id
      - evaluator
      - destination_id
      description: Immutable Subscription configuration. Every Version keeps the Subscription's owner, absent for a global
        Subscription.
    Subscription:
      type: object
      additionalProperties: false
      properties:
        subscription_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        enabled:
          type: boolean
        deleted:
          type: boolean
          description: Logically deleted for good; a deleted Subscription is also disabled and stays readable with its Versions,
            Matches and Deliveries.
        current_version:
          $ref: '#/components/schemas/SubscriptionVersion'
        owner:
          $ref: '#/components/schemas/SubscriptionOwner'
      required:
      - subscription_id
      - name
      - enabled
      - deleted
      - current_version
      description: Absent owner means a global, organization-wide Subscription.
    SubscriptionOwner:
      type: string
      minLength: 1
      maxLength: 128
      description: Subscription Owner, an opaque end-user reference defined by the client application (for example user-123).
        Quivr stores, filters and echoes it without interpreting it. At most 128 characters without control characters; none
        is reserved for the listing filter (422 invalid_owner).
    SubscriptionPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Subscription'
        next_page_cursor:
          type: string
          minLength: 1
      required:
      - items
    SubscriptionPreviewRequest:
      type: object
      additionalProperties: false
      properties:
        definition:
          $ref: '#/components/schemas/SavedQueryDefinition'
        saved_query_id:
          type: string
          minLength: 1
        saved_query_version_id:
          type: string
          minLength: 1
        evaluator:
          $ref: '#/components/schemas/EvaluatorConfig'
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
          description: The most Record Versions to judge, newest first. Each one costs an evaluator call.
        accepted_after:
          type: string
          format: date-time
          description: Judge only revisions accepted after this instant.
      required:
      - evaluator
      description: A proposed Subscription to preview. Give either definition, an inline Saved Query definition, or saved_query_id
        with saved_query_version_id, an existing Saved Query Version; not both.
    SubscriptionPreviewMatch:
      type: object
      additionalProperties: false
      properties:
        corpus_id:
          type: string
          minLength: 1
        record_id:
          type: string
          minLength: 1
        record_version_id:
          type: string
          minLength: 1
        accepted_at:
          type: string
          format: date-time
        evidence:
          $ref: '#/components/schemas/MatchEvidence'
      required:
      - corpus_id
      - record_id
      - record_version_id
      - accepted_at
      - evidence
      description: A Record Version the proposed Subscription would have matched, with the evidence a Match would carry. It
        is not a Match and is not stored.
    SubscriptionPreview:
      type: object
      additionalProperties: false
      properties:
        evaluated:
          type: integer
          minimum: 0
          description: Record Versions the evaluator decided.
        matched:
          type: integer
          minimum: 0
        not_ready:
          type: integer
          minimum: 0
          description: Record Versions the evaluator could not decide yet (for example before enrichment).
        complete:
          type: boolean
          description: False when the time budget ran out before every listed Record Version was decided.
        oldest_accepted_at:
          type: string
          format: date-time
          description: When the oldest decided Record Version was accepted; absent when none was decided.
        matches:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/SubscriptionPreviewMatch'
          description: Most recently accepted first.
      required:
      - evaluated
      - matched
      - not_ready
      - complete
      - matches
      description: What a proposed Subscription would have matched among recent Record Versions.
    MatchEvidence:
      type: object
      additionalProperties: false
      properties:
        evaluator:
          $ref: '#/components/schemas/EvaluatorConfig'
        explanation:
          type: string
          maxLength: 4096
        part_keys:
          type: array
          items:
            type: string
            minLength: 1
          maxItems: 100
        details:
          type: object
          additionalProperties: true
      required:
      - evaluator
      - explanation
      description: Immutable evidence for a positive result, including evaluator version/configuration. Details are plugin-defined,
        bounded to 16 KiB and schema-validated by its adapter; core checks referenced Parts. Access is rechecked on reads.
    Match:
      type: object
      additionalProperties: false
      properties:
        match_id:
          type: string
          minLength: 1
        subscription_id:
          type: string
          minLength: 1
        subscription_version_id:
          type: string
          minLength: 1
        saved_query_id:
          type: string
          minLength: 1
        saved_query_version_id:
          type: string
          minLength: 1
        record_id:
          type: string
          minLength: 1
        record_version_id:
          type: string
          minLength: 1
        previous_match_id:
          type: string
          minLength: 1
        owner:
          $ref: '#/components/schemas/SubscriptionOwner'
        evidence:
          $ref: '#/components/schemas/MatchEvidence'
      required:
      - match_id
      - subscription_id
      - subscription_version_id
      - saved_query_id
      - saved_query_version_id
      - record_id
      - record_version_id
      - evidence
      description: Immutable positive historical determination, not a claim of current eligibility. Unique subscription-version/record-version.
        Correction/withdrawal notifications reference history; no Match is fabricated for negative decisions. owner is the
        Subscription's owner, absent when global.
    MatchPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Match'
        next_page_cursor:
          type: string
          minLength: 1
      required:
      - items
    MonitoringReferences:
      type: object
      additionalProperties: false
      properties:
        match_id:
          type: string
          minLength: 1
        record_id:
          type: string
          minLength: 1
        record_version_id:
          type: string
          minLength: 1
        subscription_id:
          type: string
          minLength: 1
        subscription_version_id:
          type: string
          minLength: 1
        delivery_id:
          type: string
          minLength: 1
        previous_match_id:
          type: string
          minLength: 1
        owner:
          $ref: '#/components/schemas/SubscriptionOwner'
      required:
      - match_id
      - record_id
      - record_version_id
      - subscription_id
      - subscription_version_id
      - delivery_id
      description: owner is the Subscription Owner, so a client routes the notice to its user; absent for a global Subscription
        and in notices committed before owners existed. match_id is the new Match for created/corrected, prior positive Match
        for no_longer_matches/withdrawn. record_version_id is the causal correction version for corrected/no_longer_matches,
        otherwise the matched version. References alone confer no access.
    WebhookEvent:
      type: object
      additionalProperties: false
      properties:
        event_id:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
        type:
          type: string
          enum:
          - match.created
          - match.corrected
          - match.no_longer_matches
          - match.withdrawn
        schema_version:
          type: string
          enum:
          - '1'
        occurred_at:
          type: string
          format: date-time
        references:
          $ref: '#/components/schemas/MonitoringReferences'
      required:
      - event_id
      - type
      - schema_version
      - occurred_at
      - references
      description: Immutable reference-only notification. Retries preserve event_id and the exact stored body bytes; signing
        timestamp changes per attempt. No document content, excerpt, explanation, cursor or secret is embedded.
    DeliveryAdmission:
      type: object
      additionalProperties: false
      properties:
        allowed:
          type: boolean
        reason:
          type: string
          enum:
          - subscription_disabled
          - subscription_deleted
          - record_withdrawn
          - superseded
          - access_denied
          - destination_unavailable
          - terminal
      required:
      - allowed
      description: Current derived admission view, separate from durable Delivery state. A disallowed pending Delivery makes
        no new network attempt; it does not become a new lifecycle state. destination_unavailable means its destination is
        no longer configured for the Organization. subscription_disabled lasts until a re-enable; subscription_deleted is
        permanent. record_withdrawn refuses match.created, match.corrected and match.no_longer_matches; match.withdrawn is
        admitted for a withdrawn Record. superseded refuses an undelivered match.created or match.corrected once a later match.corrected
        or match.no_longer_matches exists for the same Subscription and Record, and an undelivered match.no_longer_matches
        once a later match.corrected exists; match.withdrawn is never superseded.
    Delivery:
      type: object
      additionalProperties: false
      properties:
        delivery_id:
          type: string
          minLength: 1
        match_id:
          type: string
          minLength: 1
        destination_id:
          type: string
          minLength: 1
        state:
          type: string
          enum:
          - pending
          - delivering
          - delivered
          - exhausted
        event:
          $ref: '#/components/schemas/WebhookEvent'
        attempt_count:
          type: integer
          minimum: 0
        admission:
          $ref: '#/components/schemas/DeliveryAdmission'
        last_error:
          $ref: '#/components/schemas/Error'
        next_attempt_at:
          type: string
          format: date-time
          description: When the next automatic attempt becomes eligible. Present only while the Delivery is pending and admission
            is allowed; a retry waits with jittered exponential backoff (or a valid Retry-After on 429/503), never beyond
            the delivery window.
      required:
      - delivery_id
      - match_id
      - destination_id
      - state
      - event
      - attempt_count
      - admission
    DeliveryAttempt:
      type: object
      additionalProperties: false
      properties:
        attempt_id:
          type: string
          minLength: 1
        delivery_id:
          type: string
          minLength: 1
        number:
          type: integer
          minimum: 1
        outcome:
          type: string
          enum:
          - in_flight
          - acknowledged
          - retryable_error
          - permanent_error
          - unknown
        http_status:
          type: integer
          minimum: 100
          maximum: 599
        error:
          $ref: '#/components/schemas/Error'
      required:
      - attempt_id
      - delivery_id
      - number
      - outcome
      description: Read view of append-only admission/outcome facts. Unknown network result can be retried with the same event
        ID; no response body, signature or signing key is exposed.
    DeliveryAttemptPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryAttempt'
        next_page_cursor:
          type: string
          minLength: 1
      required:
      - items
    SearchRequest:
      type: object
      additionalProperties: false
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 8192
          description: At most 8192 code points on the wire. A semantic or hybrid query is also limited by the owner of the
            searched vector space (the first-party core.ingest plugin accepts at most 256 tokens of its model's tokenizer);
            a longer query is refused with 422 query_too_long, whose message names the limit, never truncated.
        corpus_ids:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
          maxItems: 16
          uniqueItems: true
        mode:
          type: string
          enum:
          - lexical
          - semantic
          - hybrid
          default: hybrid
        profile:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,31}$
          default: default
          description: A search profile this deployment answers (listSearchProfiles). The pinned retrieval plugin answers
            the profiles it declares, default among them. balanced is a deprecated alias of default, accepted through engine
            0.1.x and removed in engine 0.2.0. An unknown profile returns 422 unsupported_profile.
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
        filter:
          $ref: '#/components/schemas/SearchFilter'
      required:
      - query
      - corpus_ids
      description: Text-only top-k query. Resolve all Corpora in the authenticated Organization and require read/search permission
        for every requested Corpus before querying. Never silently drop an unauthorized Corpus. Unknown/unsupported profile
        or mode returns 422; a dependency outage is an error, not an empty successful result. Query token limits are checked
        against the resolved profile; no silent truncation. An optional filter narrows candidates inside the engine query,
        before ranking and the limit, in every mode. Other metadata filters and pagination are outside this surface.
    SearchFilter:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        source_namespaces:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          minItems: 1
          maxItems: 50
          uniqueItems: true
          description: Keep only Records whose Source Namespace is one of these values. Ranking and the limit apply within
            the filtered set, so a source's best matches are returned even when other sources outrank them.
      description: Candidate filter applied before ranking. Every present condition must hold. A requested Corpus served by
        a Projection Generation built before source filtering existed returns 422 source_filter_unavailable; rebuild that
        Corpus once (rebuildCorpusProjection) to enable it. Unfiltered search is unaffected.
    SearchProfile:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
      required:
      - name
      - version
      description: Resolved retrieval profile identity. Name is the profile that answered (default when the request named
        none or the deprecated balanced). Version identifies what ranked as plugin:<plugin id>@<version>/<profile>, naming
        the retrieval plugin, its version and the profile.
    SearchProfileList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchProfileDescription'
          minItems: 1
          maxItems: 8
      required:
      - items
    SearchProfileDescription:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        max_latency_ms:
          type: integer
          minimum: 1
          description: Latency objective (p95 target) of one search under this profile. A slower search still answers; the
            hard bound is four times this value, at least 2 s and at most 9 s.
        max_cost_cents:
          type: number
          minimum: 0
          description: Most a search may spend on paid calls.
        provider:
          type: object
          additionalProperties: false
          properties:
            kind:
              type: string
              enum:
              - engine
              - plugin
              description: plugin, the retrieval plugin that answers the profile. engine is no longer returned since the engine's
                own search moved into core.retrieve.
            plugin_id:
              type: string
              minLength: 1
            plugin_version:
              type: string
              minLength: 1
          required:
          - kind
      required:
      - name
      - provider
    SearchUsage:
      type: object
      additionalProperties: false
      properties:
        rounds:
          type: integer
          minimum: 1
          maximum: 3
        elapsed_ms:
          type: integer
          minimum: 0
        paid_calls:
          type: integer
          minimum: 0
        cost_cents:
          type: number
          minimum: 0
      required:
      - rounds
      - elapsed_ms
      - paid_calls
      - cost_cents
      description: What a search answered by a retrieval plugin spent; rounds of the plugin, elapsed time, and the paid calls
        and cost the plugin reported.
    SearchExcerpt:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
          maxLength: 4096
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 0
        coordinate_system:
          type: string
          enum:
          - unicode_codepoint
      required:
      - text
      - start
      - end
      - coordinate_system
      description: Exact canonical normalized Part text slice [start,end), using Unicode code points, not UTF-8 bytes or UTF-16
        units. End must be >= start and end-start must equal the excerpt code-point length. Bounds are checked against the
        referenced immutable Part. No synthetic highlights or rewritten snippets.
    SearchHit:
      type: object
      additionalProperties: false
      properties:
        record_id:
          type: string
          minLength: 1
        version_id:
          type: string
          minLength: 1
        part_key:
          type: string
          minLength: 1
        segment_id:
          type: string
          minLength: 1
        segmentation_id:
          type: string
          minLength: 1
        projection_generation_id:
          type: string
          minLength: 1
        embedding_artifact_id:
          type: string
          minLength: 1
        vector_space_id:
          type: string
          minLength: 1
        rank:
          type: integer
          minimum: 1
        excerpt:
          $ref: '#/components/schemas/SearchExcerpt'
        availability:
          $ref: '#/components/schemas/Availability'
        explanation:
          type: string
          minLength: 1
          maxLength: 1024
          description: Why the retrieval plugin ranked this hit here, when it says so.
      required:
      - record_id
      - version_id
      - part_key
      - segment_id
      - segmentation_id
      - projection_generation_id
      - rank
      - excerpt
      - availability
      description: One authorized segment hit. Rehydrate from canonical storage and recheck Organization/Corpus access, currentness,
        quarantine and Tombstone before returning. Rank is contiguous and one-based after hydration/filtering. Projection
        Generation, segmentation, segment and optional Embedding Artifact/Vector Space are logical durable IDs, not physical
        collection names or workflow IDs. Embedding references are omitted when that segment has lexical coverage only. They
        do not assert that the dense branch contributed to its rank. All hits inherit the response retrieval profile. Raw
        scores/explainScore stay internal.
      if:
        required:
        - embedding_artifact_id
      then:
        required:
        - vector_space_id
      else:
        not:
          required:
          - vector_space_id
    SearchResponse:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchHit'
          maxItems: 50
        retrieval_profile:
          $ref: '#/components/schemas/SearchProfile'
        usage:
          $ref: '#/components/schemas/SearchUsage'
      required:
      - items
      - retrieval_profile
      description: Bounded top-k results after canonical rechecks. May contain fewer hits than requested; no total count,
        completeness promise or stable pagination snapshot. Empty results still name the resolved profile.
    ProjectionRebuildResult:
      type: object
      additionalProperties: false
      properties:
        projection_generation_id:
          type: string
          minLength: 1
      required:
      - projection_generation_id
      description: Logical generation activated for the requested Corpus. Opaque ID, never a physical search collection name.
webhooks:
  monitoringNotification:
    post:
      operationId: receiveMonitoringNotification
      description: Receiver endpoint, not a Quivr API route. Verify Standard Webhooks v1 HMAC-SHA256 over webhook-id + dot
        + webhook-timestamp + dot + raw body before parsing. Timestamp refreshed per attempt; body event_id equals webhook-id.
        See monitoring contract for retry defaults.
      security: []
      parameters:
      - name: webhook-id
        in: header
        required: true
        schema:
          type: string
          minLength: 1
      - name: webhook-timestamp
        in: header
        required: true
        schema:
          type: string
          minLength: 1
      - name: webhook-signature
        in: header
        required: true
        schema:
          type: string
          minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookEvent'
      responses:
        2XX:
          description: Receiver durably accepted/deduplicated this event.
        default:
          description: Transport retry policy applies; do not create another Match.
      tags:
      - Webhooks
      summary: Receive monitoring notification
