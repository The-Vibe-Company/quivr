  /v0/connector-webhooks/{connector_id}:
    get:
      operationId: relayConnectorChallenge
      description: Public webhook route of one Connector Instance whose kind declares the push mode; the address is its webhook_url.
        There is no API key; the connector plugin verifies the request (a signature, a challenge) with the Deposited Credential.
        A GET is typically a source's verification challenge, relayed to the plugin like a delivery.
      security: []
      parameters:
      - name: connector_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        2XX:
          description: The connector plugin accepted the delivery; its items were ingested before this answer. The body and
            content type are the plugin's answer to the source (for example a challenge response).
        4XX:
          description: The connector plugin refused the delivery (for example a bad signature), with its own body; nothing
            changed. 404 names no enabled instance of a kind that declares push; 413 a body over 1 MiB.
        '500':
          description: The delivery cannot be processed (the plugin reported an access or source error), shown in health.push.
        '503':
          description: Temporarily unavailable (the plugin is unreachable or ingestion is down); retry after Retry-After seconds.
            Polling catches up meanwhile.
      tags:
      - Connector webhooks
      summary: Relay connector challenge
    post:
      operationId: relayConnectorDelivery
      description: Relay one delivery the source sends to the Connector Instance. The core passes the raw request (a body
        of at most 1 MiB, lowercase headers) to the connector plugin, which verifies it and returns the items it carries.
        Items converge with those of pull runs on the same Receipts. Deliveries update health.push.
      security: []
      parameters:
      - name: connector_id
        in: path
        required: true
        schema:
          type: string
          minLength: 1
      responses:
        2XX:
          description: The connector plugin accepted the delivery; its items were ingested before this answer. The body and
            content type are the plugin's answer to the source (for example a challenge response).
        4XX:
          description: The connector plugin refused the delivery (for example a bad signature), with its own body; nothing
            changed. 404 names no enabled instance of a kind that declares push; 413 a body over 1 MiB.
        '500':
          description: The delivery cannot be processed (the plugin reported an access or source error), shown in health.push.
        '503':
          description: Temporarily unavailable (the plugin is unreachable or ingestion is down); retry after Retry-After seconds.
            Polling catches up meanwhile.
      tags:
      - Connector webhooks
      summary: Relay connector delivery
  /v0/connectors/{connector_id}:
