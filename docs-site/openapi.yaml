      - Subscriptions
      summary: Create subscription version
  /v0/subscriptions/{subscription_id}/delete:
    post:
      operationId: deleteSubscription
      description: Logically delete a Subscription for good, with subscription.deleted per Corpus. It is also disabled, with
        every disable guarantee - no new evaluation commit and no new Delivery Attempt admission (reason subscription_deleted);
        an in-flight attempt may complete. As for a disabled Subscription, a match.withdrawn notice for one of its Matches
        is still committed with its pending Delivery, which is never attempted. The Subscription, its Versions, Matches and
        Deliveries stay readable with deleted true. Enable or edit is then 409 subscription_deleted. Repeat is idempotent
        and commits no event.
      x-required-permissions:
      - monitoring:write
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        default:
