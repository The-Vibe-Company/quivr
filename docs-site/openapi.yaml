        config and credential secret are validated against the kind's JSON Schema (see listConnectorKinds); a failure is 422
        invalid_config or invalid_credential with field pointing at the offending member. Replaying the same idempotency key
        and request returns the same instance (without re-enabling a disabled one); a different request under the same key
