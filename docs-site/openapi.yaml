        name:
          type: string
          minLength: 1
        version:
          type: string
        owner:
          type: object
          additionalProperties: false
          properties:
            kind:
              type: string
              enum:
              - engine
              - plugin
            plugin_id:
              type: string
              minLength: 1
            plugin_version:
              type: string
              minLength: 1
          required:
          - kind
        model:
          type: string
        dimensions:
          type: integer
          minimum: 0
        metric:
          type: string
          enum:
          - cosine
          - dot
          - l2
        indexes:
          type: array
          items:
            type: string
        query_modalities:
          type: array
          items:
            type: string
        role:
          type: string
          enum:
          - served
          - evaluation
        coverage:
          type: object
          additionalProperties: false
          properties:
            segments:
              type: integer
              minimum: 0
          required:
          - segments
      required:
      - vector_space_id
      - name
      - version
      - owner
      - model
      - dimensions
      - metric
      - indexes
      - query_modalities
      - role
      - coverage
    CorpusPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Corpus'
        next_page_cursor:
