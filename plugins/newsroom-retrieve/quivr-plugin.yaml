# Experimental editorial retrieval plugin implementing multi-branch entity
# retrieval, calibrated fusion (DBSF/CombMNZ), proximity & query-aspect
# coverage, inverted-pyramid lead-vs-body salience, and adaptive cascade
# reranking with structured surrogates.
id: newsroom.retrieve
version: 0.1.0
description: Multi-branch algorithmic retrieval with calibrated fusion, proximity/aspect coverage, inverted-pyramid salience, and optional adaptive cascade reranking.
compatibility:
  engine: ">=0.1.0 <0.3.0"
  plugin_api: ">=0.17.0 <0.21.0"
contributions:
  retrieval:
    profiles:
      default:
        description: Zero-inference-cost algorithmic retrieval combining multi-branch lexical+dense legs, calibrated fusion, aspect coverage, proximity, and inverted-pyramid salience.
        max_latency_ms: 500
        max_cost_cents: 0
      deep:
        description: Two-stage algorithmic retrieval with inverted-pyramid passage surrogates, optional adaptive confidence cascade, and tail-preserving HTTP reranking.
        max_latency_ms: 3000
        max_cost_cents: 1
    limits:
      max_rounds: 3
      max_requests: 8
      max_candidates: 100
configuration:
  schema:
    type: object
    additionalProperties: false
    properties:
      candidate_count:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
        description: Candidates requested per retrieval leg.
      fusion:
        type: string
        enum: [dbsf, convex, rrf]
        default: dbsf
        description: Multi-leg score fusion method.
      rrf_k:
        type: number
        minimum: 1
        maximum: 1000
        default: 60
        description: Rank constant k for RRF fusion.
      dense_weight:
        type: number
        minimum: 0
        maximum: 5
        default: 0.65
        description: Weight for full-query dense near_vector leg (or multi-view dense ensemble).
      dense_core_view:
        type: boolean
        default: false
        description: Enable View 2 dense near_vector using core-subject, stripped-question, or boilerplate-stripped query.
      dense_core_mode:
        type: string
        enum: [subject, question, stripped]
        default: subject
        description: Query view extraction mode for View 2 dense near_vector.
      dense_core_weight:
        type: number
        minimum: 0
        maximum: 5
        default: 0
        description: Relative weight of View 2 (core/clause) dense view against View 1 (weight 1.0).
      dense_clause_split_view:
        type: boolean
        default: false
        description: Decompose structured or multi-clause queries into dual complementary dense views (subject + stripped question) for aspect-conjunction fusion.
      dense_entity_view:
        type: boolean
        default: false
        description: Enable View 3 dense near_vector using compact named-entity, acronym, year, and key-facet noun phrase.
      dense_entity_weight:
        type: number
        minimum: 0
        maximum: 5
        default: 0
        description: Relative weight of View 3 (entity/key-facet) dense view against View 1 (weight 1.0).
      dense_entity_max_terms:
        type: integer
        minimum: 2
        maximum: 20
        default: 8
        description: Maximum high-specificity terms in the View 3 entity/key-facet dense query.
      dense_view_fusion:
        type: string
        enum: [weighted, max, geom, soft_min]
        default: weighted
        description: Multi-view dense aggregation operator (weighted convex sum, max-over-views, weighted geometric mean, or convex+min soft conjunction).
      dense_soft_min_lambda:
        type: number
        minimum: 0
        maximum: 1
        default: 0.35
        description: Conjunction weight lambda on min-over-views in soft_min multi-view dense fusion.
      round2_consensus_weight:
        type: number
        minimum: 0
        maximum: 2
        default: 0
        description: Enable Round-2 conservative consensus dense expansion (top dense∩lexical consensus terms) fused softly at this weight.
      round2_consensus_top_n:
        type: integer
        minimum: 3
        maximum: 30
        default: 10
        description: Top-N rank cutoff for Round-1 dense and lexical intersection.
      round2_consensus_docs:
        type: integer
        minimum: 2
        maximum: 5
        default: 2
        description: Maximum high-consensus seed documents used to extract shared Round-2 expansion terms.
      round2_max_terms:
        type: integer
        minimum: 1
        maximum: 8
        default: 3
        description: Maximum shared co-occurring consensus terms appended to the Round-2 dense query.
      round2_query_base:
        type: string
        enum: [full, core, entity]
        default: core
        description: Anchor query base prepended to Round-2 consensus expansion terms.
      temporal_align_weight:
        type: number
        minimum: 0
        maximum: 2
        default: 0
        description: Boost for exact year/numeric alignment when the query explicitly specifies years or numbers.
      temporal_conflict_penalty:
        type: number
        minimum: 0
        maximum: 2
        default: 0
        description: Soft penalty when the query specifies explicit year(s), a document mentions explicit year(s), and none match.
      dateline_entity_weight:
        type: number
        minimum: 0
        maximum: 2
        default: 0
        description: Boost for query named entities appearing in inline wire datelines, titles, or opening lead sentences.
      query_adaptive_alpha:
        type: boolean
        default: false
        description: Dynamically reduce dense weight on entity/digit-dense queries.
      lexical_weight:
        type: number
        minimum: 0
        maximum: 5
        default: 0.35
        description: Weight for full-query lexical BM25 leg.
      entity_leg:
        type: boolean
        default: false
        description: Enable third retrieval leg issuing a focused entity/key-term BM25 sub-query.
      entity_weight:
        type: number
        minimum: 0
        maximum: 5
        default: 0.25
        description: Weight for the focused entity/key-term BM25 leg.
      entity_max_terms:
        type: integer
        minimum: 2
        maximum: 16
        default: 6
        description: Maximum distinct high-specificity terms in the focused entity sub-query.
      combmnz_bonus:
        type: number
        minimum: 0
        maximum: 2
        default: 0
        description: Consensus multiplier bonus per additional independent leg matching a record (0 disables; 1 equals classic CombMNZ).
      aspect_coverage_weight:
        type: number
        minimum: 0
        maximum: 5
        default: 0
        description: Weight for pool-IDF-weighted query-aspect coverage over top candidates.
      missing_aspect_penalty:
        type: number
        minimum: 0
        maximum: 5
        default: 0
        description: Additional penalty applied when a candidate covers fewer than half of query aspects.
      coverage_penalty_gamma:
        type: number
        minimum: 0
        maximum: 5
        default: 0
        description: Superlinear pool-IDF coverage deficit penalty gamma * (1 - cov)^rho.
      coverage_penalty_rho:
        type: number
        minimum: 1
        maximum: 4
        default: 1.75
        description: Exponent rho for superlinear coverage deficit penalty.
      proximity_weight:
        type: number
        minimum: 0
        maximum: 5
        default: 0
        description: Weight for query-term proximity (pairwise min-span or shortest-cover + SDM bigrams).
      proximity_mode:
        type: string
        enum: [pairwise, sdm_span]
        default: pairwise
        description: Proximity formulation (pairwise log-decay vs shortest-cover span + ordered/unordered SDM bigrams).
      proximity_window:
        type: integer
        minimum: 2
        maximum: 200
        default: 25
        description: Maximum token span window for query-term pair proximity.
      salience_weight:
        type: number
        minimum: 0
        maximum: 5
        default: 0
        description: Weight for inverted-pyramid zone salience (title 3x, lead 2x, early body 1x, deep body 0.35x).
      exp_salience_weight:
        type: number
        minimum: 0
        maximum: 5
        default: 0
        description: Weight for continuous earliest-mention exponential decay exp(-pos_1/600).
      tail_only_penalty:
        type: number
        minimum: 0
        maximum: 2
        default: 0
        description: Penalty when primary query facet only appears once deep in body (pos_1 > 800, tf=1).
      lead_chars:
        type: integer
        minimum: 50
        maximum: 2000
        default: 300
        description: Character length of the inverted-pyramid lead zone at body offset 0.
      deep_chunk_penalty:
        type: number
        minimum: 0
        maximum: 2
        default: 0
        description: Penalty subtracted when the best matched segment starts past offset 0.
      passage_ratio_weight:
        type: number
        minimum: 0
        maximum: 5
        default: 0
        description: Enable ungrouped dense passage retrieval and weight the FirstP/MaxP lead-vs-body aboutness ratio.
      passage_support_weight:
        type: number
        minimum: 0
        maximum: 5
        default: 0
        description: Optional bonus for multi-passage dense corroboration (never penalizes single-passage documents).
      rerank_endpoint:
        type: string
        format: uri
        description: Optional HTTP(S) reranker endpoint for the deep profile.
      rerank_protocol:
        type: string
        enum: [tei, cohere]
        default: tei
      rerank_model:
        type: string
      rerank_top_k:
        type: integer
        minimum: 1
        maximum: 50
        default: 30
        description: Number of top Stage-1 candidates to send to the reranker while preserving the remaining tail.
      rerank_ranking:
        type: string
        enum: [rerank_only, linear, rrf]
        default: linear
      rerank_weight:
        type: number
        minimum: 0
        maximum: 1
        default: 0.85
      rerank_max_doc_chars:
        type: integer
        minimum: 200
        maximum: 32000
        default: 2500
      rerank_timeout_ms:
        type: integer
        minimum: 100
        maximum: 20000
        default: 8000
      surrogate_mode:
        type: string
        enum: [raw, inverted_pyramid]
        default: inverted_pyramid
        description: Document surrogate representation sent to the deep reranker.
      adaptive_cascade:
        type: boolean
        default: false
        description: Skip deep reranking when Stage-1 dense/lexical agreement and score margin exceed thresholds.
      cascade_jaccard_threshold:
        type: number
        minimum: 0
        maximum: 1
        default: 0.5
      cascade_margin_threshold:
        type: number
        minimum: 0
        maximum: 2
        default: 0.15
      cascade_dgap_threshold:
        type: number
        minimum: 0
        maximum: 10
        default: 0
        description: Optional Stage-1 dense distribution-shape Gap threshold (mean(1..5)-mean(25..50))/std for adaptive early-exit.
      log_diagnostics:
        type: boolean
        default: false
        description: Emit per-query algorithmic diagnostics to stderr.
secrets:
  - name: RERANKER_API_KEY
    required: false
    description: Optional Bearer token for an HTTPS rerank endpoint.
run:
  command: [go, run, .]
