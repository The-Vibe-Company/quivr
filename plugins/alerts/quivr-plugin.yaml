# Quivr plugin manifest (Plugin API 0.2). Check it with: quivr plugin inspect .
# Reference: contracts/plugins/v0/README.md in the Quivr repository, and
# README.md here for the expression reference.
id: alerts
version: 0.2.0
description: Keyword and described alerts. A keyword alert matches when an article's title and body satisfy a boolean keyword query, optionally filtered on its metadata; a described alert matches when a classifier (TypeSafe's Jev) judges the article fits a plain-language description.
compatibility:
  engine: ">=0.1.0 <0.2.0"
  plugin_api: ">=0.2.0 <0.3.0"
contributions:
  subscription:
    # A saved search's expression. Each alert kind is one oneOf branch told
    # apart by "kind". An installation without TYPESAFE_API_KEY leaves
    # "described" out of its pin's kinds, so the core refuses it at creation.
    expression_schema:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, match]
          properties:
            kind:
              const: keywords
              description: A boolean keyword query over the title and body, with optional metadata filters.
            match:
              $ref: "#/$defs/node1"
              description: The query tree. Groups nest at most 6 levels deep.
        - type: object
          additionalProperties: false
          required: [kind, description]
          properties:
            kind:
              const: described
              description: A plain-language description of the articles to alert on, judged by a classifier. The article's text is sent to TypeSafe.
            description:
              type: string
              minLength: 3
              maxLength: 1000
              pattern: "\\S"
              description: What the articles are about, in plain language, for example "Tensions between two countries over visa rules".
            sources:
              type: array
              minItems: 1
              maxItems: 64
              uniqueItems: true
              items:
                type: string
                minLength: 1
                maxLength: 256
                pattern: "\\S"
              description: Optional. Only articles from these Source Namespaces are judged; the others do not match and are never sent to the classifier. Compared like the keyword source filter, without case or accents. Absent, every source is judged.
      $defs:
        term:
          type: object
          additionalProperties: false
          required: [term]
          properties:
            term:
              type: string
              minLength: 1
              maxLength: 256
              pattern: "\\S"
              description: A word or an exact phrase. Case, accents and punctuation between words are ignored; words match whole.
        field:
          type: object
          additionalProperties: false
          required: [field, equals]
          properties:
            field:
              type: string
              maxLength: 256
              pattern: "^([a-z][a-z0-9_]{0,63}|/(source|provenance|extensions|accepted_at)(/.*)?)$"
              description: A field name (built in, or mapped in the plugin configuration) or a JSON Pointer into the article's metadata.
            equals:
              type: [string, number, boolean]
              maxLength: 256
              description: The value the field must have. Strings compare without case or accents; a list field matches when one element does.
        node1:
          oneOf:
            - $ref: "#/$defs/term"
            - $ref: "#/$defs/field"
            - type: object
              additionalProperties: false
              required: [all]
              properties:
                all: {type: array, minItems: 1, maxItems: 64, items: {$ref: "#/$defs/node2"}}
            - type: object
              additionalProperties: false
              required: [any]
              properties:
                any: {type: array, minItems: 1, maxItems: 64, items: {$ref: "#/$defs/node2"}}
            - type: object
              additionalProperties: false
              required: [not]
              properties:
                not: {$ref: "#/$defs/node2"}
        node2:
          oneOf:
            - $ref: "#/$defs/term"
            - $ref: "#/$defs/field"
            - type: object
              additionalProperties: false
              required: [all]
              properties:
                all: {type: array, minItems: 1, maxItems: 64, items: {$ref: "#/$defs/node3"}}
            - type: object
              additionalProperties: false
              required: [any]
              properties:
                any: {type: array, minItems: 1, maxItems: 64, items: {$ref: "#/$defs/node3"}}
            - type: object
              additionalProperties: false
              required: [not]
              properties:
                not: {$ref: "#/$defs/node3"}
        node3:
          oneOf:
            - $ref: "#/$defs/term"
            - $ref: "#/$defs/field"
            - type: object
              additionalProperties: false
              required: [all]
              properties:
                all: {type: array, minItems: 1, maxItems: 64, items: {$ref: "#/$defs/node4"}}
            - type: object
              additionalProperties: false
              required: [any]
              properties:
                any: {type: array, minItems: 1, maxItems: 64, items: {$ref: "#/$defs/node4"}}
            - type: object
              additionalProperties: false
              required: [not]
              properties:
                not: {$ref: "#/$defs/node4"}
        node4:
          oneOf:
            - $ref: "#/$defs/term"
            - $ref: "#/$defs/field"
            - type: object
              additionalProperties: false
              required: [all]
              properties:
                all: {type: array, minItems: 1, maxItems: 64, items: {$ref: "#/$defs/node5"}}
            - type: object
              additionalProperties: false
              required: [any]
              properties:
                any: {type: array, minItems: 1, maxItems: 64, items: {$ref: "#/$defs/node5"}}
            - type: object
              additionalProperties: false
              required: [not]
              properties:
                not: {$ref: "#/$defs/node5"}
        node5:
          oneOf:
            - $ref: "#/$defs/term"
            - $ref: "#/$defs/field"
            - type: object
              additionalProperties: false
              required: [all]
              properties:
                all: {type: array, minItems: 1, maxItems: 64, items: {$ref: "#/$defs/node6"}}
            - type: object
              additionalProperties: false
              required: [any]
              properties:
                any: {type: array, minItems: 1, maxItems: 64, items: {$ref: "#/$defs/node6"}}
            - type: object
              additionalProperties: false
              required: [not]
              properties:
                not: {$ref: "#/$defs/node6"}
        node6:
          oneOf:
            - $ref: "#/$defs/term"
            - $ref: "#/$defs/field"
            - type: object
              additionalProperties: false
              required: [all]
              properties:
                all: {type: array, minItems: 1, maxItems: 64, items: {$ref: "#/$defs/leaf"}}
            - type: object
              additionalProperties: false
              required: [any]
              properties:
                any: {type: array, minItems: 1, maxItems: 64, items: {$ref: "#/$defs/leaf"}}
            - type: object
              additionalProperties: false
              required: [not]
              properties:
                not: {$ref: "#/$defs/leaf"}
        leaf:
          oneOf:
            - $ref: "#/$defs/term"
            - $ref: "#/$defs/field"
    # Per-Subscription settings, validated by the core when a Subscription is created.
    configuration_schema:
      type: object
      additionalProperties: false
      properties:
        wait_for_enrichment:
          type: boolean
          description: Answer not_ready until the article is enriched (embeddings attached). Default false for keyword alerts, true for described alerts.
        threshold:
          type: number
          minimum: 0.2
          maximum: 0.95
          description: Described alerts only. The classifier score (probability of yes) at or above which the article matches. Default the installer's described.threshold, else 0.5.
    max_batch_size: 64
    # A described batch makes one classifier call, split only past its request size limit.
    timeout_ms: 20000
    retry:
      max_attempts: 3
# Installer configuration: set in the plugin pin's `configuration`.
configuration:
  schema:
    type: object
    additionalProperties: false
    properties:
      fields:
        type: object
        maxProperties: 64
        description: Field names usable in field filters, each mapped to a JSON Pointer into the article's metadata, for example author -> /extensions/<namespace>/data/author. They add to or replace the built-in names.
        propertyNames:
          pattern: "^[a-z][a-z0-9_]{0,63}$"
        additionalProperties:
          type: string
          maxLength: 256
          pattern: "^/(source|provenance|extensions|accepted_at)(/.*)?$"
      text_roles:
        type: array
        minItems: 1
        maxItems: 16
        uniqueItems: true
        items:
          type: string
          minLength: 1
          maxLength: 64
        description: Part roles whose text keyword terms search and described alerts send to the classifier (default title and body).
      described:
        type: object
        additionalProperties: false
        properties:
          threshold:
            type: number
            minimum: 0.2
            maximum: 0.95
            description: Default score threshold of described alerts (default 0.5). A Subscription may override it.
secrets:
  - name: TYPESAFE_API_KEY
    description: TypeSafe API key for described alerts, read from the plugin's environment. Without it keyword alerts work and described alerts cannot be decided; leave "described" out of the pin's kinds.
    required: false
run:
  command: [python3, -m, alerts]
