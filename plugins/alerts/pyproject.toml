[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quivr-alerts"
version = "0.3.0"
description = "Quivr first-party alert rules: keywords, local vector meaning checks and Jev, with mixed modes."
requires-python = ">=3.12"
license = "MIT"
# The Quivr Plugin SDK is installed from the Quivr repository (see README.md).
dependencies = ["quivr-plugin-sdk>=0.2.1,<0.4"]

[tool.setuptools]
packages = ["alerts"]
