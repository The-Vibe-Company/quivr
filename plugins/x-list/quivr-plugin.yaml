# First-party connector plugin: polls the posts of one X list through the X
# API v2 with an app-only bearer token, and withdraws posts deleted or made
# private at the source. With webhook mode on, posts of the list members also
# arrive in near real time through X Filtered Stream webhooks, which the core
# relays to receive; polling stays the fallback. The id and extension namespace keep the names of the
# former built-in x_list kind, so existing instances and Records carry over.
id: connector.x_list
version: 1.1.0
description: Polls the posts of an X list and withdraws posts deleted at the source.
compatibility:
  engine: ">=0.1.0 <0.2.0"
  plugin_api: ">=0.12.0 <0.13.0"
contributions:
  connector:
    kinds:
      x_list:
        description: Polls the posts of an X list and withdraws posts deleted at the source.
        config_schema:
          title: X list
          description: Polls the posts of an X list and withdraws posts deleted at the source.
          type: object
          additionalProperties: false
          required: [list_id]
          properties:
            list_id:
              type: string
              pattern: "^[0-9]{1,19}$"
              title: List ID
              description: Numeric identifier of the list.
              examples: ["1234567890123456789"]
            backfill_since:
              type: string
              minLength: 1
              title: Backfill since
              description: RFC 3339 timestamp, at most 7 days before the first poll.
              examples: ["2026-01-01T00:00:00Z"]
            max_reads_per_day:
              type: integer
              minimum: 100
              maximum: 100000000
              title: Maximum reads per day
              description: Daily cap on billed post reads.
            recheck_window_seconds:
              type: integer
              minimum: 3600
              maximum: 604800
              title: Deletion recheck window (seconds)
            recheck_interval_seconds:
              type: integer
              # At least 60; the plugin refuses less unless the pin sets
              # allow_short_recheck, which only a loopback test fake may use.
              minimum: 1
              maximum: 86400
              title: Deletion recheck interval (seconds)
              description: At least 60 seconds.
            webhook:
              type: object
              additionalProperties: false
              title: Real-time delivery
              description: Receive the posts of the list members through X Filtered Stream webhooks, with polling as the fallback. Needs the consumer_secret credential and a deployment public_url.
              properties:
                enabled: {type: boolean, default: false, title: Enabled}
                resync_interval_seconds:
                  type: integer
                  minimum: 5
                  maximum: 86400
                  default: 900
                  title: Member and webhook resync interval (seconds)
                poll_interval_seconds:
                  type: integer
                  minimum: 60
                  maximum: 86400
                  default: 900
                  title: Polling interval while webhooks work (seconds)
                max_rules:
                  type: integer
                  minimum: 1
                  maximum: 25000
                  default: 1000
                  title: Most Filtered Stream rules for this list
                max_rule_length:
                  type: integer
                  minimum: 64
                  maximum: 4096
                  default: 512
                  title: Longest Filtered Stream rule (characters)
        credential_schema:
          title: X API credential
          type: object
          additionalProperties: false
          required: [bearer_token]
          properties:
            bearer_token: {type: string, minLength: 1, title: Bearer token, writeOnly: true}
            consumer_secret: {type: string, minLength: 1, title: Consumer secret, writeOnly: true}
        default_interval_seconds: 120
        modes: [pull, push]
        api:
          routes:
            - name: receive
              method: POST
              path: receive
              auth: signature
              signature: {header: x-twitter-webhooks-signature, window_seconds: 300}
            - name: challenge
              method: GET
              path: receive
              auth: signature
              signature: {header: x-twitter-webhooks-signature, window_seconds: 300}
    timeout_ms: 25000
    limits:
      max_items: 100
      # The deletion recheck set tracks up to 2000 posts (about 210 KB), and a
      # webhook resync in progress the list members (about 100 KB for 5000).
      max_checkpoint_bytes: 524288
configuration:
  schema:
    type: object
    additionalProperties: false
    properties:
      api_endpoint:
        type: string
        pattern: "^https?://[^/]+"
        description: X API origin; default https://api.x.com. Point it at a local fake only in tests.
      allow_short_recheck:
        type: boolean
        default: false
        description: Accept recheck_interval_seconds below 60. Test stacks only; refused unless api_endpoint is a loopback address.
extensions:
  connector.x_list:
    "1":
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      required: [post_id, edit_history_post_ids]
      properties:
        post_id: {type: string}
        edit_history_post_ids: {type: array, items: {type: string}}
        url: {type: string}
        author: {type: object, properties: {id: {type: string}, username: {type: string}, name: {type: string}}}
        created_at: {type: string}
        lang: {type: string}
        conversation_id: {type: string}
        entities: {type: object}
        referenced_posts: {type: array, items: {type: object, properties: {type: {type: string}, id: {type: string}}}}
        media:
          type: array
          items:
            type: object
            properties:
              media_key: {type: string}
              type: {type: string}
              url: {type: string}
              preview_image_url: {type: string}
              alt_text: {type: string}
      additionalProperties: true
run:
  command: [go, run, .]
