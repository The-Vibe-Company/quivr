[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-text"
version = "0.1.0"
description = "Quivr reference normalizer: the text of a PDF, one Part per page."
requires-python = ">=3.12"
license = "MIT"
# The Quivr Plugin SDK is installed from the Quivr repository (see README.md).
# pypdf (BSD-3-Clause) is pinned so every installation extracts the same text;
# cryptography (Apache-2.0 OR BSD-3-Clause) lets it open AES-encrypted PDFs.
dependencies = ["quivr-plugin-sdk>=0.1,<0.7", "pypdf==6.19.0", "cryptography==50.0.1"]

[tool.setuptools]
packages = ["pdf_text"]
