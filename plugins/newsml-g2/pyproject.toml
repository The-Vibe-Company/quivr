[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "newsml-g2"
version = "0.1.1"
description = "Quivr normalizer for IPTC NewsML-G2 text news items."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["quivr-plugin-sdk>=0.6,<0.7", "defusedxml==0.7.1"]

[tool.setuptools]
packages = ["newsml_g2"]
