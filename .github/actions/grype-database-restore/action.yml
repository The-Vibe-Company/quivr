name: Restore the vulnerability database
description: Unpack the fresh database prepared by this workflow
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: grype-database
        path: ${{ runner.temp }}/grype-database
    - shell: bash
      run: |
        mkdir -p "$GRYPE_DB_CACHE_DIR"
        tar --zstd -xf "$RUNNER_TEMP/grype-database/grype-db.tar.zst" -C "$GRYPE_DB_CACHE_DIR"
