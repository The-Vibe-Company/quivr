name: Release images
# The coordinator merges a release-please PR; its published prerelease is the
# only publishing trigger. Pull requests never publish packages or signatures.
on:
  release:
    types: [published]
concurrency:
  group: release-images
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  prepare:
    if: startsWith(github.event.release.tag_name, 'v2.0.0-alpha.')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.release.outputs.matrix }}
      version: ${{ steps.release.outputs.version }}
      revision: ${{ steps.release.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r contracts/http/v0/checks/requirements.txt
      - id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 scripts/release_images.py --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" > release.json
          jq -r '"version=\(.version)", "matrix=\(.matrix|tojson)"' release.json >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: image
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ matrix.image }}:${{ needs.prepare.outputs.version }}
            ${{ matrix.image }}:sha-${{ needs.prepare.outputs.revision }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            REVISION=${{ needs.prepare.outputs.revision }}
            PLUGIN=${{ matrix.plugin }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the published runtime before signing
        env:
          IMAGE: ${{ matrix.image }}@${{ steps.image.outputs.digest }}
          PLUGIN: ${{ matrix.plugin }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REVISION: ${{ needs.prepare.outputs.revision }}
        run: python3 scripts/image_smoke.py "$IMAGE" --plugin "$PLUGIN" --version "$VERSION" --revision "$REVISION"
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign and verify the immutable digest
        env:
          IMAGE: ${{ matrix.image }}@${{ steps.image.outputs.digest }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign verify "$IMAGE" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release-images.yml@refs/tags/$RELEASE_TAG"
      - name: Record the signed image
        env:
          IMAGE: ${{ matrix.image }}@${{ steps.image.outputs.digest }}
        run: |
          mkdir -p signed-images
          image_name="${IMAGE%%@*}"
          printf '%s\n' "$IMAGE" > "signed-images/${image_name##*/}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.plugin || 'engine' }}
          path: signed-images/
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
          path: signed-images
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Advance latest-alpha only after every image passes and is signed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          cat signed-images/* | sort > images.txt
          # Rerunning an older release must not move the rolling alias backwards.
          published=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(any(.assets[]; .name == "images.txt")) | .tag_name' \
            | sort -V | tail -n 1)
          if [ "$(printf '%s\n' "$published" "$RELEASE_TAG" | sort -V | tail -n 1)" = "$RELEASE_TAG" ]; then
            while IFS= read -r image; do
              docker buildx imagetools create --prefer-index=false --tag "${image%@*}:latest-alpha" "$image"
            done < images.txt
          fi
          gh release upload "$RELEASE_TAG" images.txt --repo "$GITHUB_REPOSITORY" --clobber
          gh api "repos/$GITHUB_REPOSITORY/contents/CHANGELOG.md?ref=$RELEASE_TAG" --jq .content | base64 --decode > CHANGELOG.md
          gh release upload "$RELEASE_TAG" CHANGELOG.md --repo "$GITHUB_REPOSITORY" --clobber
