name: Release images
'on':
  release:
    types:
    - published
concurrency:
  group: release-images
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verification:
    if: startsWith(github.event.release.tag_name, 'v2.0.0-alpha.')
    uses: ./.github/workflows/verify.yml
    with:
      ref: ${{ github.event.release.tag_name }}
  prepare:
    if: startsWith(github.event.release.tag_name, 'v2.0.0-alpha.')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.release.outputs.matrix }}
      version: ${{ steps.release.outputs.version }}
      revision: ${{ steps.release.outputs.revision }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.event.release.tag_name }}
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: 3.12.15
    - run: python3 scripts/ci_fetch.py -- pip install --require-hashes -r scripts/ci-requirements-base.txt
    - uses: ./.github/actions/grype-database
    - id: release
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        python3 scripts/release_images.py --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" > release.json
        jq -r '"version=\(.version)", "matrix=\(.matrix|tojson)"' release.json >> "$GITHUB_OUTPUT"
        echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    needs:
    - verification
  build:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      GRYPE_DB_AUTO_UPDATE: false
      GRYPE_DB_VALIDATE_AGE: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ needs.prepare.outputs.revision }}
        persist-credentials: false
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      id: image
      with:
        context: .
        file: ${{ matrix.file }}
        target: ${{ matrix.target }}
        platforms: linux/amd64
        outputs: type=image,name=${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
        build-args: |
          VERSION=${{ needs.prepare.outputs.version }}
          REVISION=${{ needs.prepare.outputs.revision }}
          PLUGIN=${{ matrix.plugin }}
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: 3.12.15
    - name: Prepare the pinned E5 tokenizer fixture
      if: matrix.plugin == 'hosted-embed'
      run: python3 scripts/prepare_tokenizer.py
    - name: Check the published runtime before signing
      env:
        IMAGE: ${{ matrix.image }}@${{ steps.image.outputs.digest }}
        PLUGIN: ${{ matrix.plugin }}
        PLUGIN_ID: ${{ matrix.plugin_id }}
        VERSION: ${{ needs.prepare.outputs.version }}
        REVISION: ${{ needs.prepare.outputs.revision }}
      run: python3 scripts/image_smoke.py "$IMAGE" --plugin "$PLUGIN" --plugin-id "$PLUGIN_ID" --version "$VERSION" --revision "$REVISION"
    - name: Install checksum-verified inventory and scan tools
      env:
        TOOLS_DIR: ${{ runner.temp }}/security-tools
      run: |
        bash scripts/security_tools.sh syft "$TOOLS_DIR"
        bash scripts/security_tools.sh grype "$TOOLS_DIR"
        echo "$TOOLS_DIR" >> "$GITHUB_PATH"
    - name: Inventory the immutable image
      env:
        IMAGE: ${{ matrix.image }}@${{ steps.image.outputs.digest }}
        SBOM: sboms/${{ matrix.plugin_id && format('quivr-plugin-{0}', matrix.plugin_id) || 'quivr' }}.spdx.json
        SYFT_CHECK_FOR_APP_UPDATE: false
      run: |
        mkdir -p sboms
        syft "registry:$IMAGE" --output "spdx-json=$SBOM"
    - uses: ./.github/actions/grype-database-restore
    - name: Reject critical vulnerabilities with an available fix
      env:
        IMAGE: ${{ matrix.image }}@${{ steps.image.outputs.digest }}
        GRYPE_CHECK_FOR_APP_UPDATE: false
      run: bash scripts/scan_image.sh "registry:$IMAGE"
    - name: Pack bounded scan failure evidence
      if: failure()
      run: python3 scripts/ci_artifacts.py vulnerabilities.json scan-report.txt --output "${{ runner.temp }}/failure.tar.gz"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: failure()
      with:
        name: vulnerabilities-${{ matrix.plugin || 'engine' }}
        path: ${{ runner.temp }}/failure.tar.gz
        if-no-files-found: warn
        retention-days: 3
        compression-level: 0
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      with:
        cosign-release: v3.1.3
    - name: Sign, attest and verify the immutable image
      timeout-minutes: 5
      env:
        IMAGE: ${{ matrix.image }}@${{ steps.image.outputs.digest }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
        SBOM: sboms/${{ matrix.plugin_id && format('quivr-plugin-{0}', matrix.plugin_id) || 'quivr' }}.spdx.json
      run: |
        export COSIGN_CERTIFICATE_IDENTITY="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release-images.yml@refs/tags/$RELEASE_TAG"
        bash scripts/sign_image.sh "$IMAGE" "$SBOM"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: sbom-${{ matrix.plugin || 'engine' }}
        path: sboms/
        if-no-files-found: error
    - name: Record the signed image
      env:
        IMAGE: ${{ matrix.image }}@${{ steps.image.outputs.digest }}
      run: |
        mkdir -p signed-images
        image_name="${IMAGE%%@*}"
        printf '%s\n' "$IMAGE" > "signed-images/${image_name##*/}.txt"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: image-${{ matrix.plugin || 'engine' }}
        path: signed-images/
  publish:
    needs:
    - prepare
    - build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: image-*
        merge-multiple: true
        path: signed-images
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: sbom-*
        merge-multiple: true
        path: sboms
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Advance latest-alpha only after every image passes and is signed
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
        VERSION: ${{ needs.prepare.outputs.version }}
        REVISION: ${{ needs.prepare.outputs.revision }}
      run: |
        cat signed-images/* | sort > images.txt
        # Rerunning an older release must not move the rolling alias backwards.
        published=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
          --jq '.[] | select(any(.assets[]; .name == "images.txt")) | .tag_name' \
          | sort -V | tail -n 1)
        gh release upload "$RELEASE_TAG" sboms/*.spdx.json --repo "$GITHUB_REPOSITORY" --clobber
        gh release upload "$RELEASE_TAG" images.txt --repo "$GITHUB_REPOSITORY" --clobber
        gh api "repos/$GITHUB_REPOSITORY/contents/CHANGELOG.md?ref=$RELEASE_TAG" --jq .content | base64 --decode > CHANGELOG.md
        gh release upload "$RELEASE_TAG" CHANGELOG.md --repo "$GITHUB_REPOSITORY" --clobber
        while IFS= read -r image; do
          docker buildx imagetools create --prefer-index=false \
            --tag "${image%@*}:$VERSION" --tag "${image%@*}:sha-$REVISION" "$image"
        done < images.txt
        if [ "$(printf '%s\n' "$published" "$RELEASE_TAG" | sort -V | tail -n 1)" = "$RELEASE_TAG" ]; then
          while IFS= read -r image; do
            docker buildx imagetools create --prefer-index=false --tag "${image%@*}:latest-alpha" "$image"
          done < images.txt
        fi
env:
  DOCKER_BUILD_RECORD_UPLOAD: 'false'
  PIP_CONSTRAINT: ${{ github.workspace }}/scripts/ci-constraints.txt
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_RETRIES: '0'
  npm_config_fetch_retries: '0'
