name: Ingestion vector parity
on:
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ingestion-parity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  vectors:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: '3.12'
      - uses: actions/cache@v6
        with:
          path: |
            .scratch/e5-model
            .scratch/tokenizer
          key: models-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('third_party/e5/model-lock.json', 'plugins/core-ingest/profile.json', 'third_party/tokenizer/requirements-linux-x86_64.txt') }}
      - run: sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/julia* && df -h /
      # A parity failure is a job failure. Publishing evidence always runs.
      - run: make verify part=ingest-parity
      - uses: actions/upload-artifact@v7
        id: parity-artifact
        if: always()
        with:
          name: ingestion-vector-parity
          include-hidden-files: true
          path: |
            .scratch/quivr-verify-ingest-parity-*/report.json
            .scratch/quivr-verify-ingest-parity-*/report.md
            .scratch/quivr-verify-ingest-parity-*/readiness.json
            .scratch/quivr-verify-ingest-parity-*/core-ingest-parity.log
            .scratch/quivr-verify-ingest-parity-*/core-ingest-parity.jsonl
            .scratch/quivr-verify-ingest-parity-*/api*.log*
            .scratch/quivr-verify-ingest-parity-*/worker*.log*
            .scratch/quivr-verify-ingest-parity-*/tei.log
          if-no-files-found: error
      - if: always()
        run: python3 scripts/ci_summary.py "${{ steps.parity-artifact.outputs.artifact-url }}"
