# One merge-base selector feeds PR matrices. Main and releases verify every lane.
name: Text foundation
'on':
  push:
    branches:
    - main
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - labeled
    - unlabeled
    - edited
  workflow_dispatch: {}
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
concurrency:
  group: verify-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  paths-filter:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      groups: ${{ steps.select.outputs.groups }}
      parts: ${{ steps.select.outputs.parts }}
      images: ${{ steps.select.outputs.images }}
      has-parts: ${{ steps.select.outputs.has-parts }}
      has-images: ${{ steps.select.outputs.has-images }}
      site: ${{ steps.select.outputs.site }}
      full: ${{ steps.select.outputs.full }}
      migration-compatibility: ${{ steps.select.outputs.migration-compatibility }}
      vulnerabilities: ${{ steps.select.outputs.vulnerabilities }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        ref: ${{ inputs.ref || github.sha }}
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: 3.12.15
        cache: pip
        cache-dependency-path: |
          scripts/ci-requirements-*.txt
          scripts/ci-constraints.txt
    - run: python3 scripts/ci_fetch.py -- python3 -m pip install --require-hashes -r scripts/ci-requirements-base.txt
    - id: select
      run: python3 scripts/ci_select.py
  check-group:
    name: check ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.paths-filter.outputs.groups) }}
    services:
      evaluation-postgres:
        image: ${{ startsWith(matrix.group, 'eval-') && 'postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73'
          || '' }}
        env:
          POSTGRES_DB: evaluation_tests
          POSTGRES_USER: evaluation
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
        - 55433:5432
        options: --tmpfs /var/lib/postgresql/data:rw,size=512m --health-cmd "pg_isready -U evaluation -d evaluation_tests" --health-interval 2s
          --health-timeout 2s --health-retries 20
    env:
      EVAL_CONTROL_TEST_DSN: ${{ startsWith(matrix.group, 'eval-') && 'postgresql://evaluation@localhost:55433/evaluation_tests' || '' }}
      OPENBLAS_NUM_THREADS: 1
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        ref: ${{ inputs.ref || github.sha }}
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod
        cache-dependency-path: '**/go.sum'
    - name: Fetch pinned Go modules
      run: python3 scripts/ci_fetch.py -- go mod download
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      id: python
      with:
        python-version: 3.12.15
        cache: pip
        cache-dependency-path: |
          scripts/ci-requirements-*.txt
          scripts/ci-constraints.txt
    - run: python3 scripts/ci_fetch.py -- pip install --require-hashes -r scripts/ci-requirements-base.txt
    - if: startsWith(matrix.group, 'eval-')
      run: |
        python3 scripts/ci_fetch.py -- pip install --require-hashes -r scripts/ci-requirements-eval.txt
        python3 scripts/ci_fetch.py -- pip install --no-deps -e sdks/python
        python3 scripts/ci_fetch.py -- pip install --no-deps -e plugins/jev-rerank
    - if: startsWith(matrix.group, 'eval-')
      run: |
        curl --fail --silent --show-error --location --retry 1 https://github.com/FiloSottile/age/releases/download/v1.3.1/age-v1.3.1-linux-amd64.tar.gz -o "$RUNNER_TEMP/age.tar.gz"
        echo 'bdc69c09cbdd6cf8b1f333d372a1f58247b3a33146406333e30c0f26e8f51377  '"$RUNNER_TEMP/age.tar.gz" | sha256sum --check
        tar -xzf "$RUNNER_TEMP/age.tar.gz" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"
    - if: startsWith(matrix.group, 'eval-')
      run: docker exec -i "${{ job.services['evaluation-postgres'].id }}" psql -U evaluation -d evaluation_tests < deploy/mlflow/eval-control.sql
    - if: matrix.group == 'contracts'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24.21.0
    - run: make check check-group=${{ matrix.group }}
    - if: always()
      run: python3 scripts/check.py --summary
    - name: Pack bounded failure evidence
      if: failure()
      run: python3 scripts/ci_artifacts.py .scratch vulnerabilities.json --output "${{ runner.temp }}/failure.tar.gz"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: failure()
      with:
        name: failure-${{ matrix.group }}
        path: ${{ runner.temp }}/failure.tar.gz
        if-no-files-found: ignore
        retention-days: 3
        compression-level: 0
      id: failure-artifact
    needs:
    - paths-filter
  check:
    if: always()
    needs:
    - paths-filter
    - check-group
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.ref || github.sha }}
        persist-credentials: false
    - run: python3 scripts/ci_select.py --aggregate check
      env:
        CI_NEEDS: ${{ toJSON(needs) }}
  adapter-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.ref || github.sha }}
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod
        cache-dependency-path: '**/go.sum'
    - name: Fetch pinned Go modules
      run: python3 scripts/ci_fetch.py -- go mod download
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: 3.12.15
        cache: pip
        cache-dependency-path: |
          scripts/ci-requirements-*.txt
          scripts/ci-constraints.txt
    - run: make adapter-postgres args=-v
    - name: Pack bounded failure evidence
      if: failure()
      run: python3 scripts/ci_artifacts.py .scratch vulnerabilities.json --output "${{ runner.temp }}/failure.tar.gz"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: failure()
      with:
        name: failure-adapter-postgres
        path: ${{ runner.temp }}/failure.tar.gz
        if-no-files-found: ignore
        retention-days: 3
        compression-level: 0
      id: failure-artifact
  part:
    name: verify ${{ matrix.part }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.paths-filter.outputs.parts) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        ref: ${{ inputs.ref || github.sha }}
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod
        cache-dependency-path: '**/go.sum'
    - name: Fetch pinned Go modules
      run: python3 scripts/ci_fetch.py -- go mod download
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      id: python
      with:
        python-version: 3.12.15
        cache: pip
        cache-dependency-path: |
          scripts/ci-requirements-*.txt
          scripts/ci-constraints.txt
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          .scratch/e5-model
          .scratch/tokenizer
        key: models-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('third_party/e5/model-lock.json', 'plugins/core-ingest/profile.json',
          'third_party/tokenizer/requirements-linux-x86_64.txt') }}
    - if: matrix.part == 'demo'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24.21.0
        cache: npm
        cache-dependency-path: quivr-search/package-lock.json
    - if: matrix.part == 'demo'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('quivr-search/package-lock.json') }}
    - if: matrix.part == 'demo'
      run: python3 scripts/ci_fetch.py -- npm ci --prefix quivr-search
    - run: sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/julia*
        && df -h /
    - run: make verify part=${{ matrix.part }}
      env:
        QUIVR_VERIFY_BASE: ${{ needs.paths-filter.outputs.full != 'true' && (github.event.pull_request.base.sha || github.event.before) || '' }}
    - name: Pack bounded failure evidence
      if: failure()
      run: python3 scripts/ci_artifacts.py .scratch vulnerabilities.json --output "${{ runner.temp }}/failure.tar.gz"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: failure()
      with:
        name: failure-${{ matrix.part }}
        path: ${{ runner.temp }}/failure.tar.gz
        if-no-files-found: ignore
        retention-days: 3
        compression-level: 0
      id: failure-artifact
    - if: always()
      run: python3 scripts/ci_summary.py "${{ steps.failure-artifact.outputs.artifact-url }}"
    needs:
    - paths-filter
    if: needs.paths-filter.outputs.has-parts == 'true'
  migration-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        ref: ${{ inputs.ref || github.sha }}
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod
        cache-dependency-path: '**/go.sum'
    - name: Fetch pinned Go modules
      run: python3 scripts/ci_fetch.py -- go mod download
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      id: python
      with:
        python-version: 3.12.15
        cache: pip
        cache-dependency-path: |
          scripts/ci-requirements-*.txt
          scripts/ci-constraints.txt
    - run: python3 scripts/ci_fetch.py -- pip install --require-hashes -r scripts/ci-requirements-base.txt
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          .scratch/e5-model
          .scratch/tokenizer
        key: models-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('third_party/e5/model-lock.json', 'plugins/core-ingest/profile.json',
          'third_party/tokenizer/requirements-linux-x86_64.txt') }}
    - run: sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/julia*
    - run: make migration-compatibility args='--base ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}'
    - name: Pack bounded failure evidence
      if: failure()
      run: python3 scripts/ci_artifacts.py .scratch vulnerabilities.json --output "${{ runner.temp }}/failure.tar.gz"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: failure()
      with:
        name: failure-migration-compatibility
        path: ${{ runner.temp }}/failure.tar.gz
        if-no-files-found: ignore
        retention-days: 3
        compression-level: 0
      id: failure-artifact
    needs:
    - paths-filter
    if: needs.paths-filter.outputs.migration-compatibility == 'true'
  vulnerabilities:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ inputs.ref || github.sha }}
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod
        cache-dependency-path: '**/go.sum'
    - name: Fetch pinned Go modules
      run: python3 scripts/ci_fetch.py -- go mod download
    - run: python3 scripts/ci_fetch.py -- go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
    - name: Check every Go module for reachable vulnerabilities
      run: |
        while IFS= read -r module; do
          echo "Scanning $module"
          (cd "$(dirname "$module")" && govulncheck ./...)
        done < <(git ls-files '**/go.mod' 'go.mod')
    - name: Pack bounded failure evidence
      if: failure()
      run: python3 scripts/ci_artifacts.py .scratch vulnerabilities.json --output "${{ runner.temp }}/failure.tar.gz"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: failure()
      with:
        name: failure-vulnerabilities
        path: ${{ runner.temp }}/failure.tar.gz
        if-no-files-found: ignore
        retention-days: 3
        compression-level: 0
      id: failure-artifact
    needs:
    - paths-filter
    if: needs.paths-filter.outputs.vulnerabilities == 'true'
  image-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ needs.paths-filter.outputs.images }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ inputs.ref || github.sha }}
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: 3.12.15
        cache: pip
        cache-dependency-path: |
          scripts/ci-requirements-*.txt
          scripts/ci-constraints.txt
    - run: python3 scripts/ci_fetch.py -- pip install --require-hashes -r scripts/ci-requirements-base.txt
    - uses: ./.github/actions/grype-database
    needs:
    - paths-filter
    if: needs.paths-filter.outputs.has-images == 'true'
  image-vulnerabilities:
    needs:
    - paths-filter
    - image-inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GRYPE_DB_AUTO_UPDATE: false
      GRYPE_DB_VALIDATE_AGE: true
      COSIGN_PASSWORD: ''
    services:
      registry:
        image: registry:3.0.0@sha256:6c5666b861f3505b116bb9aa9b25175e71210414bd010d92035ff64018f9457e
        ports:
        - 5000:5000
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.image-inventory.outputs.matrix) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ inputs.ref || github.sha }}
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
    - name: Build the release runtime without publishing
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      with:
        context: .
        file: ${{ matrix.file }}
        target: ${{ matrix.target }}
        platforms: linux/amd64
        load: true
        tags: quivr-scan:local
        build-args: |
          VERSION=dev
          REVISION=${{ github.sha }}
          PLUGIN=${{ matrix.plugin }}
        cache-from: type=gha,scope=scan-${{ matrix.plugin || 'engine' }}
        cache-to: type=gha,mode=max,scope=scan-${{ matrix.plugin || 'engine' }}
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      if: matrix.plugin == 'hosted-embed'
      with:
        python-version: 3.12.15
        cache: pip
        cache-dependency-path: |
          scripts/ci-requirements-*.txt
          scripts/ci-constraints.txt
    - name: Prepare the pinned E5 tokenizer fixture
      if: matrix.plugin == 'hosted-embed'
      run: python3 scripts/prepare_tokenizer.py
    - name: Check hosted image token packing offline
      if: matrix.plugin == 'hosted-embed'
      env:
        REVISION: ${{ github.sha }}
      run: python3 scripts/image_smoke.py quivr-scan:local --plugin hosted-embed --plugin-id hosted.embed --version dev --revision "$REVISION"
    - name: Install checksum-verified inventory and scan tools
      env:
        TOOLS_DIR: ${{ runner.temp }}/security-tools
      run: |
        bash scripts/security_tools.sh syft "$TOOLS_DIR"
        bash scripts/security_tools.sh grype "$TOOLS_DIR"
        echo "$TOOLS_DIR" >> "$GITHUB_PATH"
    - uses: ./.github/actions/grype-database-restore
    - name: Inventory the image in the local registry
      env:
        SYFT_CHECK_FOR_APP_UPDATE: false
      run: |
        docker tag quivr-scan:local localhost:5000/quivr-check:local
        docker push localhost:5000/quivr-check:local
        image=$(docker inspect --format '{{json .RepoDigests}}' localhost:5000/quivr-check:local | jq -r '.[] | select(startswith("localhost:5000/quivr-check@sha256:"))')
        echo "IMAGE=$image" >> "$GITHUB_ENV"
        syft "registry:$image" --output spdx-json=sbom.spdx.json
    - name: Reject critical vulnerabilities with an available fix
      run: bash scripts/scan_image.sh "registry:$IMAGE"
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      with:
        cosign-release: v3.1.3
    - name: Sign, attest and verify without publishing packages
      timeout-minutes: 5
      run: |
        timeout --kill-after=5s 15s cosign generate-key-pair --timeout 10s --output-key-prefix "$RUNNER_TEMP/image-check"
        bash scripts/sign_image.sh "$IMAGE" sbom.spdx.json "$RUNNER_TEMP/image-check.key" "$RUNNER_TEMP/image-check.pub"
    - name: Pack bounded failure evidence
      if: failure()
      run: python3 scripts/ci_artifacts.py .scratch vulnerabilities.json --output "${{ runner.temp }}/failure.tar.gz"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: failure()
      with:
        name: failure-image-${{ matrix.plugin || 'engine' }}
        path: ${{ runner.temp }}/failure.tar.gz
        if-no-files-found: ignore
        retention-days: 3
        compression-level: 0
      id: failure-artifact
    if: needs.paths-filter.outputs.has-images == 'true'
  verify:
    if: always()
    needs:
    - paths-filter
    - check
    - adapter-postgres
    - part
    - migration-compatibility
    - vulnerabilities
    - image-inventory
    - image-vulnerabilities
    - site
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.ref || github.sha }}
        persist-credentials: false
    - run: python3 scripts/ci_select.py --aggregate verify
      env:
        CI_NEEDS: ${{ toJSON(needs) }}
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.ref || github.sha }}
        persist-credentials: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24.21.0
        cache: npm
        cache-dependency-path: .github/tools/package-lock.json
    - run: |
        mkdir -p .scratch/ci-tools
        cp .github/tools/package*.json .scratch/ci-tools/
        python3 scripts/ci_fetch.py -- npm ci --prefix .scratch/ci-tools --ignore-scripts --no-audit --no-fund
    - run: make docs-site-check MINT="$GITHUB_WORKSPACE/.scratch/ci-tools/node_modules/.bin/mint"
    needs:
    - paths-filter
    if: needs.paths-filter.outputs.site == 'true'
    env:
      MINTLIFY_TELEMETRY_DISABLED: '1'
env:
  PIP_CONSTRAINT: ${{ github.workspace }}/scripts/ci-constraints.txt
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_RETRIES: '0'
  npm_config_fetch_retries: '0'
