name: Search quality
# Measurements run on coordinator machines. CI previews licence tiers and uses fixtures only.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search-quality-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check offline evaluation fixtures
        run: python3 -m unittest discover -s scripts/eval -p 'test_*.py'
      - name: Preview default suite without downloading data
        run: python3 scripts/eval/run.py --list-sets
