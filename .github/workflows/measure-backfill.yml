name: Backfill freshness
# Live ingestion freshness while a backfill runs (THE-784). A measurement with
# a reported target, not a pull-request gate (docs/agents/testing.md): it runs
# on demand and on pull requests that change the backfill. A missed target is
# a finding in the summary; only harness or dependency errors fail this job.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - internal/backfill/**
      - scripts/measure_backfill.py
      - .github/workflows/measure-backfill.yml
permissions:
  contents: read
concurrency:
  group: backfill-freshness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: make measure-backfill
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backfill-freshness
          path: |
            .scratch/quivr-measure-backfill-*/backfill-measurement.json
            .scratch/quivr-measure-backfill-*/backfill-measurement.md
            .scratch/quivr-measure-backfill-*/api*.log*
            .scratch/quivr-measure-backfill-*/worker*.log*
          if-no-files-found: ignore
          # The stack lives under .scratch/, a hidden folder.
          include-hidden-files: true
      - if: always()
        run: cat .scratch/quivr-measure-backfill-*/backfill-measurement.md | tee -a "$GITHUB_STEP_SUMMARY" || true
