name: Retrieval baseline
# Explicit performance/quality measurement (THE-661). Non-required: a missed
# latency target or relevance deficit is a reported finding; only harness or
# dependency errors fail this job.
# Dispatch-only (THE-675): the job takes ~40 minutes, so ordinary PRs never start
# it. Run it from the Actions tab or `gh workflow run measure.yml --ref <branch>`.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: retrieval-baseline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make measure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-baseline
          include-hidden-files: true
          path: |
            .scratch/quivr-measure-*/measurement.json
            .scratch/quivr-measure-*/measurement.md
            .scratch/quivr-measure-*/api*.log*
            .scratch/quivr-measure-*/worker*.log*
            .scratch/quivr-measure-*/migrate*.log*
            .scratch/quivr-measure-*/postgres.log
            .scratch/quivr-measure-*/temporal.log
            .scratch/quivr-measure-*/seaweed.log
            .scratch/quivr-measure-*/weaviate.log
            .scratch/quivr-measure-*/tei.log
          if-no-files-found: warn
      - if: always()
        run: cat .scratch/quivr-measure-*/measurement.md >> "$GITHUB_STEP_SUMMARY" || true
