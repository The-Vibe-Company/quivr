name: Retrieval baseline
# Explicit performance/quality measurement (THE-661). Non-required: a missed
# latency target or relevance deficit is a reported finding; only harness or
# dependency errors fail this job.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/measure.py
      - scripts/measure_metrics.py
      - scripts/local.py
      - scripts/prepare_embeddings.py
      - scripts/prepare_tokenizer.py
      - tests/measurement/**
      - internal/adapters/weaviate/**
      - internal/retrieval/**
      - internal/processing/**
      - internal/adapters/tokenizer/**
      - internal/adapters/tei/**
      - internal/transport/httpapi/**
      - cmd/quivr/**
      - deploy/compose/compose.yaml
      - third_party/**
      - .github/workflows/measure.yml
permissions:
  contents: read
concurrency:
  group: retrieval-baseline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: make measure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-baseline
          include-hidden-files: true
          path: |
            .scratch/quivr-measure-*/measurement.json
            .scratch/quivr-measure-*/measurement.md
            .scratch/quivr-measure-*/api*.log*
            .scratch/quivr-measure-*/worker*.log*
            .scratch/quivr-measure-*/migrate*.log*
            .scratch/quivr-measure-*/postgres.log
            .scratch/quivr-measure-*/temporal.log
            .scratch/quivr-measure-*/seaweed.log
            .scratch/quivr-measure-*/weaviate.log
            .scratch/quivr-measure-*/tei.log
          if-no-files-found: warn
      - if: always()
        run: cat .scratch/quivr-measure-*/measurement.md >> "$GITHUB_STEP_SUMMARY" || true
