name: Coverage measurement
# Fixed p95 regression gate for THE-1231. PRs use the fast owner fixture;
# nightly and manual runs retain the million-segment scale measurement.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - internal/adapters/postgres/**
      - internal/retrieval/**
      - migrations/**
      - .github/workflows/measure-coverage.yml
permissions:
  contents: read
concurrency:
  group: coverage-measurement-${{ github.ref }}
  cancel-in-progress: true
jobs:
  vector-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 10 || 30 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: make adapter-postgres args='-v -run ^TestIndependentEvaluationProjectionCoverage$'
        env:
          # Keep bulk seeding out of the PR deadline; search still has p95 <1s.
          QUIVR_MEASURE: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vector-coverage
          include-hidden-files: true
          path: .scratch/quivr-adapter-pg-*/adapter-postgres.log
          if-no-files-found: warn
