name: Adapter measurements
# Measurements that report numbers without a pass/fail threshold stay out of the
# pull-request path (docs/agents/testing.md). They run nightly, on demand, and on
# pull requests that change what they measure. Only harness or dependency errors
# fail those jobs. Coverage has a fixed p95 regression threshold (THE-1231).
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - plugins/core-ingest/**
      - scripts/prepare_tokenizer.py
      - third_party/tokenizer/**
      - .github/workflows/measure-adapters.yml
      - internal/adapters/postgres/space*.go
      - internal/retrieval/**
      - migrations/**
permissions:
  contents: read
concurrency:
  group: adapter-measurements-${{ github.ref }}
  cancel-in-progress: true
jobs:
  vector-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: make adapter-postgres args='-v -run ^TestIndependentEvaluationProjectionCoverage$'
        env:
          QUIVR_MEASURE: '1'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vector-coverage
          include-hidden-files: true
          path: .scratch/quivr-adapter-pg-*/adapter-postgres.log
          if-no-files-found: warn
  tokenizer-cost:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # The pinned offline tokenizer only: no stack, no model weights.
      - run: |
          mkdir -p .scratch/measure-adapters
          # pip may print to stdout while preparing, so the config is written by Python itself.
          python3 -c 'import json,sys;sys.path.insert(0,"scripts");from prepare_tokenizer import prepare;json.dump({"tei_url":"","tokenizer":prepare()},open(".scratch/measure-adapters/config.json","w"))'
      - run: set -o pipefail; cd plugins/core-ingest && go test -count=1 -v -run '^TestTokenizerQueryCost$' . | tee ../../.scratch/measure-adapters/tokenizer-cost.log
        env:
          QUIVR_MEASURE: '1'
          QUIVR_CORE_INGEST_CONFIG: ${{ github.workspace }}/.scratch/measure-adapters/config.json
      - if: always()
        run: |
          { echo '## Tokenizer query cost'; echo '```'; grep 'THE-777' .scratch/measure-adapters/tokenizer-cost.log || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
