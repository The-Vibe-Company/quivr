name: Adapter measurements
# Measurements that report numbers without a pass/fail threshold stay out of the
# pull-request path (docs/agents/testing.md). They run nightly, on demand, and on
# pull requests that change what they measure. Only harness or dependency errors
# fail this job. Today: the per-search tokenizer cost (TestTokenizerQueryCost, THE-675).
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - internal/adapters/tokenizer/**
      - internal/processing/profile.json
      - scripts/token_offsets.py
      - scripts/prepare_tokenizer.py
      - third_party/tokenizer/**
      - .github/workflows/measure-adapters.yml
permissions:
  contents: read
concurrency:
  group: adapter-measurements-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tokenizer-cost:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The pinned offline tokenizer only: no stack, no model weights.
      - run: |
          mkdir -p .scratch/measure-adapters
          # pip may print to stdout while preparing, so the config is written by Python itself.
          python3 -c 'import json,sys;sys.path.insert(0,"scripts");from prepare_tokenizer import prepare;json.dump({"tokenizer":prepare()},open(".scratch/measure-adapters/config.json","w"))'
      - run: set -o pipefail; go test -count=1 -v -run '^TestTokenizerQueryCost$' ./internal/adapters/tokenizer | tee .scratch/measure-adapters/tokenizer-cost.log
        env:
          QUIVR_MEASURE: '1'
          QUIVR_ADAPTER_CONFIG: ${{ github.workspace }}/.scratch/measure-adapters/config.json
      - if: always()
        run: |
          { echo '## Tokenizer query cost'; echo '```'; grep 'THE-675' .scratch/measure-adapters/tokenizer-cost.log || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
