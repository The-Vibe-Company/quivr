name: Live upgrade
'on':
  workflow_dispatch: null
  schedule:
  - cron: 53 3 * * *
permissions:
  contents: read
concurrency:
  group: live-upgrade-${{ github.ref }}
  cancel-in-progress: true
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: 3.12.15
    - run: make measure-upgrade
    - if: always()
      run: cat .scratch/quivr-measure-upgrade-*/upgrade-measurement.md | tee -a "$GITHUB_STEP_SUMMARY" || true
    - name: Pack bounded failure evidence
      if: failure()
      run: python3 scripts/ci_artifacts.py .scratch vulnerabilities.json --output "${{ runner.temp }}/failure.tar.gz"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: failure()
      id: failure-artifact
      with:
        name: live-upgrade
        path: ${{ runner.temp }}/failure.tar.gz
        if-no-files-found: ignore
        retention-days: 3
        compression-level: 0
env:
  PIP_CONSTRAINT: ${{ github.workspace }}/scripts/ci-constraints.txt
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_RETRIES: '0'
  npm_config_fetch_retries: '0'
